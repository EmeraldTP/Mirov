*Decodificare.** 3Ah = 0011 1010 — este LDA, „încarcă A din memorie”. Decodificatorul știe: LDA mai are 2 octeți — adresa celulei. Ei trebuie citiți înainte de a executa instrucțiunea.","**Decodificare.** C3h = 1100 0011 — este JMP, „salt”. După cod urmează 2 octeți ai adresei de salt."],operand:[(j,addr,v,pc1)=>`**Citirea operandului.** Procesorul citește octetul următor al instrucțiunii de la adresa ${addr}: acesta este **${v}** — numărul 5 care trebuie încărcat. PC = ${pc1}.`,()=>"",()=>"",(j,addr,v,pc1)=>j===1?`**Citirea operandului.** Octetul de la adresa ${addr}: **${v}** — octetul inferior al adresei celulei. PC = ${pc1}.`:`**Citirea operandului.** Octetul de la adresa ${addr}: **${v}** — octetul superior. Acum procesorul cunoaște toată adresa: 0081h. PC = ${pc1}.`,(j,addr,v,pc1)=>j===1?`**Citirea operandului.** Octetul de la adresa ${addr}: **${v}** — octetul inferior al adresei de salt. PC = ${pc1}.`:`**Citirea operandului.** Octetul de la adresa ${addr}: **${v}** — octetul superior. Adresa de salt: 0000h.`],exec:["**Execuție.** Numărul citit, 05h, se scrie în registrul A. Memoria nu mai este necesară — totul a fost deja citit.","**Execuție.** Valoarea lui A (05h) se copiază în B. În A ea rămâne și ea — copierea nu „mută” datele.","**Execuție.** Unitatea aritmetică și logică adună A și B: 5 + 5 = 10 (0Ah). Rezultatul se scrie în A, indicatorii se actualizează.","**Execuție.** Acum procesorul accesează **datele**: pune adresa 0081h (luată din instrucțiune, nu din PC) și citește octetul 11h. Acesta ajunge în A.","**Execuție.** În PC se scrie adresa de salt 0000h. Altceva nu se mai întâmplă — dar instrucțiunea următoare va fi citită de la începutul programului."],next:(pc,jump)=>jump?`**Instrucțiunea următoare.** PC = ${pc}: programul va merge în cerc — din nou MVI A, 05h. Așa funcționează buclele.`:`**Instrucțiunea următoare.** Instrucțiunea s-a executat. PC = ${pc} indică deja instrucțiunea următoare — ciclul reîncepe cu extragerea.`},groupsH:"Grupe de instrucțiuni",groupsP:"Toate instrucțiunile 8080 se împart în cinci grupe. Lista completă — fila 6; subprogramele și stiva — fila 4, întreruperile — fila 5."}});ui.ro.helper={title:"Sisteme de numerație",short:"Sisteme",label:"Deschide ghidul sistemelor de numerație și convertorul",hint:"Cât câmpul este gol — tabelul numerelor 0…20. Introduceți un număr și îl veți vedea în toate sistemele, codul lui într-un octet și numerele vecine.",placeholder:"216, −40, D8h, 11011000b",clear:"Șterge",inBase:"Introducere în baza",auto:"auto",bad:"Numărul nu a putut fi interpretat în sistemul ales.",width:"Păstrează în",bits:"biți",stored:w=>`Codul într-o celulă de ${w} biți (cod complementar, bitul roșu este bitul de semn):`,asU:"citește fără semn",asS:"citește cu semn",negNote:(m,code)=>`−${m} se păstrează ca ${code}: ${code} = 2ⁿ − ${m}. Verificare: inversați biții și adunați 1 — se obține ${m}.`,noFit:(w,min,max)=>`În ${w} biți încap numere de la ${min} la ${max}.`,tableTitle:"Numerele 0…20 (apăsați un rând)",neighbors:"Numere vecine",rowClick:"Apăsați pe un rând — numărul ajunge în câmpul de introducere."};Object.assign(ui.ro.numbers,{sysNote:"Cum se notează baza. În matematică — cu indice: 1011₂, 102₃, 23₄, 13₈, 11₁₀, B₁₆ (peste tot același număr 11). În asamblor — cu o literă la sfârșit: 1011b (binary, binar), 13o sau 13q (octal), 11 sau 11d (decimal, zecimal), 0Bh (hex; dacă numărul începe cu o literă, în față se scrie 0). Pentru bazele 3 și 4 nu există sufix în asamblor; pentru orice bază există o notație cu litera r (radix — bază) după baza însăși: 3r102 (ternary, ternar), 4r23 (quaternary, cuaternar) — așa se scrie în Smalltalk, în Common Lisp — #3r102, #4r23. În C/Python: 0b1011, 0o13, 0xB.",notation:{10:"11, 11d",2:"1011b, 1011₂",3:"102₃",4:"23₄",8:"13o, 13₈",16:"0Bh, B₁₆"},numberIs:"Numărul:",sumLine:"Suma blocurilor:",posHint:"Alegeți baza. Un clic pe o cifră o mărește cu 1 (butonul drept al mouse-ului o micșorează). Fiecare bloc: cifra × baza la puterea rangului (în paranteze — valoarea puterii) = contribuția rangului. Blocurile se adună.",wheelHint:"Rotiți inelul cu butoanele ±1. În exterior — valori fără semn, în interior — cu semn. Indicatorii din dreapta arată ce s-a întâmplat la ultimul pas.",wheelIdle:"pas obișnuit: nici transport, nici depășire",wheelCarry:"transport! Pentru numere fără semn rezultatul nu a încăput în 4 biți: CY = 1",wheelOvf:"depășire cu semn! Pentru numere cu semn rezultatul a sărit 7 ↔ −8: V = 1",wheelCyLbl:"transport: trecerea 15 ↔ 0",wheelVLbl:"depășire cu semn: trecerea 7 ↔ −8",wheelBits:"biți",wheelU:"fără semn (exterior)",wheelS:"cu semn (interior)",wheelL1:"- - granița 15 | 0: transport",wheelL2:"- - granița 7 | −8: depășire cu semn"});Object.assign(ui.ro.numbers,{fmtHint:"Rezumatul secțiunii. Aceiași n biți pot păstra oricare dintre cele patru formate — diferă doar regulile de citire. Alegeți numărul de biți și comparați domeniul și pasul: cu cât domeniul este mai mare, cu atât pasul este mai grosier.",weightCheck:"Verificare prin ponderi",cmpH:"Aceiași biți — două citiri",cmpP:["Codul din celulă este unul singur, dar numărul depinde de felul în care îl citim. Fără semn, 1111b este 15; cu semn — −1. Procesorului nu-i pasă: adună biții la fel, iar două indicatoare arată ce s-a întâmplat la limită: **CY** pentru citirea fără semn, depășirea cu semn pentru citirea cu semn."],bcdH:"BCD: cifre zecimale în tetrade",bcdP:["Uneori un număr este mai comod de păstrat nu în binar, ci **cifră cu cifră**: fiecare tetradă conține o cifră zecimală 0…9 (BCD, binary-coded decimal). Așa numărul se afișează ușor pe un indicator și banii se numără fără erori de rotunjire, dar un octet cuprinde doar 0…99 în loc de 0…255. 8080 are pentru această aritmetică instrucțiunea **DAA** și indicatorul **AC** (fila 6)."],bcdLab:"Un număr — două coduri",bcdHint:"Introduceți un număr 0…99 și comparați codul BCD cu binarul obișnuit.",bcdNum:"Număr",bcdHead:["Cod","Biți","Hex","Cum îl citește procesorul fără semn"],bcdRowHow:"fiecare tetradă — o cifră zecimală",bcdBin:"Binar",bcdBinHow:"întreg obișnuit fără semn",bcdNote:"În BCD notația hexazecimală coincide cu numărul zecimal (42 → 42h), de aceea se citește ușor într-un dump de memorie. Tetradele A…F nu sunt permise în BCD."});Object.assign(ui.ro.numbers.arith,{inBase:"Introducere A și B în baza",badIn:"nu este număr în această bază",inByte:"în octet:",inBits:w=>`în ${w} biți:`,bitsW:"biți",wTitle:m=>`Lățimea calculului: de la 2 la ${m} biți`,cut:(n,v,w,k)=>`${n} = ${v} nu încape în ${w} biți — în calcul intră doar cei ${w} biți inferiori: ${k}. Măriți lățimea.`,wNote:w=>`UAL-ul lui 8080 este pe 8 biți; din aritmetica pe 16 biți are doar adunarea DAD, care modifică numai indicatorul CY. Indicatorii pentru rezultatul pe ${w} biți sunt arătați aici după aceleași reguli ca pentru un octet.`,checkConv:v=>`Verifică ${v} în convertor`,carryOut:(sum,r,w=8)=>w===8?`Suma ${sum} nu încape într-un octet (maximum 255): al nouălea bit a trecut în indicatorul CY, iar în octet a rămas ${r} = ${sum} − 256.`:`Suma ${sum} nu încape în ${w} biți (maximum ${2**w-1}): bitul ${w+1} a trecut în indicatorul CY, iar în ${w} biți a rămas ${r} = ${sum} − ${2**w}.`,ovfText:(a,b,r,op,w=8)=>{const t=op==="+"?a+b:a-b;const h=2**(w-1);return`Dacă numerele sunt considerate cu semn: ${a} ${op} ${b} = ${t}, iar acesta este în afara intervalului −${h}…${h-1}. De ce s-a obținut ${r}: în codul complementar bitul superior nu valorează +${h}, ci −${h}. Rezultatul ${t>0?"a depășit limita de sus":"a coborât sub limita de jos"} a intervalului, iar aceiași ${w} biți se citesc ca ${t} ${t>0?"−":"+"} ${2*h} = ${r}. Semnul unei astfel de erori: semnul rezultatului contrazice semnele operanzilor (de exemplu, suma a două numere pozitive a ieșit negativă).`;},readTitle:"Cum ne dăm seama că rezultatul este negativ și cum îi aflăm valoarea",read1T:"Pasul 1. Privim bitul superior (de semn) — acesta este indicatorul S",read1neg:"bitul superior = 1: numărul este negativ (în cod complementar).",read1pos:"bitul superior = 0: numărul este pozitiv, valoarea lui se citește direct.",read2T:"Pasul 2. Aflăm modulul: inversăm toți biții și adunăm 1",readRes:"rezultat",readAbs:"modul",read3T:"Concluzie",readCy1:(w=8)=>`Indicatorul CY = 1 (împrumut) confirmă: A este mai mic decât B, a trebuit „împrumutat” un 1 dintr-un al ${w===8?"nouălea":`${w+1}-lea`} rang inexistent — de aceea diferența este negativă.`,readCy0:"Indicatorul CY = 0: nu a fost împrumut, A ≥ B — diferența este nenegativă.",readMismatch:(a,b,t,sr,w=8)=>`Aici CY și S nu coincid: dacă A și B sunt numere fără semn, diferența reală ${a} − ${b} = ${t} nu încape ${w===8?"într-un octet":`în ${w} biți`} cu semn (−${2**(w-1)}…${2**(w-1)-1}), iar citirea „cu semn” (${sr}) este greșită. Folosiți CY pentru numere fără semn și S (împreună cu V) pentru numere cu semn.`,mulExpl:["Înmulțim „în coloană”, ca la școală, dar mai simplu: fiecare cifră a înmulțitorului B este doar 0 sau 1, deci fiecare rând este fie o copie a lui A, fie zerouri.","**Deplasarea la stânga cu k ranguri = înmulțirea cu 2ᵏ** — ca în zecimal, când adăugăm k zerouri (13 → 130 → 1300). Rândul pentru rangul k este A deplasat cu k ranguri, adică A·2ᵏ.","Adunăm toate rândurile. La fel înmulțește un program pentru 8080: verifică bitul următor al lui B, la 1 adună A deplasat, apoi deplasează — 8 repetări pentru un octet."],mulRow:(i,on,a)=>on?`bitul ${i} = 1 → A·2${sup(i)} = ${a}·${2**i} = ${a*2**i}`:`bitul ${i} = 0 → zerouri`,mulSum:(a,b,ones)=>`B = ${b} = ${ones.map(i=>2**i).reverse().join(" + ")}, deci A × B = ${ones.map(i=>`${a}·${2**i}`).reverse().join(" + ")} = ${ones.map(i=>a*2**i).reverse().join(" + ")} = ${a*b}`,divExpl:["Împărțim „în colț”, ca la școală. În binar fiecare cifră a câtului este **0 sau 1**: împărțitorul fie încape în restul curent (scriem 1 și scădem), fie nu (scriem 0). Nu trebuie să ghicim cifra — ajunge o comparație.","Parcurgem cifrele deîmpărțitului de la stânga la dreapta: **coborâm** cifra următoare (restul ×2 + cifra), **comparăm** cu împărțitorul și, dacă e cazul, **scădem**. La fel împarte un program pentru 8080: deplasare, comparare, scădere — câte o dată pentru fiecare bit.","În final obținem un **cât întreg și un rest**. Rezultatul exact al împărțirii este de obicei **fracționar** — cum îl obținem, se arată mai jos."],divWhat:(a,b)=>`${a} ÷ ${b}: împărțitor ) deîmpărțit`,divHead:["Pas","Coborâm cifra: rest·2 + cifră","Încape împărțitorul?","Cifra câtului"],divBring:(before,d,r0)=>`${before}·2 + ${d} = ${r0}`,divYes:(r0,b,r1)=>`da: ${r0} ≥ ${b}, scădem → ${r1}`,divNo:(r0,b)=>`nu: ${r0} < ${b}`,divSteps:"Toți pașii în ordine",fracTitle:"Dar unde este partea fracționară?",fracExact:"Restul este 0 — numărul se împarte exact, nu există parte fracționară.",fracIntro:(rem,b)=>`Restul ${rem} este mai mic decât împărțitorul ${b}: partea întreagă s-a terminat, dar împărțirea poate continua după virgula binară — adăugăm zerouri (rest·2) și comparăm la fel. Fiecare pas dă o cifră a fracției cu ponderea 1/2, 1/4, 1/8…`,fracHead:["Ponderea cifrei","Rest·2","Încape împărțitorul?","Cifra"],fracExactVal:"exact:",fracNote:"Concluzie: împărțirea întreagă dă un cât și un rest. Dacă e nevoie de fracție, împărțirea continuă după virgulă, iar rezultatul se păstrează în format cu virgulă fixă. Fracțiile infinite (ca 1/3 sau 1/7) trebuie trunchiate — de aici eroarea de rotunjire."});Object.assign(ui.ro.memt,{addrHint:"Introduceți o adresă în hex (de exemplu 0081h, C000h, FFFFh) sau mișcați cursorul: pe liniile A15…A0 apare codul ei binar. Harta din dreapta arată unde cade această adresă.",mapTitle:"Harta spațiului de adrese al memoriei",mapReal:"Exemplu de calculator real cu 8080 (fiecare mașină are propria distribuție)",mapModel:"Modelul nostru didactic: se folosesc doar primii 256 de octeți",mapHint:"Fiecare bandă este marcată cu intervalul „de la — până la”. Marcajul portocaliu este adresa aleasă în stânga.",realMap:[["0000h","0FFFh","ROM: programul de pornire (monitor)","rom","4 KB"],["1000h","DFFFh","RAM: programe, date, stivă","ram","52 KB"],["E000h","EFFFh","memoria video a ecranului (dispozitiv în adresele memoriei)","vid","4 KB"],["F000h","FFFFh","neinstalată","free","4 KB"]],modelMap:[["0000h","007Fh","instrucțiunile programului","code","128 de octeți"],["0080h","00DFh","date (DB)","data","96 de octeți"],["00E0h","00FFh","stiva (crește în jos de la 0100h)","stk","32 de octeți"]],modelRest:"0100h — FFFFh: în modelul didactic nu există memorie",zoom:"mărit: 0000h — 00FFh",inModel:"adresa se află în memoria didactică",outModel:"în modelul didactic această adresă nu există",usedTitle:"Program încărcat acum:",usedCode:(a,b,n)=>`instrucțiuni — ${a}…${b} (${n} ${n===1?"octet":n%100>=20||n>0&&n%100===0?"de octeți":"octeți"})`,usedData:(a,b,n)=>`date — ${a}…${b} (${n} ${n===1?"octet":n%100>=20||n>0&&n%100===0?"de octeți":"octeți"})`,usedNone:"nu există date",usedFree:n=>`liber pentru instrucțiuni: ${n} ${n===1?"octet":n%100>=20||n>0&&n%100===0?"de octeți":"octeți"}`,wordTitle:"Cum se așază un număr de 16 biți (adresă) în două celule",wordHint:"De ce contează: adresele din instrucțiunile LDA, STA, JMP, CALL și constantele LXI ocupă 2 octeți. Procesorul le păstrează **cu octetul inferior întâi**. Introduceți un număr de 16 biți în hex (cifrele 0–9 și literele A–F, de exemplu 12AB) — veți vedea în ce celulă ajunge fiecare octet.",wordValue:"Număr (hex)",wordAt:"Începând de la adresa",wordBad:"Introduceți între 1 și 4 cifre hexazecimale: 0–9, A–F.",wordLo:"octet inferior",wordHi:"octet superior",wordCmd:v=>`La fel se așază adresa în instrucțiune: LDA ${v} → 3Ah, apoi octetul inferior și cel superior.`,ioH:"Al doilea spațiu de adrese — porturile de intrare-ieșire",ioP:["Procesorul 8080 are **două** spații de adrese. Primul este **memoria**: 65 536 de celule (0000h–FFFFh), accesate de instrucțiunile MOV, LDA, STA și altele. Al doilea sunt **porturile de intrare-ieșire**: 256 de numere (00h–FFh), accesate doar de două instrucțiuni — **IN** (citește un octet din port) și **OUT** (scrie un octet în port).","Numărul portului este pus de procesor pe aceeași magistrală de adrese (pe liniile A0–A7, cu o copie pe A8–A15), dar la începutul ciclului mașină anunță „acesta este un schimb cu un dispozitiv”, astfel încât memoria nu răspunde, ci răspunde dispozitivul cu acel număr. Cum funcționează aceasta la nivelul pinilor — în fila 5.","Există și altă cale: dispozitivul se plasează **direct în spațiul de adrese al memoriei** (de exemplu, memoria video a ecranului la E000h–EFFFh pe harta de mai sus). Atunci se lucrează cu el prin instrucțiuni obișnuite de memorie — aceasta se numește intrare-ieșire mapată în memorie."],ioMem:"Memorie: 0000h — FFFFh (64 KB)",ioMemCmd:"MOV, LDA, STA, LXI…",ioPorts:"Porturi: 00h — FFh (256)",ioPortsCmd:"doar IN și OUT",ioOurs:[["00h","tastatură (IN 00h)"],["01h","ecran (OUT 01h)"],["02h…FFh","liber"]]});Object.assign(ui.ro.sys,{pinTitle:"Pinii circuitului 8080: aceleași linii — roluri diferite",pinHint:"Apăsați pe un grup de pini — acesta se evidențiază pe capsulă. Procesorul 8080 are 40 de pini, dintre care 16 pentru adresă și 8 pentru date.",pinGroups:{addr:["Adresă A0–A15","ieșiri: numărul celulei de memorie sau al portului"],data:["Date D0–D7","bidirecționale: citire, scriere și cuvântul de stare"],ctrl:["Control","SYNC, DBIN, WR, READY, WAIT, HOLD, HLDA, INT, INTE, RESET"],clk:["Tact","Φ1, Φ2 — cele două faze ale generatorului de tact"],pwr:["Alimentare","+5 V, −5 V, +12 V, masă (GND)"]},muxH:"Cum aceiași pini lucrează la intrare, la ieșire și pentru informații de serviciu",muxP:["Pinii **D0–D7** sunt conectați la magistrala de date și au trei roluri: procesorul poate **trimite** un octet (scriere), poate **primi** un octet (citire) și, la începutul fiecărui ciclu mașină, trimite **cuvântul de stare**. Direcția este comutată de semnalele procesorului:"],muxList:["**SYNC = 1** (tactul T1): pe D0–D7 procesorul trimite **cuvântul de stare** — un octet în care fiecare bit spune ce ciclu este: citire din memorie, scriere, intrare-ieșire, stivă, oprire… Un circuit extern (controlerul de sistem 8228) îl memorează și formează pe baza lui semnalele MEMR, MEMW, I/OR, I/OW.","**DBIN = 1** (tactele T2–T3): ieșirile procesorului sunt deconectate (stare de înaltă impedanță), D0–D7 lucrează **la intrare** — memoria sau dispozitivul pune un octet pe magistrală, iar procesorul îl citește.","**WR = 0** (activ pe nivel jos, tactele T2–T3): D0–D7 lucrează **la ieșire** — procesorul pune un octet pe magistrală, iar memoria sau dispozitivul îl scrie.","Pinii **A0–A15** lucrează mereu ca ieșiri: pentru memorie este adresa celulei, la IN/OUT — numărul portului (pe A0–A7 și o copie pe A8–A15). Cine răspunde — memoria sau dispozitivul — decide cuvântul de stare."],muxNote:"Următorul procesor Intel, 8085, are mai puțini pini: cele 8 linii inferioare de adresă și datele sunt combinate pe aceiași pini AD0–AD7 și sunt separate în timp de semnalul ALE. La 8080 adresa și datele sunt pe pini diferiți, iar în timp se împart datele și cuvântul de stare.",cycTitle:"Ciclul mașină pe tacte: ce este pe pini",cycHint:"Alegeți tipul ciclului. Diagrama arată când pe D0–D7 este cuvântul de stare și când sunt datele, precum și în ce direcție circulă.",cycTypes:{fetch:"Extragerea instrucțiunii (M1)",mread:"Citire din memorie",mwrite:"Scriere în memorie",sread:"Citire din stivă",swrite:"Scriere în stivă",ioread:"Intrare din port (IN)",iowrite:"Ieșire în port (OUT)",intack:"Confirmarea întreruperii",halt:"Oprire (HLT)"},swTitle:"Cuvântul de stare al acestui ciclu",swBits:[["D7","MEMR","citire din memorie"],["D6","INP","intrare din port"],["D5","M1","extragerea codului de operație"],["D4","OUT","ieșire în port"],["D3","HLTA","confirmarea opririi"],["D2","STACK","acces la stivă"],["D1","WO̅","0 — scriere/ieșire, 1 — citire/intrare"],["D0","INTA","confirmarea întreruperii"]],swOut:(hex,sig)=>`Cuvântul de stare = ${hex}. Controlerul de sistem formează din el semnalul ${sig}.`,rowsLbl:{sync:"SYNC",data:"D0–D7",dbin:"DBIN",wr:"WR̅",addr:"A0–A15"},dStatus:"stare",dIn:"← intrare în CPU",dOut:"ieșire din CPU →",dFloat:"deconectate",aAddr:"adresă",aPort:"numărul portului",ioTheoryH:"Cum lucrează procesorul cu dispozitivele de intrare-ieșire",ioTheoryP:["Un dispozitiv (tastatură, ecran, imprimantă) se conectează la magistrale printr-un **controler** — un circuit cu câteva registre. Fiecărui registru i se atribuie un **număr de port**. De obicei sunt două: **registrul de date** (prin el trec octeții) și **registrul de stare** (în el sunt biții „gata”, „ocupat”, „eroare”).","**Decodificatorul de porturi** de pe placă compară numărul de pe magistrala de adrese cu al său și, la coincidență, conectează registrul la magistrala de date — exact cum decodificatorul memoriei selectează o celulă. O singură diferență: el răspunde doar în ciclurile de intrare-ieșire (semnalele I/OR, I/OW).","Instrucțiunea **IN port** citește un octet din registrul dispozitivului în acumulatorul A, iar instrucțiunea **OUT port** scrie A în registrul dispozitivului. Alte acțiuni cu dispozitivul procesorul nu are — toată „logica” dispozitivului se află în controlerul său."],ioDiagram:{cpu:"Procesor",dec:"Decodificator de porturi",ctrl:"Controlerul tastaturii",st:["Registru de stare","portul 02h (exemplu)"],dt:["Registru de date","portul 00h"],kbd:"Tastatură",a:"magistrala de adrese: numărul portului",d:"magistrala de date: octet",c:"I/OR, I/OW"},pollH:"Două moduri de a afla că dispozitivul este gata",pollA:["Interogare (polling)","Programul citește în buclă registrul de stare: „s-a apăsat o tastă?”. Cât timp nu — repetă. Simplu, dar procesorul este ocupat doar cu așteptarea."],pollB:["Întrerupere","Dispozitivul trimite singur semnalul INT când este gata. Între timp procesorul face altă muncă (scenariul „Întrerupere” de mai sus)."],pollCode:`WAIT:  IN   02h      ; citește registrul de stare

       OUT  01h      ; și afișează-l pe ecran`,pollNote:"În simulatorul nostru (fila 7) tastatura este simplificată: portul 00h returnează imediat codul următoarei taste „apăsate” sau 0, dacă nu există apăsări."});Object.assign(ui.ro.arch,{nodesBtn:"Blocurile procesorului",nodesHint:"Apăsați pe un bloc — acesta se evidențiază pe schemă cu un chenar albastru și i se deschide descrierea.",nodesClose:"Ascunde lista"});ui.ro.langSoon="Traducerea va fi adăugată mai târziu";ui.ro.x={bitWord:"bit",tetrad:"tetradă",hiByte:"octetul superior",loByte:"octetul inferior",wordLbl:"cuvânt: 16 biți = 2 octeți",callBit:"↑ bit",callPos:"↑ rangul nr. 5, pondere 2⁵ = 32",callMsb:"↑ cel mai semnificativ (MSB), pondere 2¹⁵",callLsb:"cel mai puțin semnificativ (LSB), pondere 1 ↑",callWidth:"lățime = 16 biți → numere de la 0 la 65 535",decimal:"zecimal",fValue:"valoare",fInt:"parte întreagă",fFrac:"fracție",fExp:"exponent",fMant:"mantisă",ctrl:{0:"caracter nul, adesea sfârșitul unui text în memorie",7:"semnal sonor",8:"ștergere înapoi (Backspace)",9:"tabulare",10:"linie nouă (LF)",13:"retur de car (CR)",27:"Escape",127:"ștergere (DEL)"},diff30:"diferența 0011 0000b = 30h",bit5:"↑ bitul 5",portKbd:"⌨ portul 00h: 'i'",dataLbl:"date",alu:"UAL",cellHL:" — celula de memorie de la adresa din HL",pswNote:" (în PUSH/POP, în loc de SP — PSW: A + indicatori)",mNote:"**M** nu este un registru, ci o celulă de memorie a cărei adresă se află în perechea HL. Codul 110.",alsoMov:" (precum și MOV B, A → 47h)",fNote:"Registrul indicatorilor nu se adresează direct: el se salvează și se restabilește împreună cu A prin instrucțiunile PUSH PSW / POP PSW.",spPcNote:"Registrele de 16 biți SP și PC sunt specificate în instrucțiuni implicit sau prin câmpul RP (SP = 11).",b256:"256 o",portLines:"(A0–A7 și A8–A15)",select:"selecție",stackLbl:"stivă",oneStage:"O etapă"};// Textele programelor predefinite (comentarii în limba interfeței; codul nu se schimbă)

const STYLES=`
        * { box-sizing: border-box; }
        body {
          margin: 0;
          background: #eef3f8;
          color: #172033;
          font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .app-shell { max-width: 1320px; margin: 0 auto; padding: 16px 20px 24px; }
        .mono, code { font-family: "JetBrains Mono", "Cascadia Mono", Consolas, "Courier New", monospace; }
        .strong { font-weight: 800; }
        .muted { color: #5b6b82; }
        .small { font-size: 12px; }

        .hero {
          background: linear-gradient(135deg, #10233f, #1d4d7a);
          color: white;
          border-radius: 22px;
          padding: 20px 24px;
          margin-bottom: 14px;
        }
        .hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
        .hero h1 { margin: 0 0 6px; font-size: 26px; line-height: 1.2; }
        .hero p { margin: 0; color: #c9dcf2; font-size: 15px; max-width: 880px; }
        .hero-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .lang-btn {
          border: 1px solid rgba(255,255,255,0.35); background: transparent; color: white;
          border-radius: 10px; padding: 6px 10px; font-weight: 800; cursor: pointer;
        }
        .lang-btn.on { background: white; color: #10233f; }
        .mode-switch { display: inline-flex; margin-right: 10px; border: 1px solid rgba(255,255,255,0.35); border-radius: 10px; overflow: hidden; }
        .mode-btn { border: 0; background: transparent; color: white; padding: 6px 12px; font-weight: 700; cursor: pointer; }
        .mode-btn + .mode-btn { border-left: 1px solid rgba(255,255,255,0.35); }
        .mode-btn.on { background: white; color: #10233f; }
        .more-ext { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 4px 0 14px; padding: 10px 14px; border: 1px dashed #94a3b8; border-radius: 12px; color: #475569; font-size: 14px; }

        .card {
          background: white;
          border: 1px solid #dce5ef;
          border-radius: 18px;
          padding: 14px 16px;
          box-shadow: 0 10px 26px rgba(45, 68, 100, 0.08);
        }
        .toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 14px; }
        .tool-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .tool-label { font-size: 13px; font-weight: 800; color: #3b4a61; }
