      mov  [sum], al
      ret
num1    db   25
num2    db   17
sum     db   0`}});Object.assign(ui.ru,{// ================= Вкладка 1. Числа и данные =================
numbers:{startH:"С чего всё начинается",startP:["Логический элемент различает только два состояния: **0** (низкий уровень) и **1** (высокий). Триггер хранит одно такое значение, несколько триггеров образуют **регистр**. Процессор — большая цифровая схема, и всё, с чем он работает (числа, буквы, команды), хранится как наборы нулей и единиц."],anatomyTitle:"Из чего состоит двоичное число",anatomyHint:"Нажмите на термин — он подсветится на схеме. Нажимайте на биты, чтобы менять число.",terms:[["bit","Бит","одна двоичная цифра: 0 или 1. Столько хранит один триггер."],["pos","Разряд","позиция бита. Номера — справа налево с 0; у каждого разряда свой вес."],["msb","Старший / младший разряд","самый левый (MSB, наибольший вес) и самый правый (LSB, вес 1)."],["nib","Тетрада","4 бита = одна шестнадцатеричная цифра."],["byte","Байт","8 бит — основная порция данных 8080: он хранит и передаёт всё порциями по 8 бит."],["word","Слово","у 8080 — 16 бит = 2 байта."],["width","Разрядность","сколько бит отведено под число. От неё зависит, какие числа поместятся."]],weight:"вес",sysH:"Системы счисления",sysP:["В **позиционной** системе значение цифры зависит от её места: каждый разряд «весит» в **основание** раз больше соседа справа. У десятичной системы основание 10, у двоичной — 2, у шестнадцатеричной (hex) — 16 (цифры 0…9, A…F)."],sysNote:"Обозначения: 1011b — двоичное, B6h — шестнадцатеричное (если начинается с буквы, в программах пишут 0B6h), 182 — десятичное. Иногда встречается 0xB6.",tableTitle:"Одни и те же числа в разных системах",tableHint:"Нажмите на строку — число попадёт в конвертер справа.",baseNames:{2:"двоичная",3:"троичная",4:"четверичная",8:"восьмеричная",10:"десятичная",16:"шестнадцатеричная"},conv:{title:"Конвертер: одно число во всех системах",hint:"Введите число (200, −5, 0C8h, 11001000b), двигайте ползунок или нажимайте на биты.",width:"Разрядность",bitsWord:"бит",signed:"со знаком (доп. код — см. ниже)"},posTitle:"Как устроена позиционная запись",posHint:"Выберите основание и нажимайте на цифры (каждое нажатие +1). Внизу видно, как из цифр и весов складывается число.",base:"Основание",digitClick:"цифра",reset:"Сброс",posNote:b=>`Вес каждого разряда в ${b} раз больше, чем у соседа справа. Цифр в системе ровно ${b}: от 0 до ${b===16?"F (15)":b-1}.`,xTitle:"Перевод из одной системы в другую",xHint:"Слева — исходное число, в центре — его двоичная запись, справа — результат. Цвета показывают, какие биты стали какой цифрой.",from:"Из системы",to:"В систему",number:"Число",bad:"В числе есть цифры, которых нет в этой системе.",bitsPer:"бит на одну цифру",viaGroups:(b,k)=>`Основание ${b} = 2${sup(k)}: каждая цифра — ровно ${k} бит${k===1?"":k<5?"а":""}. Переводим группами.`,viaSum:b=>`Основание ${b} — не степень двойки, групп битов нет. Сначала вычисляем число (сумма цифра × вес), потом делим на новое основание.`,viaDiv:b=>`Делим на ${b}, остатки читаем снизу вверх:`,divHead:["Делимое","частное","остаток"],bitsTable:"Сколько бит нужно на одну цифру",bitsTableNote:"Для 3 и 10 число бит нецелое — поэтому их цифры нельзя «нарезать» из двоичной записи, а hex и восьмеричную — можно.",fmtTitle:"Форматы чисел: что помещается в n бит",fmtHint:"Одни и те же биты можно отвести под разные форматы. Выберите разрядность и сравните диапазон и точность. Это обзор: каждый формат подробно разобран ниже на этой вкладке.",fmtHead:["Формат","Как устроен","Минимум","Максимум","Точность (шаг)"],fmtRows:{u:"Целое без знака",s:"Целое со знаком",x:"Фиксированная точка",f:"Плавающая точка"},fmtHow:{u:"все биты — вес числа",s:"старший бит — знак (доп. код)",x:(i,f)=>`${i} бит целой части + ${f} бит дроби, со знаком`,f:(e,m)=>`1 бит знака + ${e} бит порядка + ${m} бит мантиссы`},fmtStep1:"1",fmtRel:d=>`≈ ${d} значащих десятичных цифр`,fmtNote:"Чем больше диапазон, тем меньше точность: у плавающей точки огромный диапазон, но хранится лишь несколько значащих цифр. У 8080 аппаратно есть только целые 8-битные (и отчасти 16-битные) числа — остальные форматы обрабатывают программы.",uH:"Целые числа без знака",uP:["Все биты — веса числа. В n битах помещаются числа от 0 до 2ⁿ − 1. Если к наибольшему числу прибавить 1, «выпадает» перенос, и результат начинается с нуля — как у механического счётчика пробега. Процессор запоминает выпавший бит во флаге переноса **CY**."],wheelTitle:"Числовое кольцо (4 бита)",wheelHint:"Крутите кольцо кнопками ±1. Снаружи — значения без знака, внутри — со знаком. Переход через 15 → 0 — перенос (CY), через 7 → −8 — знаковое переполнение.",wheelCarry:"перенос! CY = 1",wheelOvf:"знаковое переполнение",sH:"Отрицательные числа",sP:["Минуса у битов нет, поэтому знак тоже кодируют битом — **старшим**. Способов три; процессоры, включая 8080, используют **дополнительный код**: в нём сложение и вычитание делает та же схема сумматора, что и для чисел без знака, а ноль записывается одним способом. Простой способ читать дополнительный код: старший бит весит не +128, а **−128** (в 16 битах — −32768), остальные биты — как обычно."],sLabTitle:"Введите число — и посмотрите его коды",sLabHint:"Можно вводить положительные и отрицательные числа. Красный бит — знаковый.",codeNames:{direct:"Прямой код",ones:"Обратный код",twos:"Дополнительный код"},codeHow:{direct:"знак + модуль",ones:"у отрицательных — инверсия всех бит модуля",twos:"обратный код + 1 (использует 8080)"},posNum:"положительное",negNum:"отрицательное",outOfRange:"не помещается",howTwos:"Как получить дополнительный код отрицательного числа",howSteps:["модуль числа","инвертировать все биты","прибавить 1"],rangeTitle:"Диапазоны целых чисел",rangeHead:["Разрядность","Без знака","Со знаком (доп. код)"],fxH:"Дробные числа: фиксированная точка",fxP:["Программист договаривается, где стоит двоичная точка. Биты справа от неё весят 1/2, 1/4, 1/8… Сама точка нигде не хранится — только в логике программы. Чем правее точка, тем больше диапазон и меньше точность — и наоборот."],fxTableTitle:"Где поставить точку",fxTableHint:"Выберите разрядность; нажмите строку, чтобы посмотреть её в лаборатории ниже.",fxHead:["Бит дроби","Запись","Без знака: мин … макс","Со знаком: мин … макс","Шаг (точность)"],fxLab:"Лаборатория фиксированной точки",fxPoint:"Положение точки (бит дроби)",fxAsU:"как дробное без знака",fxAsS:"как дробное со знаком",fxSignNote:w=>`При чтении со знаком старший бит весит не +${w}, а −${w} — поэтому два результата различаются, когда он равен 1.`,flH:"Дробные числа: плавающая точка",flP:["Число хранится как **знак**, **порядок** (степень двойки) и **мантисса** (значащие цифры) — двоичный аналог записи 2,5 = 1,25·2¹. Так в тех же битах помещаются и очень большие, и очень маленькие числа, но только с ограниченным числом значащих цифр."],flTableTitle:"Распространённые форматы",flHead:["Формат","Биты: знак + порядок + мантисса","Смещение порядка","Максимум","Мин. нормальное","Точность"],flNames:{8:"float8 (учебный, по правилам IEEE)",16:"float16 (half)",32:"float32 (float, single)",64:"float64 (double)"},flLab:"Лаборатория плавающей точки",flInput:"Десятичное число",flStored:"Хранится точно",flErr:"Ошибка округления",flFormula:"значение = (−1)^знак · 1,мантисса · 2^(порядок − смещение)",flNotes:bias=>[`**Смещение порядка.** Порядок хранится со сдвигом +${bias}, чтобы обойтись без знакового бита: хранимое число ${bias} означает степень 0, меньшие — отрицательные степени.`,"**Скрытая единица.** У нормального числа мантисса всегда начинается с «1,», поэтому эту единицу не хранят — она подразумевается. Так экономится один бит.","**Мин. нормальное** — самое маленькое положительное число, у которого ещё есть скрытая единица. Числа меньше хранятся без неё (денормализованные) и с меньшей точностью."],flSpecial:{inf:"бесконечность (порядок — все единицы)",nan:"не число (NaN)",sub:"денормализованное (порядок = 0: без скрытой единицы)",zero:"ноль"},sign:"знак",exp:"порядок",mant:"мантисса",bytesMem:"Байты в памяти (младший первым)",interp:{h:"Можно ли по коду понять, что это за данные?",p:["Возьмём один байт и прочитаем его разными «глазами»."],labTitle:"Один байт — шесть прочтений",labHint:"Двигайте ползунок или нажимайте на биты.",rows:{unsigned:"Целое без знака",signed:"Целое со знаком",fixed:"Фиксированная точка (4 бита дроби)",bcd:"BCD: каждая тетрада — одна десятичная цифра",char:"Символ ASCII (вкладка 2)",cmd:"Команда процессора 8080 (вкладка 3)"},bcdBad:"недопустимо: тетрада больше 9",noChar:"управляющий, не печатается",answerH:"Ответ: нет.",answer:"В байте нет пометки «я число» или «я буква». **Смысл данных определяет программа** — то, какая команда с этим байтом работает. Процессор ничего не проверяет: сложит два кода букв так же охотно, как два числа."},arith:{h:"Арифметика в двоичной системе",p:["Сложение — «в столбик»: 1 + 1 = 10, то есть 0 и перенос в следующий разряд (так работает сумматор). Вычитание процессор делает сложением: A − B = A + (−B). Умножения и деления у 8080 **нет** — их выполняют программы. После операции процессор ставит **флаги** — признаки результата (справа от вычисления)."],title:"Лаборатория: арифметика 8 и 16 бит",a:"A",b:"B",ops:{add:"Сложение",sub:"Вычитание",mul:"Умножение",div:"Деление"},carryRow:"переносы",carryNote:"перенос пишем над тем разрядом, куда он переходит",colHead:"без знака / со знаком",negTitle:"Как получили −B",negSteps:["B","инвертируем все биты","+1 → это −B"],flags:"Флаги",flagExpl:{CY:"перенос из старшего разряда (при вычитании — заём)",Z:"результат равен нулю",S:"старший (знаковый) бит результата",P:"чётное число единиц в результате",AC:"перенос из 3-го разряда в 4-й"},vFlag:"V — знаковое переполнение (у 8080 такого флага нет)",ovfText:(a,b,r,op)=>`Если считать числа знаковыми: ${a} ${op} ${b} = ${op==="+"?a+b:a-b}, а это за пределами −128…127. Результат «перевернулся» и читается как ${r}.`,subNoBorrow:"При вычитании процессор записывает выпавший перенос в CY наоборот: перенос 1 (красная единица слева) означает «заёма не было», поэтому CY = 0. Результат положительный.",subBorrow:"Переноса из старшего разряда не было — значит, пришлось «занять»: A меньше B, CY = 1. Без знака результат неверен, а со знаком это отрицательное число в дополнительном коде.",carryOut:n=>`Результат ${n} не помещается в байт: девятый бит ушёл во флаг CY.`,mulExpl:["Умножаем «в столбик», как в школе, но проще: цифры множителя B — только 0 или 1.","Для каждого разряда B пишем строку: если цифра 1 — копию A, если 0 — нули. Каждую следующую строку сдвигаем на один разряд влево (как в школе — на одну клетку).","Складываем все строки. Сдвиг влево на k разрядов = умножение на 2ᵏ, поэтому процессор может умножать сдвигами и сложениями."],mulRow:(i,on)=>on?`бит ${i} множителя = 1 → A, сдвиг на ${i}`:`бит ${i} = 0 → нули`,mulResult:"Произведение (до 16 бит)",divExpl:["Делим «уголком», как в школе. В двоичной системе каждая цифра частного — 0 или 1: делитель либо помещается в текущий остаток (пишем 1 и вычитаем), либо нет (пишем 0).","Идём по цифрам делимого слева направо: сносим очередную цифру, сравниваем остаток с делителем, при необходимости вычитаем."],divQuot:"частное",divRem:"остаток",divCheck:"Проверка",divSteps:"Все шаги по порядку",divHead:["Цифра делимого","Остаток после сноса","≥ делителя?","Цифра частного","Остаток"],yes:"да",no:"нет",divZero:"На ноль делить нельзя.",simLink:"Посмотреть, как это делает процессор (вкладка 7)"}}});Object.assign(ui.ru,{// ================= Вкладка 2. Символы и кодировки =================
enc:{introH:"Буквы — это тоже числа",introP:["Процессор хранит только числа. Поэтому каждому символу присвоен номер — **код**, а таблица «символ ↔ код» называется **кодировкой**. Внутри компьютера нет букв: клавиатура присылает код, экран по коду рисует букву."],pipe:[["⌨","Нажата клавиша","«A»"],["🔢","Клавиатура передаёт код","41h = 65"],["💾","В памяти — байт","0100 0001"],["🖥","Экран рисует по коду","«A»"]],hexTitle:"Почему 41h = 65: таблица 0…255",hexHint:"Строка — старшая hex-цифра, столбец — младшая. В клетке — десятичное значение. Нажмите на клетку или на символ справа.",hexFormula:(h,l,n)=>{const H=h.toString(16).toUpperCase();const Lo=l.toString(16).toUpperCase();const mid=h>9||l>9?` = ${H} · 16 + ${Lo}`:"";return`${H}${Lo}h${mid} = ${h} · 16 + ${l} = ${h*16} + ${l} = ${n}`;},cpTitle:"Кодовые таблицы",hexDimNote:"Бледные строки 8–F — коды 80h–FFh: в ASCII их нет, их занимают национальные таблицы (ниже).",uniLowByte:b=>`Код Unicode больше байта, поэтому в таблице слева подсвечен только его младший байт (${b}h); полный перевод — в формуле выше.`,cpHint:"Выберите таблицу. Строка — старшая hex-цифра кода, столбец — младшая: символ в строке 4, столбце 1 имеет код 41h.",tables:{ascii:"ASCII",cp1251:"Windows-1251",cp866:"CP866 (DOS)",koi8:"KOI8-R",unicode:"Unicode (кириллица)"},tableAbout:{ascii:"Основная латинская таблица (1963), 128 кодов, 7 бит. Её используют программы для 8080 и EMU8086.",cp1251:"Кириллица Windows. Коды 00–7Fh — как в ASCII, русские буквы — C0–FFh по алфавиту.",cp866:"Кириллица DOS. Русские буквы разбиты на куски: А–п — 80–AFh, р–я — E0–EFh; между ними — рамки для рисования окон.",koi8:"Кириллица Unix. Буквы расставлены так, что при потере старшего бита «П» становится «p»: текст остаётся читаемым латиницей.",unicode:"Единая нумерация всех символов мира (коды до 10FFFFh). Показан блок кириллицы 0400–04FFh. В памяти эти коды хранят чаще всего в UTF-8."},groups:{ctrl:"управляющий",digit:"цифра",upper:"прописная латинская",lower:"строчная латинская",space:"пробел",punct:"знак",cyr:"кириллица",other:"другой символ",none:"не используется"},sel:{char:"Символ",code:"Код",group:"Группа",ctrlName:"Назначение",utf8:"UTF-8 байты",cp:"Кодовая точка"},utf8How:"Как код превращается в байты UTF-8",utf8Note:"Биты кода раскладываются по шаблону: первый байт начинается с 110, второй — с 10. Так программа сразу видит, где начинается символ и сколько в нём байтов.",caseBtn:"Переключить бит 5 (прописная ↔ строчная)",ctrlNote:"Серые клетки — управляющие коды 00–1Fh и 7Fh: они не рисуются, а управляют устройством. Запоминать их не нужно; важны LF 0Ah (перевод строки), CR 0Dh (возврат каретки — печатающей головки — в начало строки), NUL 00h (часто — конец текста в памяти). SP 20h — пробел.",lawsH:"Полезные закономерности",law1T:"Цифра — это не число",law1:"Символ «7» — код 37h, число 7 — 07h. Разница — ровно 30h: чтобы получить значение цифры, из кода вычитают 30h.",law2T:"Прописная и строчная — один бит",law2:"«A» и «a» отличаются только битом 5 (вес 20h). Обнулив его (логическое И с маской 1101 1111b), программа делает букву прописной.",law3T:"Буквы идут по алфавиту",law3:"Коды растут вместе с алфавитом, поэтому слова можно сортировать сравнением кодов. Но все прописные стоят раньше строчных: «Z» (5Ah) < «a» (61h).",cyrH:"Одна буква — разные коды",cyrP:["В ASCII кириллицы нет, поэтому появились 8-битные таблицы, где русские буквы заняли коды 80–FFh — у каждой фирмы по-своему. Если текст записан в одной таблице, а прочитан в другой, получаются «кракозябры». Решение — **Unicode**: у каждого символа один номер, а в памяти он записывается в **UTF-8** (латиница — 1 байт, как в ASCII; кириллица — 2 байта)."],letter:"Буква",letterHint:"впишите любую букву — русскую или латинскую",kindCyr:"кириллица",kindLat:"латиница (ASCII)",kindOther:"другой символ",bytesWord:n=>n===1?"байт":"байта",pairs:[["C","С","C (лат.) и С (рус.)"],["A","А","A (лат.) и А (рус.)"],["P","Р","P (лат.) и Р (рус.)"],["Ц","ц","Ц и ц"],["A","a","A и a"]],cmpDiff:"Буквы выглядят одинаково, но это разные символы с разными кодами. Для компьютера «C» латинская и «С» русская так же различны, как «C» и «Ж»: поиск по слову, набранному не той раскладкой, ничего не найдёт.",cmpNote:"Сравните строки: подсвечены кодировки, в которых у двух символов одинаковый код.",uniNote:"U+041F — номер символа в Unicode (кодовая точка). UTF-8 раскладывает его биты по шаблону 110xxxxx 10xxxxxx — поэтому русская буква занимает 2 байта (подробно — в таблице Unicode выше).",oneLetterHead:["Таблица","Код","Двоичный","Байтов"],convTitle:"Текст → байты → текст",convHint:"Введите текст и выберите кодировку. Под каждым символом — его байты в hex; SP — пробел. Нажмите на символ — он будет найден в кодовой таблице выше. Внизу — те же байты, прочитанные в других кодировках (· — управляющий код, � — байт, не являющийся символом).",text:"Текст",encoding:"Кодировка записи",read:"Те же байты, прочитанные как…",cant:"нет в таблице",total:n=>`Всего байт: ${n}`,showInTable:"показать в таблице ↑",summary:"Итог: в программах для 8080 и EMU8086 используется ASCII — один символ занимает один байт. Текст в памяти — цепочка кодов (**строка**); её конец отмечают кодом 00h (в DOS — знаком «$»). Не путайте с переводом строки 0Ah — он лишь переносит текст на новую строку экрана."},// ================= Вкладка 3. Команды =================
cmd:{progH:"Процессор выполняет программу",progP:["**Процессор** — схема, которая по очереди выполняет **команды**: скопировать байт, сложить, сравнить, перейти. **Программа** — последовательность команд; она лежит в **памяти** (ряд пронумерованных ячеек по 1 байту) так же, как данные. Адрес следующей команды хранит регистр **PC** — счётчик команд."],progHint:"Нажимайте «Выполнить команду»: процессор выполняет команду, на которую указывает PC, и PC переходит к следующей. Обратите внимание: команды бывают разной длины. Все числа — в hex.",progNext:"Выполнить команду ▶",progReset:"Сначала",progLabels:{mem:"Память",addr:"адрес",cpu:"Процессор",pc:"PC — адрес команды, которая выполнится следующей",done:"Только что выполнена",next:"Следующая (на неё указывает PC)",stopped:"процессор остановлен",screen:"Экран"},progItems:[["MVI A, 03h","загрузить в A число 3"],["MOV B, A","скопировать A в B"],["ADD B","A ← A + B (3 + 3 = 6)"],["ADI 30h","A ← A + 30h: число 6 → код символа «6»"],["OUT 01h","вывести A на экран"],["HLT","остановиться"]],anatH:"Анатомия команды",anatP:["Одна и та же команда в двух видах: текст для человека (ассемблер) и байты для процессора (машинный код). Выберите пример."],anatLabels:{asm:"Язык ассемблера — для человека",assembler:"ассемблер переводит",code:"Машинный код — для процессора",opcode:"код операции (КОП)",operand:"операнд",bits:"Биты кода операции (первого байта)",mnem:"мнемоника"},anat:[{asm:[["MVI","mn"],[" A","o1"],[", 05h","o2"]],bytes:[0x3e,0x05],roles:["КОП: «загрузить константу в регистр A»","операнд: константа 5"],fields:[["00","op","«загрузить…»"],["111","dst","куда: A"],["110","op","«…константу из следующего байта»"]],note:"MVI = Move Immediate: «переслать непосредственное значение». Число 5 записано прямо в команде."},{asm:[["MOV","mn"],[" B","o1"],[", A","o2"]],bytes:[0x47],roles:["КОП: всё в одном байте"],fields:[["01","op","пересылка"],["000","dst","куда: B"],["111","src","откуда: A"]],note:"Оба регистра закодированы полями внутри кода операции — поэтому команда занимает всего 1 байт. Первым пишется приёмник: B ← A."},{asm:[["LDA","mn"],[" 0081h","o2"]],bytes:[0x3a,0x81,0x00],roles:["КОП: «загрузить A из памяти»","младший байт адреса","старший байт адреса"],fields:[["00111010","op","LDA — весь байт определяет команду"]],note:"Адрес 0081h занимает 2 байта; в памяти он лежит младшим байтом вперёд: 81h, потом 00h."},{asm:[["ADD","mn"],[" B","o1"]],bytes:[0x80],roles:["КОП: «прибавить к A регистр B»"],fields:[["10000","op","сложение с A"],["000","src","что прибавить: B"]],note:"Первый операнд сложения — всегда аккумулятор A, поэтому в команде указан только второй."},{asm:[["JMP","mn"],[" 0000h","o2"]],bytes:[0xc3,0x00,0x00],roles:["КОП: «перейти»","младший байт адреса","старший байт адреса"],fields:[["11000011","op","JMP — безусловный переход"]],note:"Переход просто записывает адрес 0000h в PC — следующая команда будет прочитана оттуда."}],termsH:"Основные понятия",terms:[["prog","Программа","последовательность команд в памяти."],["code","Машинный код","команда в виде байтов, понятных процессору: 3Eh 05h."],["opcode","Код операции (КОП)","первый байт команды: по нему процессор узнаёт, **что** делать и сколько ещё байтов читать."],["operand","Операнд","то, **над чем** действие: число, регистр, ячейка памяти, порт."],["mnem","Мнемоника","короткое слово вместо кода: MVI, MOV, ADD, JMP."],["asm","Ассемблер","язык записи мнемониками (1 строка = 1 команда) и программа-переводчик в машинный код."],["reg","Регистр","ячейка внутри процессора из триггеров — самая быстрая память. У 8080: A, B, C, D, E, H, L."],["acc","Аккумулятор A","главный регистр: первое число арифметики и место для результата."],["pair","Пара регистров","два регистра как одно 16-битное число: BC, DE, HL. HL обычно хранит адрес; ячейку по этому адресу обозначают **M**."],["mem","Память и адрес","ряд ячеек по 1 байту; адрес — номер ячейки (16 бит). Подробно — вкладка 4."],["pc","Счётчик команд PC","регистр с адресом следующей команды."],["flags","Флаги","однобитные признаки результата: CY — перенос, Z — ноль, S — знак…"],["port","Порт","номер устройства. В модели: 00h — клавиатура, 01h — экран."]],srcH:"Откуда команда берёт операнд",srcs:[{ex:"MVI A, 5",from:"из самой команды",kind:"imm"},{ex:"MOV B, A",from:"из регистра",kind:"reg"},{ex:"LDA 0080h",from:"из памяти по адресу",kind:"mem"},{ex:"IN 00h",from:"из устройства (порта)",kind:"port"}],orderNote:"В записи `MOV B, A` первым пишется **приёмник**, вторым — **источник**: «B ← A». Так устроены почти все команды 8080 и 8086.",fmtH:"Форматы команд 8080",fmtP:"Команда занимает 1, 2 или 3 байта. Первый байт — всегда код операции: прочитав его, процессор знает, сколько байтов ещё читать.",formats:[{n:1,what:"только код операции — всё нужное «зашито» в него",ex:[["MOV B, A",[0x47]],["ADD B",[0x80]],["HLT",[0x76]]],parts:["КОП"]},{n:2,what:"код операции + байт данных (константа) или номер порта",ex:[["MVI A, 05h",[0x3e,0x05]],["OUT 01h",[0xd3,0x01]]],parts:["КОП","данные / порт"]},{n:3,what:"код операции + 16-битный адрес или константа: сначала младший байт, потом старший",ex:[["LDA 0081h",[0x3a,0x81,0x00]],["JMP 0104h",[0xc3,0x04,0x01]]],parts:["КОП","младший байт","старший байт"]}],byteWord:n=>`${n} байт${n===1?"":"а"}`,littleEndian:"«Младший байт первым» (little-endian) — так решили разработчики 8080; этот порядок унаследовали 8086 и современные x86. Адрес 0081h записывается байтами 81h 00h.",fields:{h:"Поля внутри кода операции",p:["Биты кода операции разбиты на **поля**: постоянные биты (цифры) говорят, что это за команда, а буквенные поля — какие операнды. У `MOV r1, r2` код 01 DDD SSS: DDD — номер приёмника, SSS — источника. Три бита дают 8 вариантов: A, B, C, D, E, H, L и M."],regs:"Коды регистров (поля DDD и SSS)",pairs:"Коды пар регистров (поле RP)",conds:"Коды условий (поле CCC)",condNote:"Условия проверяют флаги. Здесь M — «минус», не путать с ячейкой памяти M.",usage:"Поле RP есть в командах с 16-битными парами (LXI, INX, PUSH, POP); поле CCC — в командах условного перехода (JZ, JNZ…). SP и стек — вкладка 4.",condDesc:{NZ:"не ноль (Z=0)",Z:"ноль (Z=1)",NC:"нет переноса (CY=0)",C:"перенос (CY=1)",PO:"нечётность (P=0)",PE:"чётность (P=1)",P:"плюс (S=0)",M:"минус (S=1)"}},lab:{title:"Кодирование и декодирование команды",encTitle:"Ассемблер → машинный код",encHint:"Выберите команду и операнды — получите её байты. Числа — десятичные (25) или hex (19h); байты всегда в hex, поэтому 25 превратится в 19.",decTitle:"Машинный код → ассемблер",decHint:"Нажимайте на биты или двигайте ползунок — дешифратор скажет, какая команда закодирована этим байтом.",template:"Команда",reg1:"Приёмник",reg2:"Источник",reg:"Регистр",pair:"Пара",value:"Число",addr:"Адрес",port:"Порт",cond:"Условие",bytesLabel:"Байты в памяти",unused:"Этот код в 8080 не используется (незадокументированный).",len:"Длина",group:"Группа"},exH:"Как процессор выполняет команду",exP:["Каждая команда проходит одни и те же этапы — это **командный цикл**. Ниже маленькая программа выполняется по одной команде, а каждая команда — по этапам. Нажимайте «Этап ▶» и следите, что меняется в памяти и в процессоре."],stages:{fetch:["Выборка","процессор читает байт по адресу из PC в регистр команд IR; PC + 1"],decode:["Декодирование","дешифратор разбирает биты кода: какая команда, какие операнды, сколько ещё байтов читать"],operand:["Чтение операнда","если команда длиннее 1 байта — читаются её следующие байты (константа, адрес, порт); PC + 1 за каждый"],exec:["Исполнение","выполняется само действие: пересылка, сложение, переход, вывод"],next:["Следующая команда","PC уже указывает на следующую команду — цикл повторяется"]},cycleCenter:["Командный","цикл"],ex:{prev:"◀ Этап",next:"Этап ▶",restart:"Сначала",cmdList:"Программа",mem:"Память",cpu:"Процессор",decoder:"Дешифратор",bus:"Обмен по шинам",busA:"адрес",busD:"данные",idle:"—",busNote:"Шина — группа проводов между процессором и памятью: по шине адреса процессор передаёт номер ячейки, по шине данных идёт сам байт (подробно — вкладка 5).",done:"Программа выполнена. Нажмите «Сначала», чтобы повторить.",waitDecode:"ждёт: байт ещё только читается"},exText:{fetch:(pc,op,pc1)=>`**Выборка.** PC = ${pc}: процессор выставляет этот адрес на шину адреса и читает из памяти байт **${op}**. Байт попадает в регистр команд IR. Пока это просто число — что оно значит, процессор узнает на следующем этапе. PC сразу увеличивается: ${pc1}.`,decode:["**Декодирование.** Дешифратор смотрит на биты 3Eh = 00 111 110. Шаблон 00 ··· 110 означает MVI — «загрузить константу в регистр»; поле 111 — регистр A. Вывод дешифратора: «команда длиной 2 байта — нужно прочитать ещё один байт, это и будет число».","**Декодирование.** 47h = 01 000 111. Начало 01 — это пересылка MOV; поле 000 — приёмник B, поле 111 — источник A. Все сведения уже есть в одном байте — читать больше ничего не нужно.","**Декодирование.** 80h = 10000 000. Начало 10000 — «прибавить к A»; поле 000 — второе слагаемое, регистр B. Команда однобайтовая.","**Декодирование.** 3Ah = 0011 1010 — это LDA, «загрузить A из памяти». Дешифратор знает: у LDA ещё 2 байта — адрес ячейки. Их нужно прочитать, прежде чем выполнять команду.","**Декодирование.** C3h = 1100 0011 — это JMP, «перейти». За кодом следуют 2 байта адреса перехода."],operand:[(j,addr,v,pc1)=>`**Чтение операнда.** Процессор читает следующий байт команды по адресу ${addr}: это **${v}** — число 5, которое нужно загрузить. PC = ${pc1}.`,()=>"",()=>"",(j,addr,v,pc1)=>j===1?`**Чтение операнда.** Байт по адресу ${addr}: **${v}** — младший байт адреса ячейки. PC = ${pc1}.`:`**Чтение операнда.** Байт по адресу ${addr}: **${v}** — старший байт. Теперь процессор знает весь адрес: 0081h. PC = ${pc1}.`,(j,addr,v,pc1)=>j===1?`**Чтение операнда.** Байт по адресу ${addr}: **${v}** — младший байт адреса перехода. PC = ${pc1}.`:`**Чтение операнда.** Байт по адресу ${addr}: **${v}** — старший байт. Адрес перехода: 0000h.`],exec:["**Исполнение.** Прочитанное число 05h записывается в регистр A. Память больше не нужна — всё уже прочитано.","**Исполнение.** Значение A (05h) копируется в B. В A оно тоже остаётся — копирование не «перемещает» данные.","**Исполнение.** Арифметико-логическое устройство складывает A и B: 5 + 5 = 10 (0Ah). Результат записывается в A, флаги обновляются.","**Исполнение.** Теперь процессор обращается к **данным**: выставляет адрес 0081h (взятый из команды, а не из PC) и читает байт 11h. Он попадает в A.","**Исполнение.** В PC записывается адрес перехода 0000h. Больше ничего не происходит — но следующая команда будет прочитана уже с начала программы."],next:(pc,jump)=>jump?`**Следующая команда.** PC = ${pc}: программа пойдёт по кругу — снова MVI A, 05h. Так устроены циклы.`:`**Следующая команда.** Команда выполнена. PC = ${pc} уже указывает на следующую команду — цикл начинается заново с выборки.`},groupsH:"Группы команд",groupsP:"Все команды 8080 делятся на пять групп. Полный список — вкладка 6; подпрограммы и стек — вкладка 4, прерывания — вкладка 5."}});ui.ru.helper={title:"Системы счисления",short:"Системы",label:"Открыть справочник систем счисления и конвертер",hint:"Пока поле пустое — таблица чисел 0…20. Введите число — увидите его во всех системах, его код в байте и соседние числа.",placeholder:"216, −40, D8h, 11011000b",clear:"Очистить",inBase:"Ввод в системе",auto:"авто",bad:"Не удалось разобрать число в выбранной системе.",width:"Хранить в",bits:"бит",stored:w=>`Код в ячейке ${w} бит (дополнительный код, красный бит — знаковый):`,asU:"читать без знака",asS:"читать со знаком",negNote:(m,code)=>`−${m} хранится как ${code}: ${code} = 2ⁿ − ${m}. Проверка: инвертировать биты и прибавить 1 — получится ${m}.`,noFit:(w,min,max)=>`В ${w} бит помещаются числа от ${min} до ${max}.`,tableTitle:"Числа 0…20 (нажмите строку)",neighbors:"Соседние числа",rowClick:"Нажмите на строку — число попадёт в поле ввода."};Object.assign(ui.ru.numbers,{sysNote:"Как обозначают основание. В математике — нижним индексом: 1011₂, 102₃, 23₄, 13₈, 11₁₀, B₁₆ (везде одно и то же число 11). В ассемблере — буквой в конце: 1011b (binary), 13o или 13q (octal, восьмеричная), 11 или 11d (decimal), 0Bh (hex; если число начинается с буквы, впереди пишут 0). Для троичной и четверичной систем суффикса в ассемблере нет; для любого основания есть запись с буквой r (radix — основание) после самого основания: 3r102 (ternary, троичная), 4r23 (quaternary, четверичная) — так пишут в Smalltalk, в Common Lisp — #3r102, #4r23. В языках C/Python: 0b1011, 0o13, 0xB.",notation:{10:"11, 11d",2:"1011b, 1011₂",3:"102₃",4:"23₄",8:"13o, 13₈",16:"0Bh, B₁₆"},numberIs:"Число:",sumLine:"Сложение блоков:",posHint:"Выберите основание. Нажатие на цифру увеличивает её на 1 (правая кнопка мыши — уменьшает). Каждый блок: цифра × основание в степени номера разряда (в скобках — значение степени) = вклад разряда. Блоки складываются.",wheelHint:"Крутите кольцо кнопками ±1. Снаружи — значения без знака, внутри — со знаком. Флаги справа показывают, что произошло на последнем шаге.",wheelIdle:"обычный шаг: ни переноса, ни переполнения",wheelCarry:"перенос! Для чисел без знака результат не поместился в 4 бита: CY = 1",wheelOvf:"знаковое переполнение! Для чисел со знаком результат перескочил 7 ↔ −8: V = 1",wheelCyLbl:"перенос: переход 15 ↔ 0",wheelVLbl:"знаковое переполнение: переход 7 ↔ −8",wheelBits:"биты",wheelU:"без знака (снаружи)",wheelS:"со знаком (внутри)",wheelL1:"- - граница 15 | 0: перенос",wheelL2:"- - граница 7 | −8: знаковое переполнение"});Object.assign(ui.ru.numbers,{fmtHint:"Итог раздела. Одни и те же n бит можно отвести под любой из четырёх форматов — различаются только правила чтения. Выберите разрядность и сравните диапазон и шаг: чем больше диапазон, тем грубее шаг.",weightCheck:"Проверка весами",cmpH:"Одни и те же биты — два прочтения",cmpP:["Код в ячейке один, а число зависит от того, как его читать. Без знака 1111b — это 15, со знаком — −1. Процессору всё равно: он складывает биты одинаково, а два флага сообщают, что произошло на границе: **CY** — для чтения без знака, знаковое переполнение — для чтения со знаком."],bcdH:"BCD: десятичные цифры в тетрадах",bcdP:["Иногда число удобнее хранить не в двоичном виде, а **по десятичным цифрам**: каждая тетрада — одна цифра 0…9 (BCD, binary-coded decimal). Так проще выводить число на индикатор и считать деньги без ошибок округления, но байт вмещает только 0…99 вместо 0…255. У 8080 для такой арифметики есть команда **DAA** и флаг **AC** (вкладка 6)."],bcdLab:"Одно число — два кода",bcdHint:"Введите число 0…99 и сравните его BCD-код с обычным двоичным.",bcdNum:"Число",bcdHead:["Код","Биты","Hex","Как прочтёт процессор без знака"],bcdRowHow:"каждая тетрада — одна десятичная цифра",bcdBin:"Двоичный",bcdBinHow:"обычное целое без знака",bcdNote:"В BCD шестнадцатеричная запись совпадает с десятичным числом (42 → 42h), поэтому его легко читать в дампе памяти. Тетрады A…F в BCD недопустимы."});Object.assign(ui.ru.numbers.arith,{inBase:"Ввод A и B в системе",badIn:"не число в этой системе",inByte:"в байте:",inBits:w=>`в ${w} битах:`,bitsW:"бит",wTitle:m=>`Разрядность расчёта: от 2 до ${m} бит`,cut:(n,v,w,k)=>`${n} = ${v} не помещается в ${w} бит — в расчёт идут только младшие ${w} бит: ${k}. Увеличьте разрядность.`,wNote:w=>`АЛУ 8080 восьмибитное; из 16-битной арифметики у него есть только сложение DAD, и оно меняет лишь флаг CY. Флаги для ${w}-битного результата здесь показаны по тем же правилам, что и для байта.`,checkConv:v=>`Проверить ${v} в конвертере`,carryOut:(sum,r,w=8)=>w===8?`Сумма ${sum} не помещается в байт (максимум 255): девятый бит ушёл во флаг CY, а в байте осталось ${r} = ${sum} − 256.`:`Сумма ${sum} не помещается в ${w} бит (максимум ${2**w-1}): ${w+1}-й бит ушёл во флаг CY, а в ${w} битах осталось ${r} = ${sum} − ${2**w}.`,ovfText:(a,b,r,op,w=8)=>{const t=op==="+"?a+b:a-b;const h=2**(w-1);return`Если считать числа знаковыми: ${a} ${op} ${b} = ${t}, а это за пределами −${h}…${h-1}. Почему получилось ${r}: в дополнительном коде старший бит весит не +${h}, а −${h}. Результат ${t>0?"залез":"ушёл"} за границу диапазона, и те же ${w} бит читаются как ${t} ${t>0?"−":"+"} ${2*h} = ${r}. Признак такой ошибки: знак результата противоречит знакам операндов (например, сумма двух положительных чисел вышла отрицательной).`;},readTitle:"Как понять, что результат отрицательный, и найти его значение",read1T:"Шаг 1. Смотрим на старший (знаковый) бит — это флаг S",read1neg:"старший бит = 1: число отрицательное (в дополнительном коде).",read1pos:"старший бит = 0: число положительное, его значение читается как есть.",read2T:"Шаг 2. Находим модуль: инвертируем все биты и прибавляем 1",readRes:"результат",readAbs:"модуль",read3T:"Итог",readCy1:(w=8)=>`Флаг CY = 1 (заём) подтверждает: A меньше B, пришлось «занять» единицу из несуществующего ${w===8?"девятого":`${w+1}-го`} разряда — поэтому разность отрицательная.`,readCy0:"Флаг CY = 0: заёма не было, A ≥ B — разность неотрицательная.",readMismatch:(a,b,t,sr,w=8)=>`Здесь CY и S не совпадают: если A и B — числа без знака, настоящая разность ${a} − ${b} = ${t} не помещается в ${w===8?"байт":`${w} бит`} со знаком (−${2**(w-1)}…${2**(w-1)-1}), и прочтение «со знаком» (${sr}) неверно. Ориентируйтесь на CY для чисел без знака и на S (вместе с V) для чисел со знаком.`,mulExpl:["Умножаем «в столбик», как в школе, но проще: каждая цифра множителя B — только 0 или 1, поэтому строка — это либо копия A, либо нули.","**Сдвиг влево на k разрядов = умножение на 2ᵏ** — как в десятичной системе дописать k нулей (13 → 130 → 1300). Строка для разряда k — это A, сдвинутое на k разрядов, то есть A·2ᵏ.","Складываем все строки. Так же умножает программа для 8080: проверяет очередной бит B, при единице прибавляет сдвинутое A, затем сдвигает — 8 повторов для байта."],mulRow:(i,on,a)=>on?`бит ${i} = 1 → A·2${sup(i)} = ${a}·${2**i} = ${a*2**i}`:`бит ${i} = 0 → нули`,mulSum:(a,b,ones)=>`B = ${b} = ${ones.map(i=>2**i).reverse().join(" + ")}, поэтому A × B = ${ones.map(i=>`${a}·${2**i}`).reverse().join(" + ")} = ${ones.map(i=>a*2**i).reverse().join(" + ")} = ${a*b}`,divExpl:["Делим «уголком», как в школе. В двоичной системе каждая цифра частного — **0 или 1**: делитель либо помещается в текущий остаток (пишем 1 и вычитаем), либо нет (пишем 0). Угадывать цифру не нужно — достаточно сравнить.","Идём по цифрам делимого слева направо: **сносим** очередную цифру (остаток ×2 + цифра), **сравниваем** с делителем, при необходимости **вычитаем**. Так же делит программа для 8080: сдвиг, сравнение, вычитание — по разу на каждый бит.","В итоге получаем **целое частное и остаток**. Точный результат деления обычно **дробный** — как его получить, показано ниже."],divWhat:(a,b)=>`${a} ÷ ${b}: делитель ) делимое`,divHead:["Шаг","Сносим цифру: остаток·2 + цифра","Делитель помещается?","Цифра частного"],divBring:(before,d,r0)=>`${before}·2 + ${d} = ${r0}`,divYes:(r0,b,r1)=>`да: ${r0} ≥ ${b}, вычитаем → ${r1}`,divNo:(r0,b)=>`нет: ${r0} < ${b}`,divSteps:"Все шаги по порядку",fracTitle:"А где дробная часть?",fracExact:"Остаток равен 0 — число делится нацело, дробной части нет.",fracIntro:(rem,b)=>`Остаток ${rem} меньше делителя ${b}: целая часть закончилась, но деление можно продолжить за двоичной запятой — дописываем нули (остаток·2) и так же сравниваем. Каждый шаг даёт одну цифру дроби с весом 1/2, 1/4, 1/8…`,fracHead:["Вес цифры","Остаток·2","Делитель помещается?","Цифра"],fracExactVal:"точно:",fracNote:"Вывод: целочисленное деление даёт частное и остаток. Если нужна дробь, деление продолжают за запятой и хранят результат в формате с фиксированной точкой. Бесконечные дроби (как 1/3 или 1/7) приходится обрывать — отсюда ошибка округления."});Object.assign(ui.ru.memt,{addrHint:"Введите адрес в hex (например 0081h, C000h, FFFFh) или двигайте ползунок: на линиях A15…A0 появится его двоичный код. На карте справа — куда попадает этот адрес.",mapTitle:"Карта адресного пространства памяти",mapReal:"Пример реального компьютера на 8080 (у разных машин распределение своё)",mapModel:"Наша учебная модель: используются только первые 256 байт",mapHint:"Каждая полоса подписана диапазоном «от — до». Оранжевый маркер — адрес, выбранный слева.",realMap:[["0000h","0FFFh","ПЗУ: стартовая программа (монитор)","rom","4 КБ"],["1000h","DFFFh","ОЗУ: программы, данные, стек","ram","52 КБ"],["E000h","EFFFh","видеопамять экрана (устройство в адресах памяти)","vid","4 КБ"],["F000h","FFFFh","не установлено","free","4 КБ"]],modelMap:[["0000h","007Fh","команды программы","code","128 байт"],["0080h","00DFh","данные (DB)","data","96 байт"],["00E0h","00FFh","стек (растёт вниз от 0100h)","stk","32 байта"]],modelRest:"0100h — FFFFh: в учебной модели памяти нет",zoom:"увеличено: 0000h — 00FFh",inModel:"адрес попадает в учебную память",outModel:"в учебной модели этого адреса нет",usedTitle:"Сейчас загружена программа:",usedCode:(a,b,n)=>`команды — ${a}…${b} (${n} байт)`,usedData:(a,b,n)=>`данные — ${a}…${b} (${n} байт)`,usedNone:"данных нет",usedFree:n=>`свободно под команды: ${n} байт`,wordTitle:"Как 16-битное число (адрес) лежит в двух ячейках",wordHint:"Зачем это нужно: адреса в командах LDA, STA, JMP, CALL и константы LXI занимают 2 байта. Процессор хранит их **младшим байтом вперёд**. Введите 16-битное число в hex (цифры 0–9 и буквы A–F, например 12AB) — увидите, в какую ячейку попадёт каждый байт.",wordValue:"Число (hex)",wordAt:"Начиная с адреса",wordBad:"Введите от 1 до 4 шестнадцатеричных цифр: 0–9, A–F.",wordLo:"младший байт",wordHi:"старший байт",wordCmd:v=>`Так же лежит адрес в команде: LDA ${v} → 3Ah, затем младший и старший байты.`,ioH:"Второе адресное пространство — порты ввода-вывода",ioP:["У 8080 **два** адресных пространства. Первое — **память**: 65 536 ячеек (0000h–FFFFh), к ним обращаются команды MOV, LDA, STA и другие. Второе — **порты ввода-вывода**: 256 номеров (00h–FFh), к ним обращаются только две команды — **IN** (прочитать байт из порта) и **OUT** (записать байт в порт).","Номер порта процессор выставляет на ту же шину адреса (на линии A0–A7, и копию — на A8–A15), но в начале машинного цикла сообщает «это обмен с устройством», поэтому память не откликается, а откликается устройство с этим номером. Как это устроено на выводах — во вкладке 5.","Есть и другой способ: поместить устройство **прямо в адресное пространство памяти** (например, видеопамять экрана в E000h–EFFFh на карте выше). Тогда с ним работают обычными командами памяти — это называют вводом-выводом, отображённым на память."],ioMem:"Память: 0000h — FFFFh (64 КБ)",ioMemCmd:"MOV, LDA, STA, LXI…",ioPorts:"Порты: 00h — FFh (256)",ioPortsCmd:"только IN и OUT",ioOurs:[["00h","клавиатура (IN 00h)"],["01h","экран (OUT 01h)"],["02h…FFh","свободно"]]});Object.assign(ui.ru.sys,{pinTitle:"Выводы микросхемы 8080: одни и те же линии — разные роли",pinHint:"Нажмите на группу выводов — она подсветится на корпусе. У 8080 40 выводов, из них 16 — адрес и 8 — данные.",pinGroups:{addr:["Адрес A0–A15","выходы: номер ячейки памяти или порта"],data:["Данные D0–D7","двунаправленные: чтение, запись и слово состояния"],ctrl:["Управление","SYNC, DBIN, WR, READY, WAIT, HOLD, HLDA, INT, INTE, RESET"],clk:["Тактирование","Φ1, Φ2 — две фазы тактового генератора"],pwr:["Питание","+5 В, −5 В, +12 В, общий (GND)"]},muxH:"Как одни и те же выводы работают на ввод, на вывод и для служебной информации",muxP:["Выводы **D0–D7** соединены с шиной данных и работают в трёх ролях: процессор может **выдавать** байт (запись), **принимать** байт (чтение) и в начале каждого машинного цикла выдаёт **слово состояния**. Направление переключают сигналы процессора:"],muxList:["**SYNC = 1** (такт T1): на D0–D7 процессор выдаёт **слово состояния** — байт, в котором каждый бит говорит, какой это цикл: чтение памяти, запись, ввод-вывод, стек, останов… Внешняя микросхема (системный контроллер 8228) запоминает его и по нему формирует сигналы MEMR, MEMW, I/OR, I/OW.","**DBIN = 1** (такты T2–T3): выходы процессора отключены (третье состояние), D0–D7 работают **на ввод** — память или устройство выставляют байт, процессор его читает.","**WR = 0** (активный низкий, такты T2–T3): D0–D7 работают **на вывод** — процессор выставляет байт, память или устройство его записывает.","Выводы **A0–A15** всегда работают на выход: в памяти это адрес ячейки, при IN/OUT — номер порта (на A0–A7 и копия на A8–A15). Кто откликнется — память или устройство, — решает слово состояния."],muxNote:"У следующего процессора Intel 8085 выводов меньше: младшие 8 линий адреса и данные объединены на одних выводах AD0–AD7 и разделяются во времени сигналом ALE. У 8080 адрес и данные на разных выводах, а общими во времени являются данные и слово состояния.",cycTitle:"Машинный цикл по тактам: что на выводах",cycHint:"Выберите тип цикла. На диаграмме видно, когда на D0–D7 слово состояния, а когда — данные и в какую сторону они идут.",cycTypes:{fetch:"Выборка команды (M1)",mread:"Чтение памяти",mwrite:"Запись в память",sread:"Чтение из стека",swrite:"Запись в стек",ioread:"Ввод из порта (IN)",iowrite:"Вывод в порт (OUT)",intack:"Подтверждение прерывания",halt:"Останов (HLT)"},swTitle:"Слово состояния этого цикла",swBits:[["D7","MEMR","чтение памяти"],["D6","INP","ввод из порта"],["D5","M1","выборка кода операции"],["D4","OUT","вывод в порт"],["D3","HLTA","подтверждение останова"],["D2","STACK","обращение к стеку"],["D1","WO̅","0 — запись/вывод, 1 — чтение/ввод"],["D0","INTA","подтверждение прерывания"]],swOut:(hex,sig)=>`Слово состояния = ${hex}. Системный контроллер формирует из него сигнал ${sig}.`,rowsLbl:{sync:"SYNC",data:"D0–D7",dbin:"DBIN",wr:"WR̅",addr:"A0–A15"},dStatus:"состояние",dIn:"← ввод в CPU",dOut:"вывод из CPU →",dFloat:"отключены",aAddr:"адрес",aPort:"номер порта",ioTheoryH:"Как процессор работает с устройствами ввода-вывода",ioTheoryP:["Устройство (клавиатура, экран, принтер) подключается к шинам через **контроллер** — схему с несколькими регистрами. Каждому регистру дан **номер порта**. Обычно их два: **регистр данных** (через него идут байты) и **регистр состояния** (в нём биты «готов», «занят», «ошибка»).","**Дешифратор портов** на плате сравнивает номер на шине адреса со своим и при совпадении подключает регистр к шине данных — точно так же, как дешифратор памяти выбирает ячейку. Отличие одно: он откликается только в циклах ввода-вывода (сигналы I/OR, I/OW).","Команда **IN порт** читает байт из регистра устройства в аккумулятор A, команда **OUT порт** записывает A в регистр устройства. Других действий с устройством у процессора нет — вся «логика» устройства находится в его контроллере."],ioDiagram:{cpu:"Процессор",dec:"Дешифратор портов",ctrl:"Контроллер клавиатуры",st:["Регистр состояния","порт 02h (пример)"],dt:["Регистр данных","порт 00h"],kbd:"Клавиатура",a:"шина адреса: номер порта",d:"шина данных: байт",c:"I/OR, I/OW"},pollH:"Два способа узнать, что устройство готово",pollA:["Опрос (polling)","Программа в цикле читает регистр состояния: «клавиша нажата?». Пока нет — повторяет. Просто, но процессор занят только ожиданием."],pollB:["Прерывание","Устройство само подаёт сигнал INT, когда готово. Процессор в это время выполняет другую работу (сценарий «Прерывание» выше)."],pollCode:`WAIT:  IN   02h      ; прочитать регистр состояния
       ANI  01h      ; оставить бит 0 «клавиша нажата»
       JZ   WAIT     ; 0 — ещё нет, повторить опрос
       IN   00h      ; 1 — прочитать код клавиши
       OUT  01h      ; и вывести его на экран`,pollNote:"В нашем симуляторе (вкладка 7) клавиатура упрощена: порт 00h сразу отдаёт код следующей «нажатой» клавиши или 0, если нажатий нет."});Object.assign(ui.ru.arch,{nodesBtn:"Узлы процессора",nodesHint:"Нажмите на узел — он выделится на схеме синей рамкой и раскроется его описание.",nodesClose:"Скрыть список"});ui.ru.langSoon="Перевод будет добавлен позже";ui.ru.x={bitWord:"бит",tetrad:"тетрада",hiByte:"старший байт",loByte:"младший байт",wordLbl:"слово: 16 бит = 2 байта",callBit:"↑ бит",callPos:"↑ разряд № 5, вес 2⁵ = 32",callMsb:"↑ старший (MSB), вес 2¹⁵",callLsb:"младший (LSB), вес 1 ↑",callWidth:"разрядность = 16 бит → числа от 0 до 65 535",decimal:"десятичное",fValue:"значение",fInt:"целая",fFrac:"дробь",fExp:"порядок",fMant:"мантисса",ctrl:{0:"пустой символ, часто — конец текста в памяти",7:"звуковой сигнал",8:"забой (Backspace)",9:"табуляция",10:"перевод строки (LF)",13:"возврат каретки (CR)",27:"Escape",127:"удаление (DEL)"},diff30:"разница 0011 0000b = 30h",bit5:"↑ бит 5",portKbd:"⌨ порт 00h: 'i'",dataLbl:"данные",alu:"АЛУ",cellHL:" — ячейка памяти по адресу из HL",pswNote:" (в PUSH/POP вместо SP — PSW: A + флаги)",mNote:"**M** — не регистр, а ячейка памяти, адрес которой лежит в паре HL. Код 110.",alsoMov:" (а также MOV B, A → 47h)",fNote:"Регистр флагов напрямую не адресуется: его сохраняют и восстанавливают вместе с A командами PUSH PSW / POP PSW.",spPcNote:"16-битные регистры SP и PC задаются в командах неявно или полем RP (SP = 11).",b256:"256 Б",portLines:"(A0–A7 и A8–A15)",select:"выбор",stackLbl:"стек",oneStage:"Один этап"};// Тексты программ-заготовок (комментарии на языке интерфейса; код не меняется)
ui.ru.presetSrc={copy:`; Загрузка констант и копирование между регистрами
        MVI  A, 2Ah     ; A ← 2Ah (константа записана в самой команде)
        MOV  B, A       ; B ← A   (регистр → регистр)
        MOV  C, B       ; C ← B
        MVI  D, 'Z'     ; D ← код символа 'Z' (5Ah)
        HLT             ; остановка процессора`,add:`; Сложение двух чисел из области данных
        LDA  NUM1       ; A ← [NUM1]   (память → регистр)
        MOV  B, A       ; B ← A
        LDA  NUM2       ; A ← [NUM2]
        ADD  B          ; A ← A + B
        STA  SUM        ; [SUM] ← A    (регистр → память)
        HLT

        ORG  0080h      ; ---- область данных ----
NUM1:   DB   25         ; первое слагаемое
NUM2:   DB   17         ; второе слагаемое
SUM:    DB   0          ; сюда запишется сумма`,sub:`; Вычитание: отрицательный результат и флаги
        MVI  A, 5       ; A = 5
        SUI  7          ; 5 − 7 = −2 → A = FEh, CY = 1 (заём), S = 1
        STA  RES1       ; FEh — это −2 в дополнительном коде
        MVI  A, 7
        SUI  7          ; 7 − 7 = 0 → Z = 1
        STA  RES2
        HLT

        ORG  0080h
RES1:   DB   0
RES2:   DB   0FFh`,char:`; Вывод символов на экран (порт 01h)
        MVI  A, 'H'     ; код символа 'H' = 48h
        OUT  01h        ; отправить байт на экран
        LDA  SYM        ; взять символ из области данных
        OUT  01h
        HLT

        ORG  0080h
SYM:    DB   'i'        ; символ хранится как число 69h`,hl:`; Доступ к памяти через указатель HL (MOV r,M / MOV M,r)
        LXI  H, SRC     ; HL ← адрес SRC
        MOV  A, M       ; A ← [HL]
        INX  H          ; HL ← HL + 1 (следующая ячейка)
        MOV  B, M       ; B ← [HL]
        LXI  H, DST
        MOV  M, A       ; [HL] ← A
        HLT

        ORG  0080h
SRC:    DB   11h, 22h
DST:    DB   0`,loop:`; Цикл: сумма 5 + 4 + 3 + 2 + 1
        MVI  B, 5       ; счётчик N = 5
        MVI  A, 0       ; сумма = 0
LOOP:   ADD  B          ; A ← A + B
        DCR  B          ; B ← B − 1 (меняет флаг Z)
        JNZ  LOOP       ; если B ≠ 0 — повторить
        STA  RES        ; сохранить результат
        HLT

        ORG  0080h
RES:    DB   0`,mult:`; Умножение 6 × 7 сложением (у 8080 нет команды MUL)
        MVI  B, 6       ; множимое
        MVI  C, 7       ; множитель = сколько раз прибавить
        MVI  A, 0       ; произведение = 0
LOOP:   ADD  B          ; A ← A + 6
        DCR  C          ; осталось на один раз меньше
        JNZ  LOOP       ; пока C ≠ 0
        STA  RES        ; 42 = 2Ah
        HLT

        ORG  0080h
RES:    DB   0`,string:`; Вывод строки: цикл с условием выхода
        LXI  H, MSG     ; HL указывает на начало строки
NEXT:   MOV  A, M       ; A ← очередной символ
        CPI  0          ; конец строки? (код 0)
        JZ   DONE       ; да — выйти из цикла
        OUT  01h        ; вывести символ на экран
        INX  H          ; перейти к следующему символу
        JMP  NEXT       ; повторить
DONE:   HLT

        ORG  0080h
MSG:    DB   'HELLO', 0`,upper:`; Строчные буквы → прописные (сброс бита 5 командой ANI)
        LXI  H, MSG
NEXT:   MOV  A, M       ; очередной символ
        CPI  0
        JZ   DONE
        ANI  0DFh       ; 1101 1111: бит 5 = 0 → 'h' (68h) → 'H' (48h)
        OUT  01h
        INX  H
        JMP  NEXT
DONE:   HLT

        ORG  0080h
MSG:    DB   'intel', 0`,stack:`; Стек: PUSH и POP (последним пришёл — первым ушёл)
        LXI  SP, 0100h  ; вершина стека — за концом памяти
        MVI  B, 11h
        MVI  C, 22h     ; BC = 1122h
        PUSH B          ; [00FFh] ← B, [00FEh] ← C, SP = 00FEh
        MVI  B, 0
        MVI  C, 0       ; BC «испорчен»
        POP  D          ; DE ← 1122h из стека, SP = 0100h
        HLT`,call:`; Подпрограмма: CALL сохраняет адрес возврата в стеке, RET его забирает
        LXI  SP, 0100h
        MVI  A, 'O'
        CALL PRINT      ; вызвать подпрограмму
        MVI  A, 'K'
        CALL PRINT      ; ещё раз — возврат будет в другое место
        HLT

PRINT:  OUT  01h        ; подпрограмма: вывести A на экран
        RET             ; вернуться туда, откуда вызвали`,echo:`; Ввод с клавиатуры (порт 00h) и вывод на экран (порт 01h)
NEXT:   IN   00h        ; A ← код нажатой клавиши (0 — нажатий нет)
        CPI  0
        JZ   DONE       ; клавиш больше нет — конец
        OUT  01h        ; «эхо»: показать символ на экране
        JMP  NEXT
DONE:   HLT`,carry:`; Переполнение байта и флаг переноса CY
        MVI  A, 0F0h    ; A = 240
        ADI  20h        ; 240 + 32 = 272 > 255  →  CY = 1
        JC   OVER       ; был перенос — переход
        HLT
OVER:   MVI  A, '!'     ; сообщить о переполнении
        OUT  01h
        HLT`,data:`; Байт = данные или команда? (HLT забыт!)
        MVI  A, 5       ; A ← 5
        MOV  B, A       ; B ← A

NUM:    DB   3Ch, 76h   ; задумано как числа 60 и 118,

presetsLabel:"Program",presets:{copy:"1. Constants and register copying",add:"2. Adding two numbers from memory",sub:"3. Subtraction and flags",char:"4. Printing a character on the screen",hl:"5. Memory via the HL pointer",loop:"6. Loop: sum 5+4+3+2+1",mult:"7. Multiplying 6×7 by addition",string:"8. Printing the string HELLO",upper:"9. Lowercase → uppercase (ANI)",stack:"10. Stack: PUSH and POP",call:"11. Subroutine: CALL and RET",echo:"12. Keyboard → screen (IN/OUT)",carry:"13. Overflow and the CY flag",data:"14. A byte — data or instruction?",custom:"Your own program (from the editor)"},btn:{toStart:"⏮ To start",backInstr:"⏪ Instruction",back:"◀ Step",step:"Step ▶",instr:"Instruction ⏩",toEnd:"To end ⏭",run:"▶ Auto",pause:"⏸ Pause",write:"Write to location"},speed:"Speed",perSec:"steps/s",autoBy:"Auto by",autoByOpt:{step:"stages",instr:"instructions"},scale:"Scale",kbdLabel:"Keyboard (port 00h) — “pressed” keys:",status:{ready:"Ready to run. Press “Step ▶” or “▶ Auto”.",stage:"Stage",stageOf:"of",stageTail:"of the current instruction",halted:"Program finished (HLT).",instrDone:"Instructions executed",step:"Step",of:"of"},legend:{addr:"address bus",data:"data bus",ctrl:"control bus",inner:"internal transfer",active:"block active",changed:"value changed"},blk:{cpu:"INTEL 8080 PROCESSOR",ibus:"Internal data bus (8 bits)",dbb:"Data bus buffer",acc:"Accumulator A",act:"Acc. buffer ACT",tmp:"Temporary TMP",flags:"Flags",alu:"ALU",daa:"Decimal adjust",ir:"Instruction register IR",dec1:"Instruction decoder",dec2:"and cycle encoder",mux:"Multiplexer",sp:"stack pointer",pc:"program counter",inc1:"Incrementer / decrementer",inc2:"address latch",abuf:"Address buffer",tc:"Timing and control unit",mem:"MEMORY (RAM, 256 bytes)",memCode:"Instructions 0000–007Fh",memData:"Data and stack 0080–00FFh",screen:"SCREEN · port 01h",kbd:"KEYBOARD · port 00h",kbdEmpty:"no keys pressed",monitor:"On the buses now",bA:"Address",bD:"Data",bC:"Control",dataBus:"Data bus D0–D7",addrBus:"Address :"Fetch: byte → instruction register",x:`Through the data bus buffer and the internal bus, byte ${h2(p.op)} enters the instruction register IR. Because the byte was read in cycle M1, the processor treats it as an opcode — that is exactly what makes the byte an instruction.`}),decode:(p,d)=>({t:"Decoding the instruction",x:`The decoder analyzes bits ${b8s(p.op)}: this is the instruction ${d.pat}. ${ui.en.simDesc[d.mn]?ui.en.simDesc[d.mn](d):""} Instruction length: ${d.len} byte${d.len===1?", all data is already here.":`s: ${d.len-1} more operand byte${d.len-1===1?"":"s"} must be read.`} The control unit gets a plan: which machine cycles to perform next.`}),opAddr:p=>({t:`Cycle ${p.cyc}: operand address`,x:`The instruction continues in memory. To get the ${ui.en.which[p.which]}, PC = ${h4(p.pc)} is placed on the address bus again.`}),opRead:p=>({t:`Operand read → ${p.dst}`,x:`Memory outputs ${vv(p.val)} — the ${ui.en.which[p.which]}. The byte passes through the data bus buffer and the internal bus and is written to ${ui.en.dstName(p.dst)}. PC is incremented to ${h4(p.pc1)}.${p.which==="hi"?" Registers W and Z together hold a 16-bit address: in memory it is stored “low byte first”.":""}`}),memAddr:p=>({t:`Cycle ${p.cyc}: data location address`,x:p.pair==="SP"?`Address ${h4(p.addr)} is taken from the stack pointer SP and placed on the address bus. This is how the processor accesses the top of the stack.`:`Address ${h4(p.addr)} is taken from register pair ${p.pair} (not from PC!) and placed on the address bus through the address latch and buffer. This is how the processor accesses data rather than instructions.`}),memRead:p=>({t:`Data read: [${h4(p.addr)}] → ${p.dst}`,x:`Memory puts the contents of location ${h4(p.addr)} = ${vv(p.val)} on the data bus (DBIN signal). Through the buffer and the internal bus the byte is written to ${ui.en.dstName(p.dst)}. Here the same kind of byte is treated as data — because it was not read in cycle M1.`}),memWrite:p=>({t:`Memory write: ${p.src} → [${h4(p.addr)}]`,x:`The contents of ${ui.en.dstName(p.src)} = ${vv(p.val)} travel over the internal bus to the buffer and onto the data bus. The WR (“write”) signal — memory stores the byte in location ${h4(p.addr)}. The old value of the location is erased.`}),regToTmp:p=>({t:`${p.src} → TMP`,x:`The value of ${ui.en.dstName(p.src)} = ${vv(p.val)} is copied via ${p.src==="A"?"":"the multiplexer and "}the internal bus into the temporary register TMP. There is only one internal bus, so the transfer goes through an intermediate register.`}),tmpToReg:p=>({t:`TMP → ${p.dst}`,x:`From TMP the value ${vv(p.val)} is written over the internal bus to ${ui.en.dstName(p.dst)}. Copying is complete: ${p.src} keeps its old value — copying does not “move” data, it duplicates it.`}),aluPrep:p=>({t:"Preparing the ALU operands",x:`A = ${vv(p.a)} is copied to the accumulator buffer ACT, the second operand ${p.src} = ${vv(p.b)} to the temporary register TMP. The buffers let the ALU write the result back to A without “spoiling” its own inputs.`}),aluPrepA:p=>({t:"Preparing the ALU operands",x:`The second operand ${vv(p.b)} is already in the temporary register TMP. Accumulator A = ${vv(p.a)} is copied to buffer ACT.`}),aluCalc:p=>{const opText={ADD:"addition",ADI:"addition",SUB:"subtraction",SUI:"subtraction",CMP:"comparison (subtraction without saving)",CPI:"comparison (subtraction without saving)",INR:"increment by 1",DCR:"decrement by 1",ANA:"logical AND",ANI:"logical AND",XRA:"exclusive OR",XRI:"exclusive OR",ORA:"logical OR",ORI:"logical OR"}[p.kind];const cmp=p.kind==="CMP"||p.kind==="CPI";const logic=ALU_AND.includes(p.kind)||ALU_XOR.includes(p.kind)||ALU_OR.includes(p.kind);return{t:`ALU: ${opText}`,x:logic?`The ALU performs ${opText} bit by bit: ${b8s(p.a)} ${opSym(p.kind)} ${b8s(p.b)} = ${b8s(p.r)} (${h2(p.r)}). Each bit of the result depends only on the bits in the same position. Flags: Z=${p.F.Z}, S=${p.F.S}, P=${p.F.P}; logical instructions always clear CY.`:`The ALU computes ${p.a} ${opSym(p.kind)} ${p.b} = ${p.r} (${h2(p.r)}). Flags: Z=${p.F.Z}${p.F.Z?" (result is zero)":""}, S=${p.F.S}${p.F.S?" (high bit is 1)":""}, P=${p.F.P}, CY=${p.F.CY}${p.F.CY&&!p.unary?" (carry/borrow out of the byte!)":""}${p.unary?" (INR/DCR do not change CY)":""}.${cmp?" The result is not stored anywhere — only the flags matter: Z=1 means “A equals the operand”.":""}`};},aluStore:p=>({t:`Result → ${p.dst}`,x:`The result ${vv(p.r)} from the ALU output is written over the internal bus to ${ui.en.dstName(p.dst)}.`}),inx:p=>({t:`Incrementing pair ${p.pair}`,x:`The 16-bit pair ${p.pair} = ${h4(p.from)} passes through the incrementer/decrementer and becomes ${h4(p.to)}. The ALU and the flags are not involved. This makes it easy to “step” through memory locations.`}),dcx:p=>({t:`Decrementing pair ${p.pair}`,x:`The 16-bit pair ${p.pair} = ${h4(p.from)} is decremented by 1 by the incrementer/decrementer: ${h4(p.to)}. The flags do not change.`}),spLoad:p=>({t:"WZ → SP",x:`The stack pointer gets the value ${h4(p.v)}. From now on the stack will grow downward from this address.`}),spDec:p=>({t:"Stack pointer: SP − 1",x:`The stack grows downward, so SP is decremented before writing: ${h4(p.from)} → ${h4(p.to)}. The high byte goes onto the stack first.`}),spInc:p=>({t:"Stack pointer: SP + 2",x:`Two bytes have been removed from the top of the stack, SP has moved back: ${h4(p.from)} → ${h4(p.to)}. The bytes themselves remain in memory but are now considered free space.`}),condCheck:p=>({t:`Checking the condition of ${p.mn}`,x:`Instruction ${p.mn} requires ${p.flag} = ${p.need}. Flag ${p.flag} is now ${p.val}, so the jump ${p.taken?"IS TAKEN":"is NOT taken"}. The flags were set by a previous arithmetic instruction — this is how a computation result controls the program flow.`}),jmpLoad:p=>({t:`Jump: PC ← ${h4(p.addr)}`,x:`The jump address, assembled in W (high byte) and Z (low byte), is loaded into the program counter. The next fetch will be from address ${h4(p.addr)}, not from the neighboring location. A jump is simply writing a new value into PC.`}),callLoad:p=>({t:`Subroutine call: PC ← ${h4(p.addr)}`,x:`The return address ${h4(p.ret)} (the instruction after CALL) is already saved on the stack, SP = ${h4(p.sp)}. Now the subroutine address ${h4(p.addr)} is loaded into PC.`}),retLoad:p=>({t:`Return: PC ← ${h4(p.addr)}`,x:`Two bytes were read from the stack — the return address ${h4(p.addr)}. It is loaded into PC, and SP moves back: ${h4(p.from)} → ${h4(p.to)}. The program continues with the instruction following CALL.`}),condSkip:p=>({t:"Jump skipped",x:`The condition is not met: PC already equals ${h4(p.pc)} — execution continues with the next instruction in order. The jump address that was read is simply not used.`}),ioWrite:p=>({t:`Output: A → port ${h2(p.port)}`,x:`Output cycle: port number ${h2(p.port)} is placed on the address bus, the contents of A = ${vv(p.val)} on the data bus; the WR and I/O signals say “write to a device”, not to memory. The screen on port ${h2(p.port)} draws the character “${p.ch==="\n"?"↵":p.ch}” — it interprets the byte as an ASCII character code.`}),ioRead:p=>({t:`Input: port ${h2(p.port)} → A`,x:`Input cycle: port number ${h2(p.port)} is on the address bus, the DBIN and I/O signals mean “read from a device”. ${p.empty?"No keys pressed — the keyboard returns 00h.":`The keyboard puts the key code ${vv(p.val)} ('${charOf(p.val)||"?"}') on the data bus, and it goes into accumulator A.`}`}),halt:()=>({t:"HLT: halt",x:"The processor has stopped, the program is finished. The results stay where the program wrote them: in registers, in memory locations, on the screen."}),nop:()=>({t:"NOP: no operation",x:"The processor does nothing and moves on to the next instruction. Code 00h is common in “empty” memory."}),illegal:p=>({t:"Unknown opcode",x:`Byte ${h2(p.op)} at address ${h4(p.pc)} is not an 8080 instruction — execution has stopped. A common cause: the program has no HLT, and PC has “run away” into the data area.`}),unsupported:p=>({t:"Instruction not supported by the simulator",x:`Byte ${h2(p.op)} at address ${h4(p.pc)} is the instruction ${p.pat}. The 8080 has it, but it is not part of the simulator's teaching set (see ★ on tab 6). Perhaps PC has “run away” into the data area.`})},simDesc:{NOP:()=>"No operation.",HLT:()=>"Halt the processor.",MOV:d=>d.s==="M"?`Copy a byte from memory at the address in HL to register ${d.d}.`:d.d==="M"?`Copy register ${d.s} to memory at the address in HL.`:`Copy register ${d.s} to register ${d.d}.`,MVI:d=>d.d==="M"?"Write a constant (the next byte) to memory at the address in HL.":`Load a constant (the next byte) into register ${d.d}.`,INR:d=>`Increment ${d.d} by 1.`,DCR:d=>`Decrement ${d.d} by 1.`,LDA:()=>"Load a byte from memory into A; the address is in the next two bytes.",STA:()=>"Store A in memory; the address is in the next two bytes.",LXI:d=>`Load a 16-bit constant into pair ${PAIR_FULL[d.rp]}.`,INX:d=>`Increment pair ${PAIR_FULL[d.rp]} by 1.`,DCX:d=>`Decrement pair ${PAIR_FULL[d.rp]} by 1.`,ADD:d=>`A ← A + ${d.s}.`,SUB:d=>`A ← A − ${d.s}.`,CMP:d=>`Compare A with ${d.s} (set the flags).`,ANA:d=>`A ← A AND ${d.s}.`,XRA:d=>`A ← A XOR ${d.s}.`,ORA:d=>`A ← A OR ${d.s}.`,ADI:()=>"A ← A + constant.",SUI:()=>"A ← A − constant.",CPI:()=>"Compare A with a constant (set the flags).",ANI:()=>"A ← A AND constant.",XRI:()=>"A ← A XOR constant.",ORI:()=>"A ← A OR constant.",OUT:()=>"Output A to a device port; the port number is in the next byte.",IN:()=>"Read a byte from a device port into A; the port number is in the next byte.",JMP:()=>"Unconditional jump; the address is in the next two bytes.",JZ:()=>"Jump if Z = 1 (the result was zero).",JNZ:()=>"Jump if Z = 0 (the result is not zero).",JC:()=>"Jump if CY = 1 (there was a carry).",JNC:()=>"Jump if CY = 0.",CALL:()=>"Call a subroutine: the return address goes onto the stack, then a jump.",RET:()=>"Return from a subroutine to the address taken from the stack.",PUSH:d=>`Push ${PAIR_FULL[d.rp]} onto the stack (2 bytes).`,POP:d=>`Pop 2 bytes from the stack into ${PAIR_FULL[d.rp]}.`,"???":()=>"Unknown instruction."},seg:{op:"opcode",dst:"destination DDD",src:"source SSS",pair:"pair RP",cond:"condition CCC",n:"number NNN"},panel:{now:"What is happening now",instr:"Current instruction",buses:"Buses",decoder:"Decoder: how the code is read",regCodes:"Register codes in the instruction",program:"Program: text → machine code",regs:"Registers and flags",calc:"Calculation in the ALU",noStep:"The processor has not started yet.",memory:"Whole memory",bytes:n=>`${n} ${n===1?"byte":"bytes"}`},listHead:{addr:"Address",code:"Machine code",asm:"Assembly",note:"Comment"},regHead:{r:"Reg.",hex:"Hex",dec:"Dec",bin:"Binary",chr:"Char"},kind:{op:"opcode",arg:"instruction operand",data:"data (number)",char:"data (character)",stack:"stack area",free:"unused"},memLegend:{pc:"PC points here",access:"accessed now",written:"changed by the program"},asmErr:{label:a=>`Unknown label “${a}”`,value:a=>`Could not parse the value “${a}”`,ops:a=>`Wrong number of operands (expected ${a})`,reg:a=>`Expected register A, B, C, D, E, H, L or M, got “${a||""}”`,pair:a=>`Expected pair B, D, H or SP, got “${a||""}”`,pairpsw:a=>`Expected pair B, D, H or PSW, got “${a||""}”`,byte:a=>`The value “${a}” does not fit in a byte (0…255)`,range:a=>`Address ${a} is outside memory (0000–00FFh)`,overflow:a=>`The program does not fit in memory (address ${a})`,mnemonic:a=>`Instruction “${a}” is not supported by the simulator (see ★ on tab 6)`,movmm:()=>"The instruction MOV M, M does not exist (its code is taken by HLT)",dup:a=>`Label “${a}” is declared twice`,syntax:a=>`Syntax error: “${a||""}”`}});Object.assign(ui.en,{// ================= Tab 4. Memory, registers, stack =================
memt:{memIntro:{h:"Memory",p:["**Memory** is a very long row of identical cells, each holding 1 byte. The cells are numbered: a cell's number is called its **address**. To read or write a byte, the processor gives the memory an address.","The 8080 address is 16 bits wide: the processor puts it on 16 wires (the **address lines** A0…A15). 16 bits give 2¹⁶ = 65,536 different addresses, from 0000h to FFFFh. This is the 8080's **address space**: 64 kilobytes (1 KB = 1024 bytes).","Memory holds both the program's **instructions** and the **data** it works on at the same time. The processor cannot tell one from the other (remember tab 1): the programmer decides which part of memory is used for what."]},addrTitle:"Address and address lines",addrHint:"Type an address or move the slider: its binary code will appear on lines A15…A0.",mapTitle:"Memory map",mapReal:"A typical 8080 system (64 KB)",mapModel:"Our teaching model (256 bytes)",mapItems:{rom:"ROM: startup program (runs after power-on)",ram:"RAM: programs and data",free:"not installed / devices",stack:"stack (grows downward)",code:"0000–007Fh: instructions",data:"0080–00DFh: data",stk:"00E0–00FFh: stack"},wordTitle:"A 16-bit number in memory",wordHint:"A two-byte number occupies two neighbouring cells: the low byte goes at the lower address.",wordValue:"Number",wordAddr:"Address",regs:{h:"8080 processor registers",p:["**Registers** are a few memory cells inside the processor itself. They are the fastest to work with: no need to access external memory. The programmer can use seven 8-bit registers and a few special ones.","Registers B, C, D, E, H, L can be combined into **pairs** BC, DE, HL; then they hold a 16-bit number, such as an address."],list:[["A","Accumulator","the main register: the arithmetic logic unit (ALU, the processor's adder and logic circuits) takes the first operand from it and writes the result back into it."],["B, C, D, E","General-purpose registers","for intermediate data and loop counters."],["H, L","HL pair: pointer","usually holds the address of a memory cell. In instructions, the cell at address HL is written as the letter **M** (memory)."],["F","Flag register","status bits of the last operation's result (details below)."],["SP","Stack pointer","16 bits, address of the top of the stack."],["PC","Program counter","16 bits, address of the next instruction."]],hidden:"There are also internal service registers the programmer cannot access: the instruction register IR, temporary registers W, Z (not to be confused with the Z flag), TMP, and the accumulator latch. We will see them at work in tab 7.",codeTitle:"Register addressing: a number instead of a name",codeP:"In an instruction's code, a register is given not by a letter but by a **3-bit number** (a field). Click a register to see its number and an example instruction."},modes:{h:"Addressing modes: where to get the operand",p:["An **addressing mode** is the rule by which an instruction specifies where its operand is. The 8080 has five. The notation in square brackets **[0081h]** reads “the contents of the cell at address 0081h”, and **[HL]** reads “the contents of the cell whose address is in HL”.","The IN and OUT instructions take the port number from the instruction's second byte. This accesses a device, not memory, so it is not counted as a separate addressing mode."],items:[{name:"Immediate",ex:"MVI A, 25",bytes:[0x3e,0x19],where:"the operand is right in the instruction (second byte)",flow:["instruction: 3Eh 19h","A ← 19h"]},{name:"Register",ex:"MOV A, B",bytes:[0x78],where:"the operand is in a register; the register number is a field in the opcode",flow:["B = 11h","A ← 11h"]},{name:"Direct",ex:"LDA 0081h",bytes:[0x3a,0x81,0x00],where:"the instruction contains the address of a memory cell",flow:["address 0081h from the instruction","cell [0081h] = 11h","A ← 11h"]},{name:"Register indirect",ex:"MOV A, M",bytes:[0x7e],where:"the cell address is in the HL pair: the instruction is short, and the address can change in a loop",flow:["HL = 0081h","cell [0081h] = 11h","A ← 11h"]},{name:"Stack",ex:"POP B",bytes:[0xc1],where:"the address is taken from the stack pointer SP and changes automatically (details in the “Stack” section below)",flow:["SP = 00FEh","[00FEh] → C, [00FFh] → B","SP ← 0100h"]}],colEx:"Example",colBytes:"Bytes",colWhere:"Where the operand is",colFlow:"What happens"},flags:{h:"Flags",p:["After arithmetic and logic instructions, the processor writes several one-bit status signs of the result into the **flag register F**. Flags do nothing by themselves: they are checked by **conditional jump instructions**: “if the result was zero, jump there”. This is how a program makes decisions."],layout:"Flag positions in byte F",list:[["S","Sign","a copy of the result's most significant bit: 1 means the result is negative (if treated as a signed number)."],["Z","Zero","1 if the result equals 0. The most used flag: it checks whether two numbers are equal (their difference is zero) and whether a loop count has finished."],["AC","Auxiliary carry","carry from bit position 3 to bit position 4 (between nibbles). Needed only for BCD arithmetic (tab 1)."],["P","Parity","1 if the result has an even number of ones. It was used to check for errors in data transmission."],["CY","Carry","carry out of the most significant bit on addition, or borrow on subtraction. Shows that the result did not fit in a byte."]],which:"Bits 5 and 3 of byte F are always 0, bit 1 is always 1: they are not used. Which instructions change flags is shown in the reference (tab 6); data transfer (copy) instructions do not change flags.",lab:"Try it yourself: choose an operation and numbers",labHint:"The processor performs subtraction as A + (−B) (tab 1). AC is taken from this addition as is, but the carry out of the most significant bit is written to CY **inverted**: CY = 1 means “a borrow was needed” (A is less than B). The logic operations AND, OR, XOR always clear CY."},stack:{h:"Stack",p:["The **stack** is a memory area that works by the rule “last in, first out” (LIFO), like a pile of plates: you put on top and take from the top.","The address of the top of the stack is kept in the **SP** register (stack pointer); it points to the last byte written. The 8080 stack grows **downward**, toward lower addresses. The **PUSH** instruction decreases SP and writes a register pair to the stack (2 bytes: high first, then low); **POP** reads 2 bytes from the top into a pair and increases SP. In stack instructions, the letter B means the BC pair, D the DE pair, H the HL pair.","The **PUSH PSW** and **POP PSW** instructions save to the stack and restore the accumulator A together with the flag register F (PSW, “program status word”). In our model, cells 00E0–00FFh are reserved for the stack. While the stack is empty, SP = 0100h, one cell above the stack area, so the first PUSH writes bytes to 00FFh and 00FEh.","The main use of the stack is **subroutines**: pieces of a program called from different places (for example, “print a character”). The CALL instruction pushes the **return address** (the address of the instruction right after CALL) and jumps to the subroutine; the RET instruction at the end of the subroutine takes this address from the stack and returns. Interrupts use the stack in the same way (tab 5)."],lab:"Interactive stack",labHint:"Click PUSH B: SP decreases by 2, and the bytes of the BC pair appear in cells 00FFh and 00FEh: first B (high), then C (low). Then click POP B and watch the order in which the values come back.",logEmpty:"Executed operations will appear here.",value:"Pair BC =",push:"PUSH B",pop:"POP B",reset:"Reset",empty:"The stack is empty: POP would return “garbage” from memory.",top:"top",log:"Log",pushed:(v,sp)=>`PUSH: wrote ${v}, SP = ${sp}`,popped:(v,sp)=>`POP: read ${v}, SP = ${sp}`}}});Object.assign(ui.en,{// ================= Tab 5. CPU in the system =================
sys:{intro:[{h:"Microprocessor system",p:["On its own, the CPU stores nothing except a few registers. To work, it is connected to **memory** (where the program and data live) and to **I/O devices** — keyboard, screen, disks. All of this together is called a **microprocessor system**.","These parts are connected by **buses**. A bus is a group of wires that carry signals: one wire — one bit."],terms:[["Address bus (A0–A15)","16 wires. The CPU puts an address on it — **where** it is accessing. Direction: only from the CPU."],["Data bus (D0–D7)","8 wires. It carries the byte itself — **what** is being read or written. Bidirectional: the byte goes into the CPU (read) or out of the CPU (write)."],["Control bus","separate signals — **when** and **what to do**: read or write, access memory or a device, wait, give up the buses."]]},{h:"Clock cycle, machine cycle, instruction cycle",terms:[["Clock cycle","one period of the clock generator. All CPU actions are synchronized by clock cycles. The usual 8080 frequency is 2 MHz — one clock cycle lasts 0.5 µs."],["Machine cycle","one access to memory or a device: reading or writing one byte. Takes 3–5 clock cycles (T1…T5). Cycles are numbered M1, M2, …"],["Instruction cycle","executing one whole instruction: from 1 to 5 machine cycles. The first cycle (M1) is always the opcode fetch."]]}],legend:"How to read the diagram: the “lamps” on the CPU are its signals (the I/O lamp is not a separate pin but the “device exchange” indicator from the status word; it is shown for clarity); a green lamp means the signal is active right now (READY is lit while memory keeps up). A colored “running” line is the bus currently transferring; the value being transferred is in a white frame. An orange frame marks the block that is working right now.",pinsTitle:"Main 8080 signals",pinsNote:"All signals except address and data together form the control bus. HOLD/HLDA and INT are drawn as separate lines in the diagram so you can see who sends them. The **status word** is a byte the CPU puts on the data bus at the start of each machine cycle (with the SYNC signal) to report the cycle type: instruction fetch, data read or write, I/O, stack, halt.",pins:[["A0–A15","output","address bus"],["D0–D7","input/output","data bus"],["SYNC","output","start of a machine cycle; at this moment the CPU sends the “status word” — the cycle type — on the data bus"],["DBIN","output","the CPU is reading: the device must put a byte on the data bus"],["WR","output","the CPU is writing: the byte on the data bus must be stored (the pin is active low; in the diagram the lamp simply “lights up”)"],["READY / WAIT","input / output","memory can't keep up → READY = 0; the CPU waits and reports it with the WAIT signal"],["HOLD / HLDA","input / output","request from another device to take over the buses, and the CPU's acknowledgment (direct memory access)"],["INT / INTE","input / output","interrupt request and the “interrupts enabled” indicator. INTE is not a flag in register F but a separate internal flip-flop; it is set by the EI instruction and cleared by DI"],["RESET","input","reset: PC = 0000h, the CPU starts over"],["Φ1, Φ2","input","two phases of clock pulses from the generator"]],pinHead:["Signal","Direction","Purpose"],player:{title:"How the CPU works with memory and devices",hint:"Choose a scenario and go through it step by step.",prev:"◀ Back",next:"Next ▶",auto:"▶ Auto",stop:"⏸ Stop",frame:"Step"},labels:{cpu:"8080 CPU",mem:"Memory",io:"I/O devices",dma:"DMA controller + disk",irq:"Interrupt source",abus:"Address bus",dbus:"Data bus",cbus:"Control bus",mode:"Mode",off:"disconnected from buses"},scenarios:[{id:"read",name:"Memory read",mode:"program execution",frames:[{t:"Address on the bus (T1)",x:"The CPU wants to read location 0081h. It puts this address on the address bus and uses the SYNC signal to announce: “starting a machine cycle”.",on:["cpu","abus"],sig:["SYNC"],a:0x0081,cpu:"puts out address"},{t:"Memory selects the location (T1–T2)",x:"The address decoder in memory (just like in digital electronics) uses the 16 address bits to select exactly one location out of 65,536. The other locations are not connected to the data bus.",on:["abus","mem","cell"],a:0x0081,cell:0x81},{t:"Read signal (T2–T3)",x:"The CPU issues the DBIN signal — “reading”. The selected location puts its contents, byte 11h, on the data bus.",on:["cbus","mem","cell","dbus"],sig:["DBIN"],a:0x0081,d:0x11,dd:"in",cell:0x81},{t:"Byte received (end of T3)",x:"The CPU latches the byte from the data bus into its register and removes the signals. The whole read machine cycle took 3 clock cycles; the buses are free for the next access.",on:["cpu"],cpu:"got 11h"}]},{id:"write",name:"Memory write",mode:"program execution",frames:[{t:"Address on the bus",x:"The CPU puts 0082h on the address bus — the number of the location where the result must be written.",on:["cpu","abus"],sig:["SYNC"],a:0x0082,cpu:"puts out address"},{t:"Data on the bus",x:"Now the CPU itself puts byte 2Ah on the data bus — when writing, the byte goes out of the CPU.",on:["cpu","dbus","abus"],a:0x0082,d:0x2a,dd:"out",cpu:"outputs 2Ah"},{t:"Write signal",x:"The WR signal (“write”): memory stores the byte from the data bus in the selected location. The old contents (00h) are erased.",on:["cbus","mem","cell","dbus"],sig:["WR"],a:0x0082,d:0x2a,dd:"out",cell:0x82,write:true},{t:"Done",x:"Location 0082h now holds 2Ah. The CPU removes the signals and moves on to the next machine cycle.",on:["mem","cell"],cell:0x82,write:true}]},{id:"program",name:"Program execution",mode:"program execution",frames:[{t:"Instruction fetch",x:"Program counter PC = 0000h. The CPU reads the first byte of the instruction at this address — 3Ah (the LDA opcode). After the read, PC is incremented by 1.",on:["cpu","abus","dbus","mem","cbus"],sig:["SYNC","DBIN"],a:0x0000,d:0x3a,dd:"in",pc:0x0001,cpu:"fetch"},{t:"Decode",x:"Inside the CPU, the decoder analyzes code 3Ah: “LDA — load A with a byte from me
