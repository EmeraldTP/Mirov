const curSnap=st=>st.cursor>=0?st.trace[st.cursor].snap:st.init;function stepOnce(st){if(st.cursor<st.trace.length-1)return{...st,cursor:st.cursor+1};const snap=curSnap(st);if(snap.halted)return{...st,running:false};let trace=st.trace.concat(plan(snap));let cursor=st.cursor+1;if(trace.length>MAX_TRACE){const drop=trace.length-MAX_TRACE;trace=trace.slice(drop);cursor-=drop;}return{...st,trace,cursor};}function stopIfHalted(st){const cur=st.cursor>=0?st.trace[st.cursor]:null;if(cur&&cur.last&&cur.snap.halted)return{...st,running:false};return st;}function toInstrEnd(st){let n=stepOnce(st);let guard=0;while(n.cursor>=0&&!n.trace[n.cursor].last&&guard<64){n=stepOnce(n);guard++;}return n;}function simReducer(st,a){switch(a.type){case"load":{const kbd=a.kbd!==undefined?a.kbd:st.kbd;return{asm:a.asm,kbd,init:initState(a.asm,kbd),trace:[],cursor:-1,running:false,presetId:a.presetId||"custom"};}case"setKbd":{const init=cloneS(st.init);init.kbd=a.text;return{...st,kbd:a.text,init,trace:[],cursor:-1,running:false};}case"reset":return{...st,trace:[],cursor:-1,running:false};case"poke":{const init=cloneS(st.init);init.mem[a.addr&0xff]=a.value&0xff;return{...st,init,trace:[],cursor:-1,running:false};}case"step":return stopIfHalted(stepOnce(st));case"instr":return stopIfHalted(toInstrEnd(st));case"back":return{...st,cursor:Math.max(-1,st.cursor-1),running:false};case"backInstr":{let c=st.cursor;if(c<0)return st;c--;while(c>=0&&!st.trace[c].last)c--;return{...st,cursor:c,running:false};}case"toEnd":{let n={...st,running:false};for(let i=0;i<3000;i++){const snap=curSnap(n);const atEnd=n.cursor===n.trace.length-1;if(snap.halted&&atEnd)break;n=toInstrEnd(n);}return{...n,running:false};}case"run":return{...st,running:a.value};default:return st;}}// ---------------------------------------------------------------------
// 7. Заготовки программ

const PRESETS=[{id:"copy",src:`; Загрузка констант и копирование между регистрами
        MVI  A, 2Ah     ; A ← 2Ah (константа записана в самой команде)
        MOV  B, A       ; B ← A   (регистр → регистр)
        MOV  C, B       ; C ← B
        MVI  D, 'Z'     ; D ← код символа 'Z' (5Ah)
        HLT             ; остановка процессора`},{id:"add",src:`; Сложение двух чисел из области данных
        LDA  NUM1       ; A ← [NUM1]   (память → регистр)
        MOV  B, A       ; B ← A
        LDA  NUM2       ; A ← [NUM2]
        ADD  B          ; A ← A + B
        STA  SUM        ; [SUM] ← A    (регистр → память)
        HLT

        ORG  0080h      ; ---- область данных ----
NUM1:   DB   25         ; первое слагаемое
NUM2:   DB   17         ; второе слагаемое
SUM:    DB   0          ; сюда запишется сумма`},{id:"sub",src:`; Вычитание: отрицательный результат и флаги
        MVI  A, 5       ; A = 5
        SUI  7          ; 5 − 7 = −2 → A = FEh, CY = 1 (заём), S = 1
        STA  RES1       ; FEh — это −2 в дополнительном коде
        MVI  A, 7
        SUI  7          ; 7 − 7 = 0 → Z = 1
        STA  RES2
        HLT

        ORG  0080h
RES1:   DB   0
RES2:   DB   0FFh`},{id:"char",src:`; Вывод символов на экран (порт 01h)
        MVI  A, 'H'     ; код символа 'H' = 48h
        OUT  01h        ; отправить байт на экран
        LDA  SYM        ; взять символ из области данных
        OUT  01h
        HLT

        ORG  0080h
SYM:    DB   'i'        ; символ хранится как число 69h`},{id:"hl",src:`; Доступ к памяти через указатель HL (MOV r,M / MOV M,r)
        LXI  H, SRC     ; HL ← адрес SRC
        MOV  A, M       ; A ← [HL]
        INX  H          ; HL ← HL + 1 (следующая ячейка)
        MOV  B, M       ; B ← [HL]
        LXI  H, DST
        MOV  M, A       ; [HL] ← A
        HLT

        ORG  0080h
SRC:    DB   11h, 22h
DST:    DB   0`},{id:"loop",src:`; Цикл: сумма 5 + 4 + 3 + 2 + 1
        MVI  B, 5       ; счётчик N = 5
        MVI  A, 0       ; сумма = 0
LOOP:   ADD  B          ; A ← A + B
        DCR  B          ; B ← B − 1 (меняет флаг Z)
        JNZ  LOOP       ; если B ≠ 0 — повторить
        STA  RES        ; сохранить результат
        HLT

        ORG  0080h
RES:    DB   0`},{id:"mult",src:`; Умножение 6 × 7 сложением (у 8080 нет команды MUL)
        MVI  B, 6       ; множимое
        MVI  C, 7       ; множитель = сколько раз прибавить
        MVI  A, 0       ; произведение = 0
LOOP:   ADD  B          ; A ← A + 6
        DCR  C          ; осталось на один раз меньше
        JNZ  LOOP       ; пока C ≠ 0
        STA  RES        ; 42 = 2Ah
        HLT

        ORG  0080h
RES:    DB   0`},{id:"string",src:`; Вывод строки: цикл с условием выхода
        LXI  H, MSG     ; HL указывает на начало строки
NEXT:   MOV  A, M       ; A ← очередной символ
        CPI  0          ; конец строки? (код 0)
        JZ   DONE       ; да — выйти из цикла
        OUT  01h        ; вывести символ на экран
        INX  H          ; перейти к следующему символу
        JMP  NEXT       ; повторить
DONE:   HLT

        ORG  0080h
MSG:    DB   'HELLO', 0`},{id:"upper",src:`; Строчные буквы → прописные (сброс бита 5 командой ANI)
        LXI  H, MSG
NEXT:   MOV  A, M       ; очередной символ
        CPI  0
        JZ   DONE
        ANI  0DFh       ; 1101 1111: бит 5 = 0 → 'h' (68h) → 'H' (48h)
        OUT  01h
        INX  H
        JMP  NEXT
DONE:   HLT

        ORG  0080h
MSG:    DB   'intel', 0`},{id:"stack",src:`; Стек: PUSH и POP (последним пришёл — первым ушёл)
        LXI  SP, 0100h  ; вершина стека — за концом памяти
        MVI  B, 11h
        MVI  C, 22h     ; BC = 1122h
        PUSH B          ; [00FFh] ← B, [00FEh] ← C, SP = 00FEh
        MVI  B, 0
        MVI  C, 0       ; BC «испорчен»
        POP  D          ; DE ← 1122h из стека, SP = 0100h
        HLT`},{id:"call",src:`; Подпрограмма: CALL сохраняет адрес возврата в стеке, RET его забирает
        LXI  SP, 0100h
        MVI  A, 'O'
        CALL PRINT      ; вызвать подпрограмму
        MVI  A, 'K'
        CALL PRINT      ; ещё раз — возврат будет в другое место
        HLT

PRINT:  OUT  01h        ; подпрограмма: вывести A на экран
        RET             ; вернуться туда, откуда вызвали`},{id:"echo",kbd:"Hi 8080!",src:`; Ввод с клавиатуры (порт 00h) и вывод на экран (порт 01h)
NEXT:   IN   00h        ; A ← код нажатой клавиши (0 — нажатий нет)
        CPI  0
        JZ   DONE       ; клавиш больше нет — конец
        OUT  01h        ; «эхо»: показать символ на экране
        JMP  NEXT
DONE:   HLT`},{id:"carry",src:`; Переполнение байта и флаг переноса CY
        MVI  A, 0F0h    ; A = 240
        ADI  20h        ; 240 + 32 = 272 > 255  →  CY = 1
        JC   OVER       ; был перенос — переход
        HLT
OVER:   MVI  A, '!'     ; сообщить о переполнении
        OUT  01h
        HLT`},{id:"data",src:`; Байт = данные или команда? (HLT забыт!)
        MVI  A, 5       ; A ← 5
        MOV  B, A       ; B ← A
                        ; здесь должна быть HLT...
NUM:    DB   3Ch, 76h   ; задумано как числа 60 и 118,
                        ; но PC дойдёт до них, и процессор
                        ; выполнит их как команды INR A и HLT`}];// какие заготовки используют мнемонику (для справочника команд)
const PRESET_USES=(()=>{const map={};PRESETS.forEach(p=>{assemble(p.src).used.forEach(mn=>{(map[mn]=map[mn]||[]).push(p.id);});});return map;})();const presetsFor=e=>{if(e.mn==="Jcc")return[...new Set([...(PRESET_USES.JZ||[]),...(PRESET_USES.JNZ||[]),...(PRESET_USES.JC||[]),...(PRESET_USES.JNC||[])])];if(e.id==="MOV_rm"||e.id==="MOV_mr"){return PRESETS.filter(p=>new RegExp(e.id==="MOV_rm"?"MOV\\s+[A-L],\\s*M":"MOV\\s+M,","i").test(p.src)).map(p=>p.id);}if(e.id==="MVI_m")return[];return PRESET_USES[e.mn]||[];};// ---------------------------------------------------------------------

us:"Шина управления"},ph:{fetch:"Выборка",decode:"Декодирование",operand:"Чтение операнда",mem:"Обращение к памяти",exec:"Исполнение",write:"Запись результата",io:"Ввод-вывод"},which:{lo:"младший байт адреса",hi:"старший байт адреса",data:"байт-константа",port:"номер порта"},dstName:r=>({A:"аккумулятор A",TMP:"временный регистр TMP",W:"временный регистр W",Z:"временный регистр Z",F:"регистр флагов (PSW)",PCH:"старший байт PC",PCL:"младший байт PC"})[r]||`регистр ${r}`,short:{fetchAddr:()=>"PC → адрес",fetchRead:p=>`байт ${h2(p.op)}`,fetchIR:()=>"→ IR",decode:()=>"что за команда?",opAddr:()=>"PC → адрес",opRead:p=>`байт → ${p.dst}`,memAddr:p=>`${p.pair} → адрес`,memRead:p=>`память → ${p.dst}`,memWrite:p=>`${p.src} → память`,regToTmp:p=>`${p.src} → TMP`,tmpToReg:p=>`TMP → ${p.dst}`,aluPrep:()=>"A → ACT",aluPrepA:()=>"A → ACT",aluCalc:p=>`${p.a} ${opSym(p.kind)} ${p.b} = ${p.r}`,aluStore:p=>`→ ${p.dst}`,inx:p=>`${p.pair} + 1`,dcx:p=>`${p.pair} − 1`,spLoad:()=>"WZ → SP",spDec:()=>"SP − 1",spInc:()=>"SP + 2",condCheck:p=>`${p.flag}=${p.val} ?`,jmpLoad:()=>"WZ → PC",callLoad:()=>"WZ → PC",retLoad:()=>"стек → PC",condSkip:()=>"без перехода",ioWrite:()=>"A → экран",ioRead:()=>"клавиатура → A",halt:()=>"стоп",nop:()=>"—",illegal:()=>"ошибка",unsupported:()=>"нет в симуляторе"},steps:{fetchAddr:p=>({t:"Выборка: адрес команды на шину",x:`Счётчик команд PC = ${h4(p.pc)} хранит адрес следующей команды. Через защёлку адреса и буфер адреса это значение выставляется на шину адреса. Устройство управления выдаёт сигнал SYNC — начинается машинный цикл M1 (выборка кода операции).`}),fetchRead:p=>({t:"Выборка: чтение байта из памяти",x:`Память по адресу ${h4(p.pc)} выдаёт на шину данных байт ${h2(p.op)} (${b8s(p.op)}). Сигнал DBIN означает «процессор читает». Сам байт ничего о себе не знает — это просто 8 бит. Одновременно PC увеличивается на 1 и становится ${h4(p.pc1)} — так он заранее указывает на следующий байт программы.`}),fetchIR:p=>({t:"Выборка: байт → регистр команд",x:`Через буфер шины данных и внутреннюю шину байт ${h2(p.op)} попадает в регистр команд IR. Поскольку байт прочитан в цикле M1, процессор считает его кодом операции — именно это делает байт командой.`}),decode:(p,d)=>({t:"Декодирование команды",x:`Дешифратор разбирает биты ${b8s(p.op)}: это команда ${d.pat}. ${ui.ru.simDesc[d.mn]?ui.ru.simDesc[d.mn](d):""} Длина команды — ${d.len} байт${d.len===1?", все данные уже есть.":`а: нужно прочитать ещё ${d.len-1} байт${d.len-1===1?"":"а"} операнда.`} Устройство управления получает план: какие машинные циклы выполнить дальше.`}),opAddr:p=>({t:`Цикл ${p.cyc}: адрес операнда`,x:`Команда продолжается в памяти. Чтобы получить ${ui.ru.which[p.which]}, PC = ${h4(p.pc)} снова выставляется на шину адреса.`}),opRead:p=>({t:`Чтение операнда → ${p.dst}`,x:`Память выдаёт ${vv(p.val)} — ${ui.ru.which[p.which]}. Байт проходит буфер шины данных и внутреннюю шину и записывается в ${ui.ru.dstName(p.dst)}. PC увеличивается до ${h4(p.pc1)}.${p.which==="hi"?" Регистры W и Z вместе хранят 16-битный адрес: в памяти он лежит «младшим байтом вперёд».":""}`}),memAddr:p=>({t:`Цикл ${p.cyc}: адрес ячейки данных`,x:p.pair==="SP"?`Адрес ${h4(p.addr)} берётся из указателя стека SP и выставляется на шину адреса. Так процессор обращается к вершине стека.`:`Адрес ${h4(p.addr)} берётся из пары регистров ${p.pair} (а не из PC!) и через защёлку и буфер адреса выставляется на шину адреса. Так процессор обращается к данным, а не к командам.`}),memRead:p=>({t:`Чтение данных: [${h4(p.addr)}] → ${p.dst}`,x:`Память выдаёт содержимое ячейки ${h4(p.addr)} = ${vv(p.val)} на шину данных (сигнал DBIN). Через буфер и внутреннюю шину байт записывается в ${ui.ru.dstName(p.dst)}. Здесь тот же самый байт воспринимается как данные — потому что он прочитан не в цикле M1.`}),memWrite:p=>({t:`Запись в память: ${p.src} → [${h4(p.addr)}]`,x:`Содержимое: ${ui.ru.dstName(p.src)} = ${vv(p.val)} идёт по внутренней шине в буфер и на шину данных. Сигнал WR («запись») — память сохраняет байт в ячейке ${h4(p.addr)}. Старое значение ячейки стёрто.`}),regToTmp:p=>({t:`${p.src} → TMP`,x:`Значение ${ui.ru.dstName(p.src)} = ${vv(p.val)} через ${p.src==="A"?"":"мультиплексор и "}внутреннюю шину копируется во временный регистр TMP. Внутренняя шина одна, поэтому передача идёт через промежуточный регистр.`}),tmpToReg:p=>({t:`TMP → ${p.dst}`,x:`Из TMP значение ${vv(p.val)} по внутренней шине записывается в ${ui.ru.dstName(p.dst)}. Копирование завершено: в ${p.src} осталось прежнее значение — копирование не «перемещает», а дублирует данные.`}),aluPrep:p=>({t:"Подготовка операндов АЛУ",x:`A = ${vv(p.a)} копируется в буфер аккумулятора ACT, второй операнд ${p.src} = ${vv(p.b)} — во временный регистр TMP. Буферы нужны, чтобы АЛУ могло записать результат обратно в A, не «испортив» свои входы.`}),aluPrepA:p=>({t:"Подготовка операндов АЛУ",x:`Второй операнд ${vv(p.b)} уже во временном регистре TMP. Аккумулятор A = ${vv(p.a)} копируется в буфер ACT.`}),aluCalc:p=>{const opText={ADD:"сложение",ADI:"сложение",SUB:"вычитание",SUI:"вычитание",CMP:"сравнение (вычитание без сохранения)",CPI:"сравнение (вычитание без сохранения)",INR:"увеличение на 1",DCR:"уменьшение на 1",ANA:"логическое И",ANI:"логическое И",XRA:"исключающее ИЛИ",XRI:"исключающее ИЛИ",ORA:"логическое ИЛИ",ORI:"логическое ИЛИ"}[p.kind];const cmp=p.kind==="CMP"||p.kind==="CPI";const logic=ALU_AND.includes(p.kind)||ALU_XOR.includes(p.kind)||ALU_OR.includes(p.kind);return{t:`АЛУ: ${opText}`,x:logic?`АЛУ выполняет ${opText} побитно: ${b8s(p.a)} ${opSym(p.kind)} ${b8s(p.b)} = ${b8s(p.r)} (${h2(p.r)}). Каждый бит результата зависит только от битов в том же разряде. Флаги: Z=${p.F.Z}, S=${p.F.S}, P=${p.F.P}; логические команды всегда сбрасывают CY.`:`АЛУ вычисляет ${p.a} ${opSym(p.kind)} ${p.b} = ${p.r} (${h2(p.r)}). Флаги: Z=${p.F.Z}${p.F.Z?" (результат ноль)":""}, S=${p.F.S}${p.F.S?" (старший бит 1)":""}, P=${p.F.P}, CY=${p.F.CY}${p.F.CY&&!p.unary?" (перенос/заём за пределы байта!)":""}${p.unary?" (INR/DCR флаг CY не меняют)":""}.${cmp?" Результат никуда не записывается — важны только флаги: Z=1 означает «A равно операнду».":""}`};},aluStore:p=>({t:`Результат → ${p.dst}`,x:`Результат ${vv(p.r)} с выхода АЛУ по внутренней шине записывается в ${ui.ru.dstName(p.dst)}.`}),inx:p=>({t:`Увеличение пары ${p.pair}`,x:`16-битная пара ${p.pair} = ${h4(p.from)} проходит через схему инкремента/декремента и становится ${h4(p.to)}. АЛУ и флаги не участвуют. Так удобно «шагать» по ячейкам памяти.`}),dcx:p=>({t:`Уменьшение пары ${p.pair}`,x:`16-битная пара ${p.pair} = ${h4(p.from)} уменьшается на 1 схемой инкремента/декремента: ${h4(p.to)}. Флаги не меняются.`}),spLoad:p=>({t:"WZ → SP",x:`Указатель стека получает значение ${h4(p.v)}. Теперь стек будет расти вниз от этого адреса.`}),spDec:p=>({t:"Указатель стека: SP − 1",x:`Стек растёт вниз, поэтому перед записью SP уменьшается: ${h4(p.from)} → ${h4(p.to)}. Первым в стек пойдёт старший байт.`}),spInc:p=>({t:"Указатель стека: SP + 2",x:`Два байта сняты с вершины стека, SP вернулся: ${h4(p.from)} → ${h4(p.to)}. Сами байты в памяти остались, но теперь считаются свободным местом.`}),condCheck:p=>({t:`Проверка условия ${p.mn}`,x:`Команда ${p.mn} требует ${p.flag} = ${p.need}. Сейчас флаг ${p.flag} = ${p.val}, поэтому переход ${p.taken?"ВЫПОЛНЯЕТСЯ":"НЕ выполняется"}. Флаги были установлены предыдущей арифметической командой — так результат вычисления управляет ходом программы.`}),jmpLoad:p=>({t:`Переход: PC ← ${h4(p.addr)}`,x:`Адрес перехода, собранный в W (старший байт) и Z (младший), загружается в счётчик команд. Следующая выборка пойдёт с адреса ${h4(p.addr)}, а не с соседней ячейки. Переход — это просто запись нового значения в PC.`}),callLoad:p=>({t:`Вызов подпрограммы: PC ← ${h4(p.addr)}`,x:`Адрес возврата ${h4(p.ret)} (команда после CALL) уже сохранён в стеке, SP = ${h4(p.sp)}. Теперь в PC загружается адрес подпрограммы ${h4(p.addr)}.`}),retLoad:p=>({t:`Возврат: PC ← ${h4(p.addr)}`,x:`Из стека прочитаны два байта — адрес возврата ${h4(p.addr)}. Он загружается в PC, SP возвращается: ${h4(p.from)} → ${h4(p.to)}. Программа продолжится с команды, следующей за CALL.`}),condSkip:p=>({t:"Переход пропущен",x:`Условие не выполнено: PC уже равен ${h4(p.pc)} — выполнение продолжится со следующей по порядку команды. Прочитанный адрес перехода просто не используется.`}),ioWrite:p=>({t:`Вывод: A → порт ${h2(p.port)}`,x:`Цикл вывода: номер порта ${h2(p.port)} выставляется на шину адреса, содержимое A = ${vv(p.val)} — на шину данных, сигналы WR и I/O говорят «запись в устройство», а не в память. Экран на порту ${h2(p.port)} рисует символ «${p.ch==="\n"?"↵":p.ch}» — он понимает байт как код символа ASCII.`}),ioRead:p=>({t:`Ввод: порт ${h2(p.port)} → A`,x:`Цикл ввода: номер порта ${h2(p.port)} на шине адреса, сигналы DBIN и I/O — «чтение из устройства». ${p.empty?"Нажатых клавиш нет — клавиатура отдаёт 00h.":`Клавиатура выставляет на шину данных код клавиши ${vv(p.val)} ('${charOf(p.val)||"?"}'), и он попадает в аккумулятор A.`}`}),halt:()=>({t:"HLT: остановка",x:"Процессор остановлен, программа завершена. Результаты остаются там, куда их записала программа: в регистрах, в ячейках памяти, на экране."}),nop:()=>({t:"NOP: нет операции",x:"Процессор ничего не делает и переходит к следующей команде. Код 00h часто встречается в «пустой» памяти."}),illegal:p=>({t:"Неизвестный код операции",x:`Байт ${h2(p.op)} по адресу ${h4(p.pc)} не является командой 8080 — выполнение остановлено. Частая причина: в программе нет HLT, и PC «убежал» в область данных.`}),unsupported:p=>({t:"Команда не поддерживается симулятором",x:`Байт ${h2(p.op)} по адресу ${h4(p.pc)} — это команда ${p.pat}. Она есть у 8080, но в учебный набор симулятора не входит (см. ★ во вкладке 6). Возможно, PC «убежал» в область данных.`})},simDesc:{NOP:()=>"Нет операции.",HLT:()=>"Остановить процессор.",MOV:d=>d.s==="M"?`Копировать байт из памяти по адресу в HL в регистр ${d.d}.`:d.d==="M"?`Копировать регистр ${d.s} в память по адресу в HL.`:`Копировать регистр ${d.s} в регистр ${d.d}.`,MVI:d=>d.d==="M"?"Записать константу (следующий байт) в память по адресу HL.":`Загрузить константу (следующий байт) в регистр ${d.d}.`,INR:d=>`Увеличить ${d.d} на 1.`,DCR:d=>`Уменьшить ${d.d} на 1.`,LDA:()=>"Загрузить в A байт из памяти; адрес — в двух следующих байтах.",STA:()=>"Сохранить A в память; адрес — в двух следующих байтах.",LXI:d=>`Загрузить 16-битную константу в пару ${PAIR_FULL[d.rp]}.`,INX:d=>`Увеличить пару ${PAIR_FULL[d.rp]} на 1.`,DCX:d=>`Уменьшить пару ${PAIR_FULL[d.rp]} на 1.`,ADD:d=>`A ← A + ${d.s}.`,SUB:d=>`A ← A − ${d.s}.`,CMP:d=>`Сравнить A с ${d.s} (установить флаги).`,ANA:d=>`A ← A AND ${d.s}.`,XRA:d=>`A ← A XOR ${d.s}.`,ORA:d=>`A ← A OR ${d.s}.`,ADI:()=>"A ← A + константа.",SUI:()=>"A ← A − константа.",CPI:()=>"Сравнить A с константой (установить флаги).",ANI:()=>"A ← A AND константа.",XRI:()=>"A ← A XOR константа.",ORI:()=>"A ← A OR константа.",OUT:()=>"Вывести A в порт устройства; номер порта — в следующем байте.",IN:()=>"Прочитать в A байт из порта устройства; номер порта — в следующем байте.",JMP:()=>"Безусловный переход; адрес — в двух следующих байтах.",JZ:()=>"Переход, если Z = 1 (результат был нулём).",JNZ:()=>"Переход, если Z = 0 (результат не ноль).",JC:()=>"Переход, если CY = 1 (был перенос).",JNC:()=>"Переход, если CY = 0.",CALL:()=>"Вызвать подпрограмму: адрес возврата — в стек, затем переход.",RET:()=>"Вернуться из подпрограммы по адресу из стека.",PUSH:d=>`Записать ${PAIR_FULL[d.rp]} в стек (2 байта).`,POP:d=>`Извлечь 2 байта из стека в ${PAIR_FULL[d.rp]}.`,"???":()=>"Неизвестная команда."},seg:{op:"код операции",dst:"приёмник DDD",src:"источник SSS",pair:"пара RP",cond:"условие CCC",n:"номер NNN"},panel:{now:"Что происходит сейчас",instr:"Текущая команда",buses:"Шины",decoder:"Дешифратор: как читается код",regCodes:"Коды регистров в команде",program:"Программа: текст → машинные коды",regs:"Регистры и флаги",calc:"Вычисление в АЛУ",noStep:"Процессор ещё не начал работу.",memory:"Память целиком",bytes:n=>`${n} ${n===1?"байт":"байта"}`},listHead:{addr:"Адрес",code:"Машинный код",asm:"Ассемблер",note:"Комментарий"},regHead:{r:"Рег.",hex:"Hex",dec:"Dec",bin:"Двоичный",chr:"Символ"},kind:{op:"код операции",arg:"операнд команды",data:"данные (число)",char:"данные (символ)",stack:"область стека",free:"не используется"},memLegend:{pc:"PC указывает сюда",access:"обращение сейчас",written:"изменено программой"},asmErr:{label:a=>`Неизвестная метка «${a}»`,value:a=>`Не удалось разобрать значение «${a}»`,ops:a=>`Неверное число операндов (нужно ${a})`,reg:a=>`Ожидался регистр A, B, C, D, E, H, L или M, получено «${a||""}»`,pair:a=>`Ожидалась пара B, D, H или SP, получено «${a||""}»`,pairpsw:a=>`Ожидалась пара B, D, H или PSW, получено «${a||""}»`,byte:a=>`Значение «${a}» не помещается в байт (0…255)`,range:a=>`Адрес ${a} за пределами памяти (0000–00FFh)`,overflow:a=>`Программа не помещается в память (адрес ${a})`,mnemonic:a=>`Команда «${a}» не поддерживается симулятором (см. ★ во вкладке 6)`,movmm:()=>"Команда MOV M, M не существует (её код занят командой HLT)",dup:a=>`Метка «${a}» объявлена дважды`,syntax:a=>`Синтаксическая ошибка: «${a||""}»`}});Object.assign(ui.ru,{// ================= Вкладка 4. Память, регистры, стек =================
memt:{memIntro:{h:"Память",p:["**Память** — это очень длинный ряд одинаковых ячеек, в каждой по 1 байту. Ячейки пронумерованы: номер ячейки называется **адресом**. Чтобы прочитать или записать байт, процессор сообщает памяти адрес.","Адрес у 8080 — 16-битный: процессор выставляет его на 16 проводах (**линиях адреса** A0…A15). 16 бит дают 2¹⁶ = 65 536 разных адресов — от 0000h до FFFFh. Это **адресное пространство** 8080: 64 килобайта (1 КБ = 1024 байта).","В памяти одновременно лежат и **команды** программы, и **данные**, с которыми она работает. Процессор не отличает одно от другого (вспомните вкладку 1) — какую часть памяти отвести под что, решает программист."]},addrTitle:"Адрес и линии адреса",addrHint:"Введите адрес или двигайте ползунок: на линиях A15…A0 появится его двоичный код.",mapTitle:"Распределение памяти",mapReal:"Типичная система на 8080 (64 КБ)",mapModel:"Наша учебная модель (256 байт)",mapItems:{rom:"ПЗУ: стартовая программа (выполняется после включения)",ram:"ОЗУ: программы и данные",free:"не установлено / устройства",stack:"стек (растёт вниз)",code:"0000–007Fh: команды",data:"0080–00DFh: данные",stk:"00E0–00FFh: стек"},wordTitle:"16-битное число в памяти",wordHint:"Число из двух байтов занимает две соседние ячейки: по меньшему адресу — младший байт.",wordValue:"Число",wordAddr:"Адрес",regs:{h:"Регистры процессора 8080",p:["**Регистры** — несколько ячеек памяти внутри самого процессора. Работа с ними быстрее всего: не нужно обращаться к внешней памяти. Программист может использовать семь 8-битных регистров и несколько специальных.","Регистры B, C, D, E, H, L можно объединять **парами** BC, DE, HL — тогда они хранят 16-битное число, например адрес."],list:[["A","Аккумулятор","главный регистр: из него арифметико-логическое устройство (АЛУ — сумматор и логические схемы процессора) берёт первый операнд и в него же записывает результат."],["B, C, D, E","Регистры общего назначения","для промежуточных данных, счётчиков циклов."],["H, L","Пара HL — указатель","обычно хранит адрес ячейки памяти. В командах ячейка по адресу HL обозначается буквой **M** (memory)."],["F","Регистр флагов","признаки результата последней операции (подробно ниже)."],["SP","Указатель стека","16 бит, адрес вершины стека."],["PC","Счётчик команд","16 бит, адрес следующей команды."]],hidden:"Кроме того, внутри есть служебные регистры, недоступные программисту: регистр команд IR, временные регистры W, Z (не путать с флагом Z), TMP, буфер аккумулятора. Их работу мы увидим во вкладке 7.",codeTitle:"Адресация регистра: номер вместо имени",codeP:"В коде команды регистр указывается не буквой, а **3-битным номером** (полем). Нажмите на регистр, чтобы увидеть его номер и пример команды."},modes:{h:"Способы адресации: где взять операнд",p:["**Способ адресации** — это правило, по которому команда указывает, где находится её операнд. У 8080 их пять. Обозначение в квадратных скобках **[0081h]** читается как «содержимое ячейки с адресом 0081h», а **[HL]** — «содержимое ячейки, адрес которой лежит в HL».","Команды IN и OUT берут номер порта из второго байта команды — это обращение к устройству, а не к памяти, поэтому отдельным способом адресации его не считают."],items:[{name:"Непосредственная",ex:"MVI A, 25",bytes:[0x3e,0x19],where:"операнд — прямо в команде (второй байт)",flow:["команда: 3Eh 19h","A ← 19h"]},{name:"Регистровая",ex:"MOV A, B",bytes:[0x78],where:"операнд — в регистре, номер регистра — поле в коде операции",flow:["B = 11h","A ← 11h"]},{name:"Прямая",ex:"LDA 0081h",bytes:[0x3a,0x81,0x00],where:"в команде записан адрес ячейки памяти",flow:["адрес 0081h из команды","ячейка [0081h] = 11h","A ← 11h"]},{name:"Косвенная регистровая",ex:"MOV A, M",bytes:[0x7e],where:"адрес ячейки лежит в паре HL — команда короткая, а адрес можно менять в цикле",flow:["HL = 0081h","ячейка [0081h] = 11h","A ← 11h"]},{name:"Стековая",ex:"POP B",bytes:[0xc1],where:"адрес берётся из указателя стека SP и автоматически меняется (подробно — в разделе «Стек» ниже)",flow:["SP = 00FEh","[00FEh] → C, [00FFh] → B","SP ← 0100h"]}],colEx:"Пример",colBytes:"Байты",colWhere:"Где операнд",colFlow:"Что происходит"},flags:{h:"Флаги",p:["После арифметических и логических команд процессор записывает в **регистр флагов F** несколько однобитных признаков результата. Сами по себе флаги ничего не делают — их проверяют **команды условного перехода**: «если результат был нулём — перейти туда-то». Так программа принимает решения."],layout:"Расположение флагов в байте F",list:[["S","Знак (Sign)","копия старшего бита результата: 1 — результат отрицательный (если считать его числом со знаком)."],["Z","Ноль (Zero)","1, если результат равен 0. Самый используемый флаг: так проверяют, равны ли два числа (их разность — ноль), и закончился ли счёт в цикле."],["AC","Вспомогательный перенос","перенос из 3-го разряда в 4-й (между тетрадами). Нужен только для арифметики с BCD-числами (вкладка 1)."],["P","Чётность (Parity)","1, если в результате чётное число единиц. Применялся для проверки ошибок при передаче данных."],["CY","Перенос (Carry)","перенос из старшего разряда при сложении или заём при вычитании. Показывает, что результат не поместился в байт."]],which:"Биты 5 и 3 байта F всегда равны 0, бит 1 — всегда 1: они не используются. Какие команды меняют флаги, указано в справочнике (вкладка 6); команды пересылки (копирования) данных флаги не меняют.",lab:"Проверьте сами: выберите операцию и числа",labHint:"Вычитание процессор выполняет как A + (−B) (вкладка 1). AC берётся из этого сложения как есть, а перенос из старшего разряда процессор записывает в CY **с инверсией**: CY = 1 означает «пришлось занять» (A меньше B). Логические операции AND, OR, XOR всегда обнуляют CY."},stack:{h:"Стек",p:["**Стек** — область памяти, работающая по правилу «последним пришёл — первым ушёл» (LIFO), как стопка тарелок: кладём сверху и снимаем сверху.","Адрес вершины стека хранит регистр **SP** (указатель стека) — он указывает на последний записанный байт. Стек 8080 растёт **вниз**, в сторону меньших адресов. Команда **PUSH** уменьшает SP и записывает в стек пару регистров (2 байта: сначала старший, потом младший), **POP** — читает 2 байта с вершины в пару и увеличивает SP. В командах стека буква B означает пару BC, D — пару DE, H — пару HL.","Команды **PUSH PSW** и **POP PSW** сохраняют в стек и восстанавливают аккумулятор A вместе с регистром флагов F (PSW — «слово состояния программы»). В нашей модели под стек отведены ячейки 00E0–00FFh. Пока стек пуст, SP = 0100h — на одну ячейку выше области стека, поэтому первый PUSH запишет байты в 00FFh и 00FEh.","Главное применение стека — **подпрограммы**: кусочки программы, которые вызывают из разных мест (например, «вывести символ»). Команда CALL кладёт в стек **адрес возврата** — адрес команды, стоящей сразу после CALL, — и переходит в подпрограмму; команда RET в конце подпрограммы забирает этот адрес из стека и возвращается. Так же стек используют прерывания (вкладка 5)."],lab:"Интерактивный стек",labHint:"Нажмите PUSH B: SP уменьшится на 2, а в ячейках 00FFh и 00FEh появятся байты пары BC — сначала B (старший), потом C (младший). Потом нажмите POP B и проследите, в каком порядке значения вернутся.",logEmpty:"Здесь появятся выполненные операции.",value:"Пара BC =",push:"PUSH B",pop:"POP B",reset:"Сброс",empty:"Стек пуст — POP вернул бы «мусор» из памяти.",top:"вершина",log:"Журнал",pushed:(v,sp)=>`PUSH: записано ${v}, SP = ${sp}`,popped:(v,sp)=>`POP: прочитано ${v}, SP = ${sp}`}}});Object.assign(ui.ru,{// ================= Вкладка 5. Процессор в системе =================
sys:{intro:[{h:"Микропроцессорная система",p:["Процессор сам по себе ничего не хранит, кроме нескольких регистров. Чтобы работать, он соединяется с **памятью** (где лежат программа и данные) и **устройствами ввода-вывода** — клавиатурой, экраном, дисками. Всё вместе называют **микропроцессорной системой**.","Соединяются эти части **шинами**. Шина — это группа проводов, по которым передаются сигналы: один провод — один бит."],terms:[["Шина адреса (A0–A15)","16 проводов. Процессор выставляет на неё адрес — **куда** он обращается. Направление: только от процессора."],["Шина данных (D0–D7)","8 проводов. По ней передаётся сам байт — **что** читается или записывается. Двунаправленная: байт идёт в процессор (чтение) или из процессора (запись)."],["Шина управления","отдельные сигналы — **когда** и **что делать**: читать или писать, обращаться к памяти или к устройству, ждать, уступить шины."]]},{h:"Такт, машинный цикл, командный цикл",terms:[["Такт","один период тактового генератора. Все действия процессора синхронизированы тактами. У 8080 обычная частота 2 МГц — такт длится 0,5 мкс."],["Машинный цикл","одно обращение к памяти или устройству: чтение или запись одного байта. Занимает 3–5 тактов (T1…T5). Циклы нумеруют M1, M2, …"],["Командный цикл","выполнение одной команды целиком: от 1 до 5 машинных циклов. Первый цикл (M1) всегда — выборка кода операции."]]}],legend:"Как читать схему: «лампы» на процессоре — его сигналы (лампа I/O — не отдельный вывод, а признак «обмен с устройством» из слова состояния; она показана для наглядности); зелёная лампа означает, что сигнал сейчас действует (READY горит, пока память успевает). Цветная «бегущая» линия — шина, по которой сейчас идёт передача; в белой рамке — передаваемое значение. Оранжевая рамка — блок, который сейчас работает.",pinsTitle:"Основные сигналы 8080",pinsNote:"Все сигналы, кроме адреса и данных, вместе составляют шину управления. HOLD/HLDA и INT на схеме нарисованы отдельными линиями, чтобы было видно, кто их подаёт. **Слово состояния** — байт, который процессор в начале каждого машинного цикла (по сигналу SYNC) выдаёт на шину данных, чтобы сообщить тип цикла: чтение команды, чтение или запись данных, ввод-вывод, стек, останов.",pins:[["A0–A15","выход","шина адреса"],["D0–D7","вход/выход","шина данных"],["SYNC","выход","начало машинного цикла; в этот момент на шине данных процессор передаёт «слово состояния» — тип цикла"],["DBIN","выход","процессор читает: устройство должно выставить байт на шину данных"],["WR","выход","процессор пишет: байт на шине данных нужно записать (на выводе действует низкий уровень, на схеме лампа просто «горит»)"],["READY / WAIT","вход / выход","память не успевает → READY = 0; процессор ждёт и сообщает об этом сигналом WAIT"],["HOLD / HLDA","вход / выход","запрос другого устройства на захват шин и подтверждение процессора (прямой доступ к памяти)"],["INT / INTE","вход / выход","запрос прерывания и признак «прерывания разрешены». INTE — не флаг из регистра F, а отдельный внутренний триггер; его устанавливает команда EI и сбрасывает команда DI"],["RESET","вход","сброс: PC = 0000h, процессор начинает работу заново"],["Φ1, Φ2","вход","две фазы тактовых импульсов от генератора"]],pinHead:["Сигнал","Направление","Назначение"],player:{title:"Как процессор работает с памятью и устройствами",hint:"Выберите сценарий и проходите его по шагам.",prev:"◀ Назад",next:"Далее ▶",auto:"▶ Авто",stop:"⏸ Стоп",frame:"Шаг"},labels:{cpu:"Процессор 8080",mem:"Память",io:"Устройства ввода-вывода",dma:"Контроллер ПДП + диск",irq:"Источник прерывания",abus:"Шина адреса",dbus:"Шина данных",cbus:"Шина управления",mode:"Режим",off:"отключён от шин"},scenarios:[{id:"read",name:"Чтение из памяти",mode:"выполнение программы",frames:[{t:"Адрес на шину (такт T1)",x:"Процессор хочет прочитать ячейку 0081h. Он выставляет этот адрес на шину адреса и сигналом SYNC сообщает: «начинаю машинный цикл».",on:["cpu","abus"],sig:["SYNC"],a:0x0081,cpu:"выставляет адрес"},{t:"Память выбирает ячейку (T1–T2)",x:"Дешифратор адреса (такой же, как в цифровой электронике) в памяти по 16 битам адреса выбирает одну-единственную ячейку из 65 536. Остальные ячейки к шине данных не подключаются.",on:["abus","mem","cell"],a:0x0081,cell:0x81},{t:"Сигнал чтения (T2–T3)",x:"Процессор выдаёт сигнал DBIN — «читаю». Выбранная ячейка выставляет своё содержимое, байт 11h, на шину данных.",on:["cbus","mem","cell","dbus"],sig:["DBIN"],a:0x0081,d:0x11,cell:0x81,dd:"in"},{t:"Байт принят (конец T3)",x:"Процессор запоминает байт с шины данных в своём регистре и снимает сигналы. Весь машинный цикл чтения занял 3 такта; шины свободны для следующего обращения.",on:["cpu"],cpu:"получил 11h"}]},{id:"write",name:"Запись в память",mode:"выполнение программы",frames:[{t:"Адрес на шину",x:"Процессор выставляет на шину адреса 0082h — номер ячейки, куда нужно записать результат.",on:["cpu","abus"],sig:["SYNC"],a:0x0082,cpu:"выставляет адрес"},{t:"Данные на шину",x:"Теперь процессор сам выставляет байт 2Ah на шину данных — при записи байт идёт из процессора.",on:["cpu","dbus","abus"],a:0x0082,d:0x2a,dd:"out",cpu:"выдаёт 2Ah"},{t:"Сигнал записи",x:"Сигнал WR («пиши»): память запоминает байт с шины данных в выбранной ячейке. Прежнее содержимое (00h) стёрто.",on:["cbus","mem","cell","dbus"],sig:["WR"],a:0x0082,d:0x2a,dd:"out",cell:0x82,write:true},{t:"Готово",x:"Ячейка 0082h теперь хранит 2Ah. Процессор снимает сигналы и переходит к следующему машинному циклу.",on:["mem","cell"],cell:0x82,write:true}]},{id:"program",name:"Выполнение программы",mode:"выполнение программы",frames:[{t:"Выборка команды",x:"Счётчик команд PC = 0000h. Процессор читает по этому адресу первый байт команды — 3Ah (код операции LDA). После чтения PC увеличивается на 1.",on:["cpu","abus","dbus","mem","cbus"],sig:["SYNC","DBIN"],a:0x0000,d:0x3a,dd:"in",pc:0x0001,cpu:"выборка"},{t:"Декодирование",x:"Внутри процессора дешифратор разбирает код 3Ah: «LDA — загрузить в A байт из памяти; адрес — в двух следующих байтах». Шины в этот момент не нужны.",on:["cpu"],pc:0x0001,cpu:"декодирует LDA"},{t:"Чтение операнда: младший байт (M2)",x:"Команде LDA нужен адрес. Процессор читает следующий байт команды по адресу PC = 0001h — это 81h, младший байт адреса. PC увеличивается до 0002h.",on:["cpu","abus","dbus","mem","cbus"],sig:["SYNC","DBIN"],a:0x0001,d:0x81,dd:"in",pc:0x0002,cpu:"читает адрес (мл.)"},{t:"Чтение операнда: старший байт (M3)",x:"Ещё одно чтение: по адресу 0002h лежит 00h — старший байт. Теперь процессор знает весь адрес 0081h. PC = 0003h.",on:["cpu","abus","dbus","mem","cbus"],sig:["SYNC","DBIN"],a:0x0002,d:0x00,dd:"in",pc:0x0003,cpu:"читает адрес (ст.)"},{t:"Исполнение (M4)",x:"Четвёртый машинный цикл — обращение уже к данным: адрес 0081h берётся не из PC, а из команды. Байт 11h попадает в аккумулятор. Итого команда LDA заняла 4 машинных цикла (13 тактов).",on:["cpu","abus","dbus","mem","cell","cbus"],sig:["SYNC","DBIN"],a:0x0081,d:0x11,dd:"in",cell:0x81,pc:0x0003,cpu:"A ← 11h"},{t:"Следующая команда",x:"Команда выполнена. PC = 0003h указывает на следующую команду — цикл «выборка → декодирование → исполнение» повторяется, пока не встретится команда HLT.",on:["cpu"],pc:0x0003,cpu:"к следующей команде"}]},{id:"io",name:"Обмен с устройством (OUT, IN)",mode:"выполнение программы",frames:[{t:"Вывод: номер порта на шину адреса",x:"Команда OUT 01h выводит байт на экран. Процессор выставляет на шину адреса номер порта 01h (у 8080 он дублируется в обеих половинах адреса: 0101h). В слове состояния процессор сообщает: «это обмен с устройством, а не с памятью» — поэтому память не откликается.",on:["cpu","abus","io","cbus"],sig:["SYNC"],a:0x0101,cpu:"OUT 01h"},{t:"Вывод: данные и запись",x:"Процессор выставляет содержимое аккумулятора — код символа 48h ('H') — на шину данных и выдаёт сигнал WR. Экран на порту 01h забирает байт и рисует букву H.",on:["cpu","dbus","cbus","io","abus"],sig:["WR"],a:0x0101,d:0x48,dd:"out",cpu:"выдаёт 48h"},{t:"Ввод: чтение порта",x:"Команда IN 00h читает клавиатуру. Номер порта 00h — на шине адреса, сигнал DBIN — «читаю». Клавиатура выставляет на шину данных код нажатой клавиши 69h ('i'), и он попадает в аккумулятор.",on:["cpu","abus","dbus","cbus","io"],sig:["SYNC","DBIN"],a:0x0000,d:0x69,dd:"in",cpu:"A ← 69h",noMem:true},{t:"Итог",x:"Устройства ввода-вывода подключены к тем же шинам, что и память. Отличаются только команды (IN/OUT вместо команд работы с памятью) и слово состояния, которое говорит, кто должен откликнуться. Номера портов — от 00h до FFh.",on:["cpu","io"],cpu:"готов"}]},{id:"wait",name:"Ожидание медленной памяти",mode:"ожидание (WAIT)",frames:[{t:"Память не готова",x:"Процессор выставил адрес, но медленная микросхема памяти ещё не успела найти данные. Она держит вход READY процессора в состоянии 0.",on:["cpu","abus","mem"],sig:["SYNC","DBIN"],ready0:true,a:0x0081,cpu:"ждёт"},{t:"Такты ожидания",x:"Пока READY = 0, процессор вставляет в машинный цикл дополнительные **такты ожидания** Tw и выдаёт сигнал WAIT. Адрес и сигналы остаются на шинах неизменными.",on:["cpu","abus","mem"],sig:["DBIN","WAIT"],ready0:true,a:0x0081,cpu:"такт Tw"},{t:"Память готова",x:"Память выставила байт и установила READY = 1. Процессор забирает данные и продолжает работу. Так к быстрому процессору можно подключать медленные устройства.",on:["cpu","dbus","mem","cell"],sig:["DBIN"],a:0x0081,d:0x11,dd:"in",cell:0x81,cpu:"получил 11h"}]},{id:"dma",name:"Прямой доступ к памяти (ПДП)",mode:"захват шин (HOLD)",frames:[{t:"Запрос шин",x:"Контроллеру диска нужно быстро переписать блок данных в память. Если бы это делал процессор, каждый байт проходил бы через него. Вместо этого контроллер ПДП подаёт сигнал HOLD — «отдай шины».",on:["dma","hold"],sig:["HOLD"],cpu:"выполняет программу"},{t:"Процессор уступает шины",x:"Процессор заканчивает текущий машинный цикл, **отключает** свои выходы от шин — переводит их в третье, высокоимпедансное состояние, как у логического элемента с тремя состояниями: выход будто отсоединён от провода. Затем отвечает сигналом HLDA. Выполнение программы приостановлено.",on:["cpu","hold"],sig:["HOLD","HLDA"],cpuOff:true,cpu:"отключён от шин"},{t:"Передача в обход процессора",x:"Теперь шинами управляет контроллер ПДП: он сам выставляет адрес 00A0h, байт с диска и сигнал записи. Байты идут из устройства прямо в память — отсюда название «прямой доступ».",on:["dma","abus","dbus","cbus","mem","cell"],sig:["HOLD","HLDA"],cpuOff:true,a:0x00a0,d:0x5a,dd:"dma",cell:0xa0,write:true,cpu:"отключён от шин"},{t:"Шины возвращены",x:"Блок передан, контроллер снимает HOLD. Процессор снимает HLDA, снова подключается к шинам и продолжает программу с того места, где остановился.",on:["cpu"],cpu:"продолжает программу"}]},{id:"int",name:"Прерывание",mode:"обработка прерывания",intro:"Зачем нужны прерывания? Без них программе пришлось бы постоянно опрашивать клавиатуру: «нажата ли клавиша?» — и тратить на это почти всё время. Прерывание позволяет устройству самому «позвать» процессор, когда что-то произошло. Подпрограмма, которая обслуживает такой вызов, называется **обработчиком прерывания**.",frames:[{t:"Запрос прерывания",x:"Процессор выполняет программу (здесь система «настоящая», с памятью 64 КБ: основная программа лежит с адреса 0100h). Прерывания разрешены: INTE = 1 — это внутренний триггер процессора (не флаг из регистра F), его устанавливает команда EI («разрешить прерывания»). Пользователь нажал клавишу — клавиатура подаёт сигнал INT: «срочно обработай меня».",on:["irq","int"],sig:["INT","INTE"],pc:0x0104,cpu:"выполняет программу"},{t:"Процессор принимает запрос",x:"Процессор **заканчивает текущую команду** (не прерывает её на середине), видит INT = 1 и INTE = 1 и принимает прерывание. Триггер INTE автоматически сбрасывается (INTE = 0), чтобы новое прерывание не помешало обработке.",on:["cpu","int"],sig:["INT"],pc:0x0104,cpu:"принимает прерывание"},{t:"Команда от устройства",x:"Вместо чтения следующей команды из памяти процессор читает её **с шины данных от устройства**. Клавиатура выставляет код CFh — однобайтовую команду RST 1 («вызвать подпрограмму по адресу 0008h»). Так устройство сразу сообщает, какой обработчик нужен: разные устройства присылают разные команды RST 0…7 (адреса 0000h, 0008h, …, 0038h).",on:["cpu","dbus","irq"],sig:["DBIN"],d:0xcf,dd:"irq",pc:0x0104,cpu:"получил RST 1"},{t:"Адрес возврата — в стек",x:"Как при вызове подпрограммы, процессор записывает текущее значение PC (0104h) в стек и загружает в PC адрес 0008h — там начинается **обработчик прерывания**.",on:["cpu","abus","dbus","mem","cbus"],sig:["WR"],a:0x00fe,d:0x04,dd:"out",pc:0x0008,cpu:"PC → стек"},{t:"Возврат",x:"Обработчик читает код клавиши, снова разрешает прерывания командой EI и выполняет RET: из стека возвращается адрес 0104h. Основная программа продолжается, «не заметив» перерыва. Чтобы не испортить ей регистры и флаги, обработчик в начале сохраняет их в стеке (PUSH), а перед RET восстанавливает (POP).",on:["cpu"],sig:["INTE"],pc:0x0104,cpu:"продолжает программу"}]},{id:"halt",name:"Останов (HLT)",mode:"останов",frames:[{t:"Команда HLT",x:"Процессор выполнил команду HLT и остановился: он больше не читает команды, шины неактивны. PC указывает на команду, следующую за HLT.",on:["cpu"],pc:0x000c,cpu:"ОСТАНОВ",halt:true},{t:"Как выйти из останова",x:"Выйти можно двумя способами: сигналом RESET (программа начнётся сначала, с адреса 0000h) или прерыванием (см. сценарий «Прерывание»), если оно было разрешено (INTE = 1). Во время останова процессор может также уступить шины по сигналу HOLD.",on:["cpu","irq","int"],sig:["INT","INTE"],pc:0x000c,cpu:"ОСТАНОВ",halt:true},{t:"Пробуждение прерыванием",x:"Пришёл сигнал INT — процессор выходит из останова, выполняет обработчик прерывания, а затем продолжает с команды после HLT. Так «спящий» процессор ждёт события, не тратя работу впустую.",on:["cpu","int"],sig:["INT"],pc:0x0008,cpu:"обработчик"}]},{id:"reset",name:"Сброс (RESET)",mode:"сброс",frames:[{t:"Сигнал RESET",x:"При включении питания или нажатии кнопки «Сброс» на вход RESET подаётся 1. Процессор прекращает любую работу.",on:["cpu"],sig:["RESET"],cpu:"сброс"},{t:"Начальное состояние",x:"Процессор записывает в PC = 0000h, запрещает прерывания (INTE = 0) и отменяет захват шин (HLDA = 0). Содержимое остальных регистров не определено — программа должна сама его задать.",on:["cpu"],sig:["RESET"],pc:0x0000,cpu:"PC = 0000h"},{t:"Старт программы",x:"Когда RESET снова становится 0, процессор начинает выборку с адреса 0000h. Поэтому в начале адресного пространства обычно стоит ПЗУ со стартовой программой.",on:["cpu","abus","dbus","mem","cbus"],sig:["SYNC","DBIN"],a:0x0000,d:0x31,dd:"in",pc:0x0001,cpu:"выборка с 0000h"}]}],modesTitle:"Режимы работы процессора — сводка",modesHead:["Режим","Как начинается","Что делает процессор","Как заканчивается"],modes:[["Выполнение программы","после сброса","циклически: выборка → декодирование → исполнение","командой HLT, запросами HOLD / INT"],["Ожидание","READY = 0","вставляет такты ожидания Tw, держит сигналы на шинах","READY = 1"],["Захват шин (ПДП)","HOLD = 1","отключается от шин, выдаёт HLDA","HOLD = 0"],["Прерывание","INT = 1 при INTE = 1","после текущей команды выполняет команду от устройства (обычно RST), сохраняя PC в стеке","командой RET в обработчике"],["Останов","команда HLT","ничего не выполняет","RESET или прерывание"],["Сброс","RESET = 1","PC = 0000h, INTE = 0","RESET = 0 → старт с 0000h"]]}});Object.assign(ui.ru,{// ================= Вкладка 6. Система команд =================
isa:{intro:[{h:"Система команд 8080",p:["У процессора 8080 **78 видов команд**; с учётом разных регистров и условий это 244 кода операции из 256 возможных (12 кодов не используются). Выучивать их все не нужно: по поведению они делятся на пять групп, а внутри группы устроены похоже.","Звёздочкой ★ отмечены команды, которые умеет выполнять симулятор во вкладке 7. Это самые употребительные команды — на них построены все учебные примеры."]}],legend:[["Обозначения","r — регистр A, B, C, D, E, H, L или M (ячейка по адресу HL); rp — пара BC, DE, HL или SP; d8 / d16 — константа в 1 / 2 байта; a16 — 16-битный адрес; port — номер порта; cc — условие (NZ, Z, NC, C, PO, PE, P, M); n — номер 0…7 в команде RST"],["Формат","двоичный вид кода операции: 0/1 — постоянные биты; DDD — приёмник, SSS — источник, RP — пара, CCC — условие, NNN — номер RST (см. вкладку 3); R — один бит пары в LDAX/STAX: 0 = BC, 1 = DE. ★ част. — из команд Jcc симулятор выполняет только JZ, JNZ, JC, JNC"],["Байт","длина команды"],["Такты","сколько тактов занимает выполнение (при 2 МГц такт = 0,5 мкс). Каждое обращение к памяти — ещё один машинный цикл (около 3 тактов), поэтому ADD B — 4 такта, а ADD M — 7; LDA — 13 (код, два байта адреса и сам байт данных). У условных команд — «не выполнено / выполнено»"],["Флаги","какие флаги меняет команда; «—» — не меняет; CY=0 — всегда сбрасывает; (PSW: *) — POP PSW восстанавливает все флаги из стека"]],tableHint:"Нажмите на строку — справа появится разбор команды и примеры-заготовки (вкладка 8), где она встречается.",groups:{move:{name:"Пересылка данных",d:"Копируют байты между регистрами, памятью и константами. Флаги не меняют. Это самые частые команды любой программы.",fmt:"Регистры задаются 3-битными полями DDD/SSS, пары — 2-битным полем RP."},arith:{name:"Арифметика",d:"Сложение, вычитание, увеличение и уменьшение на 1. Результат 8-битных операций — в аккумуляторе A; меняют флаги.",fmt:"10 ooo SSS (второй операнд — регистр или M) или 11 ooo 110 + байт (константа); ooo — номер операции: 000 ADD, 001 ADC, 010 SUB, 011 SBB."},logic:{name:"Логические и сравнение",d:"Побитовые И, ИЛИ, исключающее ИЛИ, сравнение, сдвиги аккумулятора. Сравнение CMP/CPI вычитает, не сохраняя результат, — только чтобы установить флаги.",fmt:"Такая же структура, как у арифметики: 10 ooo SSS или 11 ooo 110 + байт, где ooo — номер операции (И, исключающее ИЛИ, ИЛИ, сравнение)."},branch:{name:"Переходы и подпрограммы",d:"Меняют порядок выполнения: безусловные и условные переходы, вызов подпрограмм и возврат. Условие проверяет один из флагов.",fmt:"Условие задаёт 3-битное поле CCC; адрес — два следующих байта (младший первым)."},ctrl:{name:"Стек, ввод-вывод, управление",d:"Работа со стеком, обмен с устройствами через порты, управление прерываниями и остановка.",fmt:"В командах PUSH/POP вместо пары SP используется PSW — аккумулятор вместе с флагами."}},filterAll:"Все команды",filterSim:"Только ★ (есть в симуляторе)",head:["","Команда","Формат","Байт","Такты","Флаги","Действие"],simPart:"★ частично: в симуляторе есть JZ, JNZ, JC, JNC",starPart:"част.",detail:{title:"Подробно о команде",pick:"Выберите команду в таблице.",example:"Пример",bytes:"Машинный код примера",usedIn:"Встречается в примерах-заготовках",open:"Открыть в симуляторе",notSim:"Эта команда не входит в набор симулятора — её можно изучить только по справочнику."},desc:{MOV_rr:"r1 ← r2: скопировать регистр-источник r2 в регистр-приёмник r1",MOV_rm:"загрузить в регистр r байт из памяти по адресу в HL",MOV_mr:"записать регистр r в память по адресу в HL",MVI_r:"загрузить в регистр константу (второй байт команды)",MVI_m:"записать константу в память по адресу в HL",LXI:"загрузить 16-битную константу в пару регистров",LDA:"загрузить в A байт из памяти по адресу",STA:"записать A в память по адресу",LHLD:"загрузить в HL два байта из памяти (L ← [a], H ← [a+1])",SHLD:"записать HL в память (два байта)",LDAX:"загрузить в A байт из памяти по адресу в паре BC или DE",STAX:"записать A в память по адресу в паре BC или DE",XCHG:"обменять содержимое пар HL и DE",ADD:"A ← A + r",ADC:"A ← A + r + CY (сложение с переносом — для многобайтовых чисел)",ADI:"A ← A + константа",ACI:"A ← A + константа + CY",SUB:"A ← A − r",SBB:"A ← A − r − CY (вычитание с заёмом)",SUI:"A ← A − константа",SBI:"A ← A − константа − CY",INR:"r ← r + 1 (флаг CY не меняется)",DCR:"r ← r − 1 (флаг CY не меняется)",INX:"пара ← пара + 1 (16 бит, флаги не меняются)",DCX:"пара ← пара − 1",DAD:"HL ← HL + пара (16-битное сложение)",DAA:"десятичная коррекция A после сложения BCD-чисел",ANA:"A ← A AND r (побитовое И)",XRA:"A ← A XOR r (исключающее ИЛИ); XRA A — быстрый способ обнулить A",ORA:"A ← A OR r (побитовое ИЛИ)",CMP:"сравнить A с r: вычислить A − r только ради флагов (Z=1 — равны, CY=1 — A меньше)",ANI:"A ← A AND константа (маска: сбросить нужные биты)",XRI:"A ← A XOR константа (инвертировать нужные биты)",ORI:"A ← A OR константа (установить нужные биты)",CPI:"сравнить A с константой",RLC:"циклический сдвиг A влево; старший бит → CY и в младший",RRC:"циклический сдвиг A вправо",RAL:"сдвиг A влево через перенос CY",RAR:"сдвиг A вправо через перенос CY",CMA:"инвертировать все биты A",CMC:"инвертировать флаг CY",STC:"установить CY = 1",JMP:"перейти по адресу: PC ← адрес",Jcc:"перейти, если выполнено условие (JNZ, JZ, JNC, JC, JPO, JPE, JP, JM)",CALL:"вызвать подпрограмму: адрес возврата → стек, PC ← адрес",Ccc:"вызвать подпрограмму при условии (CNZ, CZ, CNC, CC, …)",RET:"вернуться из подпрограммы: PC ← адрес из стека",Rcc:"вернуться при условии (RNZ, RZ, …)",RST:"короткий вызов подпрограммы по адресу 8·n (так устройства вызывают обработчики прерываний → вкладка 5)",PCHL:"перейти по адресу из HL",PUSH:"записать пару в стек: SP ← SP − 2",POP:"извлечь пару из стека: SP ← SP + 2",XTHL:"обменять HL с двумя байтами на вершине стека",SPHL:"SP ← HL",IN:"прочитать байт из порта устройства в A (→ вкладка 5)",OUT:"отправить A в порт устройства (→ вкладка 5)",EI:"разрешить прерывания: INTE = 1 (→ вкладка 5)",DI:"запретить прерывания: INTE = 0",HLT:"остановить процессор (по шаблону MOV этот код был бы MOV M, M — бессмысленной командой, поэтому его отдали HLT)",NOP:"ничего не делать (1 команда = 4 такта задержки)"}},// ================= Вкладка 7. Архитектура =================
arch:{intro:[{h:"Внутри процессора",p:["Во вкладке 5 процессор был «чёрным ящиком». Теперь заглянем внутрь. Схема ниже повторяет структурную схему Intel 8080 из документации. Все блоки связаны **внутренней шиной данных** (8 бит); наружу процессор общается через **буфер шины данных** и **буфер адреса**.","**Как начать:** выберите программу в списке ниже и нажимайте **«Шаг ▶»**, читая после каждого нажатия панель **«Что происходит сейчас»** под схемой. Один шаг — один **этап** выполнения команды: обычно это один такт или одно действие внутри процессора. Кнопка **«Команда ⏩»** выполняет сразу все этапы текущей команды, **«◀ Шаг»** возвращает на этап назад, **«▶ Авто»** выполняет программу сама с выбранной скоростью — по этапам или сразу по командам.","**Цвета на схеме:** жёлтая заливка — блок, который работает на этом этапе; цветная «бегущая» линия — путь байта (оранжевая — шина адреса, синяя — шина данных, фиолетовая — сигналы управления, бирюзовая — передача внутри процессора); **красное число** — значение, которое только что изменилось."]}],blocksTitle:"Справка: что это за блоки? (раскройте; нажатие на карточку обводит блок на схеме синим)",phaseHint:"Полоска ниже — этапы текущей команды. M — машинный цикл (одно обращение к памяти или устройству), T — такт. Первый цикл M1 всегда начинается с выборки кода операции (T1–T3) и декодирования (T4); у короткой команды вроде MOV B, A он длится 4–5 тактов, и других циклов нет. Команда с операндами в памяти добавляет циклы: у LDA — M2 и M3 для двух байтов адреса и M4 для самого байта данных. Иногда в одном такте происходят два действия (например, на T4 — декодирование и первая пересылка) — тогда такт в полоске повторяется.",irStale:"Внимание: на этапах T1–T2 регистр IR ещё хранит код предыдущей команды — новый код попадёт в IR на такте T3, и дешифратор разберёт его на T4.",busLegend:"SYNC — начало машинного цикла; MEMR — чтение памяти; MEMW — запись в память; I/O RD, I/O WR — чтение и запись устройства; HLTA — подтверждение останова. MEMR, MEMW, I/O RD, I/O WR — сигналы шины управления системы: их собирает внешняя схема из DBIN / WR и слова состояния (вкладка 5), своих выводов с такими именами у 8080 нет.",labelsNote:"NUM1, NUM2, SUM и другие имена с двоеточием — метки (имена адресов). ORG и DB — указания ассемблеру, а не команды процессора. Подробно — во вкладке 8.",btnHint:"Шаг — один этап · Команда — до конца текущей команды · Авто — непрерывно · Масштаб — размер схемы",kbdHint:"(используется командой IN 00h — заготовка 12; нажмите Enter)",blocks:[["acc","Аккумулятор A","главный регистр: первый операнд и результат АЛУ"],["act","Буфер аккумулятора ACT","копия A на время вычисления. АЛУ читает первое число из ACT, а результат пишет в A: без копии вход АЛУ менялся бы прямо во время счёта"],["tmp","Временный регистр TMP","второй операнд АЛУ и промежуточная копия при пересылках"],["alu","АЛУ","арифметико-логическое устройство: сумматор и логические схемы"],["flags","Флаги","триггеры признаков результата S Z AC P CY"],["ir","Регистр команд IR","хранит код операции выполняемой команды"],["dec","Дешифратор команд","по коду операции определяет, какие действия и машинные циклы нужны"],["tc","Устройство управления","выдаёт управляющие сигналы в нужные такты: SYNC, DBIN, WR…"],["mux","Мультиплексор","подключает к внутренней шине нужный регистр из блока регистров"],["rB","B, C, D, E, H, L","регистры общего назначения, доступные программе"],["rW","W, Z","невидимые программисту регистры: в них процессор собирает 16-битный адрес из байтов команды (у LDA 0080h: Z = 80h, W = 00h). Не путать с флагом Z"],["rPC","PC, SP","счётчик команд и указатель стека"],["incLatch","Инкремент/декремент и защёлка адреса","прибавляет или вычитает 1 из 16-битных значений (PC, SP, пар). Защёлка держит текущий адрес на шине адреса, пока PC уже увеличен до следующего"],["abuf","Буфер адреса","выдаёт 16-битный адрес на внешнюю шину адреса"],["dbb","Буфер шины данных","связывает внутреннюю шину с внешней шиной данных"],["daa","Десятичная коррекция","поправляет результат при арифметике с BCD-числами (команда DAA); в наших примерах не используется"]]},// ================= Вкладка 8. Редактор =================
editor:{intro:[{h:"Пишем программу сами",p:["Программа на ассемблере — это текст, где **одна строка = одна команда**. Ассемблер переводит строки в байты и раскладывает их по памяти, начиная с адреса 0000h. После этого программу можно выполнить во вкладке 7.","Начните с заготовки: откройте её, прочитайте комментарии, выполните по шагам. Потом измените числа или команды (по справочнику во вкладке 6) и посмотрите, что поменяется."]}],syntaxTitle:"Правила записи",syntax:["`МЕТКА:  КОМАНДА  операнды   ; комментарий` — метка и комментарий необязательны.","**Метка** — имя адреса. Вместо `JMP 0004h` можно написать `JMP LOOP`, а ассемблер сам подставит адрес строки с меткой `LOOP:`.","**Числа**: 25 (десятичное), 19h или 0F0h (шестнадцатеричное; начинается с цифры), 1010b (двоичное), 'A' (код символа).","**ORG** и **DB** — не команды процессора, а **директивы**: указания самому ассемблеру. Машинного кода у них нет. `ORG адрес` — с какого адреса размещать следующие строки (в заготовках данные начинаются с `ORG 0080h`). `DB` — записать в память байты данных: `DB 25, 17`, `DB 'HELLO', 0`.","**Память симулятора — 256 байт**: программа — в 0000–007Fh, данные — с 0080h, стек растёт вниз от 0100h (ячейки 00E0–00FFh).","Всё после точки с запятой `;` — комментарий, процессор его не видит."],supported:"Команды, которые понимает симулятор",templates:"Заготовки",open:"Открыть в редакторе",run:"Выполнить во вкладке 7",commands:"Команды",title:"Редактор",assemble:"Ассемблировать",assembleRun:"Ассемблировать и выполнить →",errors:"Ошибки",ok:"Ошибок нет — программа загружена в память.",line:"Строка",listing:"Результат ассемблирования",kbdNote:"Для команды IN 00h задайте текст «нажатых клавиш» во вкладке 7 — в поле «Клавиатура» под схемой.",openNote:"«Открыть в редакторе» заменяет текст в редакторе на заготовку. «Выполнить» загружает заготовку и сразу переходит во вкладку 7.",tryLabel:"Попробуйте:",presetInfo:{copy:["Константы и копирование","Первое знакомство: константа загружается в регистр и копируется между регистрами. Наблюдайте, что копия не «перемещает» данные."],add:["Сложение двух чисел","Классическая схема программы: взять данные из памяти, обработать, вернуть результат в память.","замените 25 на 250. Какая сумма получилась и что стало с флагом CY?"],sub:["Вычитание и флаги","5 − 7 даёт FEh: это −2 в дополнительном коде. Следите за флагами CY, S и Z.","вычтите 5 из 7 — как изменятся флаги?"],char:["Вывод символа","Как байт превращается в букву на экране: команда OUT отправляет код символа в порт 01h.","выведите своё имя латиницей (MVI A, '…' и OUT 01h для каждой буквы)."],hl:["Указатель HL","Косвенная адресация: адрес ячейки хранится в паре HL и может меняться командой INX."],loop:["Цикл со счётчиком","Команда DCR уменьшает счётчик и ставит флаг Z, когда он дойдёт до нуля; JNZ повторяет цикл.","посчитайте сумму 1…10. Сколько команд выполнит процессор?"],mult:["Умножение сложением","У 8080 нет команды умножения — умножаем многократным сложением.","умножьте 20 на 15. Почему результат неверный? (подсказка: 300 > 255)"],string:["Вывод строки","Цикл по строке до байта 00h: указатель, сравнение, условный переход.","удалите 0 в конце строки. Что выведет программа и почему?"],upper:["Строчные → прописные","Логическое И с маской 0DFh сбрасывает бит 5 — разница между строчной и прописной буквой."],stack:["Стек PUSH / POP","Пара BC сохраняется в стеке, «портится» и восстанавливается в DE. Смотрите на SP и ячейки 00FEh–00FFh.","сохраните две пары подряд и достаньте их — в каком порядке они вернутся?"],call:["Подпрограмма CALL / RET","Одна подпрограмма вызывается дважды; адрес возврата каждый раз сохраняется в стеке."],echo:["Клавиатура → экран","Ввод-вывод через порты: IN читает код клавиши (порт 00h), OUT выводит его на экран (порт 01h)."],carry:["Переполнение и CY","Сумма не помещается в байт — процессор сообщает об этом флагом CY, и программа реагирует переходом JC."],data:["Данные или команда?","Программа без HLT: процессор «выполняет» данные. Байт становится командой, если до него дошёл PC."]}},// ================= Вкладка 9. 8086 =================
emu:{intro:[{h:"От 8080 к 8086",p:["Процессор **8086** (1978) — 16-битный наследник 8080. Intel сделала его так, чтобы программы 8080 можно было переписать почти механически: регистры 8080 стали 8-битными половинками регистров 8086, арифметика, сравнения, переходы, подпрограммы и стек (ADD, SUB, CMP, JMP, JZ, CALL, RET, PUSH, POP, IN, OUT, HLT) сохранили названия и смысл, а все команды пересылки объединились в одну — MOV. Команды IN и OUT в 8086 тоже есть, но в EMU8086 клавиатура и экран не подключены к нашим учебным портам 00h и 01h, поэтому символы вводят и выводят через DOS (см. ниже).","Но **машинные коды у 8086 совсем другие**: программу для 8080 нельзя запустить на 8086 как есть — её нужно переписать на ассемблере 8086. Зато всё, что вы разобрали в этом курсе, — байты, коды, регистры, флаги, стек, выборка и исполнение команд — в 8086 работает так же. Поэтому дальше можно смело переходить к эмулятору **EMU8086**.","Регистры 8086 16-битные, и каждый делится на две половины: **AX = AH:AL**, где H — старшая половина (high), L — младшая (low). Поэтому пара BC превращается в CX, а её части: B → CH (старший байт), C → CL (младший). Буквы пар не совпадают намеренно: у 8086 CX — счётчик циклов, как раньше пара BC, а BX — указатель на память, как пара HL. Остальные регистры и флаги из таблицы ниже, которых нет у 8080 (сегменты, BP, SI, DI, OF, DF, IF, TF), вы разберёте уже в EMU8086."]}],compareTitle:"Сравнение процессоров",compareHead:["","8080","8086"],compare:[["Год выпуска","1974","1978"],["Разрядность данных","8 бит","16 бит"],["Шина адреса","16 линий → 64 КБ","20 линий → 1 МБ (память делится на сегменты по 64 КБ)"],["Регистры общего назначения","A, B, C, D, E, H, L (8 бит)","AX, BX, CX, DX (16 бит = две половины: AH/AL…)"],["Указатели","SP, PC, HL","SP, BP, SI, DI, IP + сегментные CS, DS, SS, ES"],["Умножение и деление","нет, программой","есть: MUL, IMUL, DIV, IDIV"],["Флаги","S Z AC P CY","SF ZF AF PF CF + OF, DF, IF, TF"],["Тактовая частота","2 МГц","5–10 МГц"]],regTitle:"Соответствие регистров",regs:[["A","AL"],["B, C","CH, CL (пара BC → CX)"],["D, E","DH, DL (пара DE → DX)"],["H, L","BH, BL (пара HL → BX)"],["PC","IP"],["SP","SP"],["Флаги S Z AC P CY","SF ZF AF PF CF"]],cmdTitle:"Соответствие команд",head:["8080","8086 (EMU8086)","Смысл"],cmds:[["MVI A, 5","MOV AL, 5","константа → регистр"],["MOV B, A","MOV CH, AL","регистр → регистр"],["LDA NUM1","MOV AL, [NUM1]","память → регистр"],["STA SUM","MOV [SUM], AL","регистр → память"],["LXI H, MSG","MOV BX, OFFSET MSG","адрес → указатель (OFFSET — «адрес метки»)"],["MOV A, M","MOV AL, [BX]","память по указателю"],["ADD B","ADD AL, CH","сложение"],["SUI 7","SUB AL, 7","вычитание константы"],["CPI 0","CMP AL, 0","сравнение"],["ANI 0DFh","AND AL, 0DFh","логическое И"],["INR A / DCR B","INC AL / DEC CH","±1"],["INX H","INC BX","следующая ячейка"],["JMP / JZ / JNZ / JC","JMP / JZ / JNZ / JC","переходы"],["CALL / RET","CALL / RET","подпрограммы"],["PUSH B / POP B","PUSH CX / POP CX","стек (в 8086 — 16-битные регистры)"],["OUT 01h","MOV DL, AL\nMOV AH, 2\nINT 21h","вывод символа на экран через DOS"],["IN 00h","MOV AH, 1\nINT 21h","ввод символа с клавиатуры через DOS (код — в AL)"],["HLT","HLT (или RET / INT 20h)","завершение"]],exTitle:"Одна программа — два процессора",exNote:"В EMU8086 простая программа (формат .COM) начинается с директивы ORG 100h и завершается командой RET. Данные размещают после кода; метки данных пишут без двоеточия, метки команд — с двоеточием.",dosTitle:"Что такое INT 21h",dos:"На компьютерах с 8086 работала операционная система DOS. В ней есть готовые подпрограммы для ввода-вывода; их вызывают командой INT 21h — это программное прерывание: команда, похожая на RST, которая вызывает подпрограмму по номеру (не путать с сигналом INT из вкладки 5). Номер нужной функции кладут в регистр AH: 1 — прочитать символ с клавиатуры (код окажется в AL), 2 — вывести на экран символ из DL. DOS загружает простую программу .COM с адреса 100h (первые 256 байт занимает сама) и вызывает её как подпрограмму, поэтому RET в конце возвращает управление в DOS.",runTitle:"Как запустить пример в EMU8086",run:["Откройте EMU8086 и создайте новый файл (шаблон COM).","Скопируйте туда правый код.","Нажмите «emulate», затем «single step» — выполняйте программу по одной команде, как во вкладке 7.","В окне эмулятора кнопкой «vars» откройте переменные: после выполнения sum = 42."],ex8080:`; 8080: сложение двух чисел
      LDA  NUM1
      MOV  B, A
      LDA  NUM2
      ADD  B
      STA  SUM
      HLT
      ORG  0080h
NUM1:   DB   25
NUM2:   DB   17
SUM:    DB   0`,ex8086:`; 8086 (EMU8086): то же самое
org 100h
      mov  al, [num1]
      mov  ch, al
      mov  al, [num2]
