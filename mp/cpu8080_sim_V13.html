        OUT  01h        ; print the character on the screen
        INX  H          ; move to the next character
        JMP  NEXT       ; repeat
DONE:   HLT

        ORG  0080h
MSG:    DB   'HELLO', 0`,upper:`; Lowercase → uppercase letters (clearing bit 5 with ANI)
        LXI  H, MSG
NEXT:   MOV  A, M       ; next character
        CPI  0
        JZ   DONE
        ANI  0DFh       ; 1101 1111: bit 5 = 0 → 'h' (68h) → 'H' (48h)
        OUT  01h
        INX  H
        JMP  NEXT
DONE:   HLT

        ORG  0080h
MSG:    DB   'intel', 0`,stack:`; Stack: PUSH and POP (last in, first out)
        LXI  SP, 0100h  ; top of stack is just past the end of memory
        MVI  B, 11h
        MVI  C, 22h     ; BC = 1122h
        PUSH B          ; [00FFh] ← B, [00FEh] ← C, SP = 00FEh
        MVI  B, 0
        MVI  C, 0       ; BC is “corrupted”
        POP  D          ; DE ← 1122h from the stack, SP = 0100h
        HLT`,call:`; Subroutine: CALL saves the return address on the stack, RET takes it back
        LXI  SP, 0100h
        MVI  A, 'O'
        CALL PRINT      ; call the subroutine
        MVI  A, 'K'
        CALL PRINT      ; again, the return goes to a different place
        HLT

PRINT:  OUT  01h        ; subroutine: print A on the screen
        RET             ; return to where it was called from`,echo:`; Keyboard input (port 00h) and screen output (port 01h)
NEXT:   IN   00h        ; A ← code of the pressed key (0 = no key)
        CPI  0
        JZ   DONE       ; no more keys, finish
        OUT  01h        ; “echo”: show the character on the screen
        JMP  NEXT
DONE:   HLT`,carry:`; Byte overflow and the carry flag CY
        MVI  A, 0F0h    ; A = 240
        ADI  20h        ; 240 + 32 = 272 > 255  →  CY = 1
        JC   OVER       ; there was a carry, jump
        HLT
OVER:   MVI  A, '!'     ; report the overflow
        OUT  01h
        HLT`,data:`; Byte = data or instruction? (HLT forgotten!)
        MVI  A, 5       ; A ← 5
        MOV  B, A       ; B ← A
                        ; there should be a HLT here...
NUM:    DB   3Ch, 76h   ; meant as the numbers 60 and 118,
                        ; but PC will reach them, and the CPU
                        ; will execute them as INR A and HLT`};// ======================= RO =======================
Object.assign(ui.ro,{modeBasic:"De bază",modeExt:"Extins",modeBasicTip:"Mod de bază: doar esențialul pentru înțelegere",modeExtTip:"Mod extins: toate secțiunile, detaliile și laboratoarele suplimentare",modeMore:"Este afișat modul de bază — esențialul. Această filă mai are secțiuni cu detalii și laboratoare suplimentare.",modeGo:"Arată tot (mod extins)",title:"Cum funcționează procesorul: Intel 8080 pas cu pas",subtitle:"Un curs pentru cei care cunosc bazele electronicii digitale, dar nu s-au întâlnit încă cu procesoarele. Parcurgeți filele în ordine: de la biți și numere — la instrucțiuni, memorie, arhitectura procesorului și propriile programe.",nav:{tabs:[["numbers","1","Numere și date"],["enc","2","Caractere și codificări"],["cmd","3","Instrucțiuni"],["mem","4","Memorie, registre, stivă"],["sys","5","Procesorul în sistem"],["isa","6","Setul de instrucțiuni"],["arch","7","Arhitectură și execuție"],["editor","8","Editor de programe"],["emu","9","8080 → 8086"]],prev:"← Înapoi",next:"Înainte →",youAreHere:"Pasul",of:"din"},// ================= Simulator (șiruri comune) =================

loarea „${a}” nu încape într-un octet (0…255)`,range:a=>`Adresa ${a} este în afara memoriei (0000–00FFh)`,overflow:a=>`Programul nu încape în memorie (adresa ${a})`,mnemonic:a=>`Instrucțiunea „${a}” nu este suportată de simulator (vezi ★ în fila 6)`,movmm:()=>"Instrucțiunea MOV M, M nu există (codul ei este ocupat de HLT)",dup:a=>`Eticheta „${a}” este declarată de două ori`,syntax:a=>`Eroare de sintaxă: „${a||""}”`}});Object.assign(ui.ro,{// ================= Fila 4. Memorie, registre, stivă =================
memt:{memIntro:{h:"Memoria",p:["**Memoria** este un șir foarte lung de celule identice, fiecare de câte 1 octet. Celulele sunt numerotate: numărul celulei se numește **adresă**. Pentru a citi sau a scrie un octet, procesorul transmite memoriei adresa.","Adresa la 8080 are 16 biți: procesorul o pune pe 16 fire (**liniile de adresă** A0…A15). 16 biți dau 2¹⁶ = 65 536 de adrese diferite, de la 0000h la FFFFh. Acesta este **spațiul de adrese** al lui 8080: 64 de kiloocteți (1 KB = 1024 de octeți).","În memorie se află în același timp și **instrucțiunile** programului, și **datele** cu care lucrează acesta. Procesorul nu le deosebește (amintiți-vă fila 1): programatorul decide ce parte a memoriei este destinată fiecăruia."]},addrTitle:"Adresa și liniile de adresă",addrHint:"Introduceți o adresă sau mișcați cursorul: pe liniile A15…A0 va apărea codul ei binar.",mapTitle:"Harta memoriei",mapReal:"Un sistem tipic cu 8080 (64 KB)",mapModel:"Modelul nostru didactic (256 de octeți)",mapItems:{rom:"ROM: programul de pornire (rulează după alimentare)",ram:"RAM: programe și date",free:"neinstalată / dispozitive",stack:"stivă (crește în jos)",code:"0000–007Fh: instrucțiuni",data:"0080–00DFh: date",stk:"00E0–00FFh: stivă"},wordTitle:"Un număr de 16 biți în memorie",wordHint:"Un număr din doi octeți ocupă două celule vecine: la adresa mai mică se află octetul inferior.",wordValue:"Numărul",wordAddr:"Adresa",regs:{h:"Registrele procesorului 8080",p:["**Registrele** sunt câteva celule de memorie din interiorul procesorului. Lucrul cu ele este cel mai rapid: nu e nevoie de acces la memoria externă. Programatorul poate folosi șapte registre de 8 biți și câteva registre speciale.","Registrele B, C, D, E, H, L pot fi grupate în **perechi** BC, DE, HL; atunci ele păstrează un număr de 16 biți, de exemplu o adresă."],list:[["A","Acumulator","registrul principal: unitatea aritmetică și logică (UAL, sumatorul și circuitele logice ale procesorului) ia din el primul operand și tot în el scrie rezultatul."],["B, C, D, E","Registre de uz general","pentru date intermediare și contoare de bucle."],["H, L","Perechea HL: pointer","de obicei păstrează adresa unei celule de memorie. În instrucțiuni, celula de la adresa HL se notează cu litera **M** (memory)."],["F","Registrul indicatorilor","semnele rezultatului ultimei operații (detalii mai jos)."],["SP","Indicator de stivă","16 biți, adresa vârfului stivei."],["PC","Contor de program","16 biți, adresa următoarei instrucțiuni."]],hidden:"În plus, în interior există registre de serviciu inaccesibile programatorului: registrul de instrucțiuni IR, registrele temporare W, Z (a nu se confunda cu indicatorul Z), TMP, tamponul acumulatorului. Le vom vedea la lucru în fila 7.",codeTitle:"Adresarea registrului: un număr în loc de nume",codeP:"În codul instrucțiunii, registrul este indicat nu printr-o literă, ci printr-un **număr de 3 biți** (câmp). Apăsați pe un registru pentru a vedea numărul lui și un exemplu de instrucțiune."},modes:{h:"Moduri de adresare: de unde se ia operandul",p:["**Modul de adresare** este regula prin care instrucțiunea indică unde se află operandul ei. 8080 are cinci. Notația între paranteze pătrate **[0081h]** se citește „conținutul celulei cu adresa 0081h”, iar **[HL]**: „conținutul celulei a cărei adresă se află în HL”.","Instrucțiunile IN și OUT iau numărul portului din al doilea octet al instrucțiunii. Acesta este un acces la un dispozitiv, nu la memorie, de aceea nu este considerat un mod de adresare separat."],items:[{name:"Imediată",ex:"MVI A, 25",bytes:[0x3e,0x19],where:"operandul se află chiar în instrucțiune (al doilea octet)",flow:["instrucțiunea: 3Eh 19h","A ← 19h"]},{name:"Prin registru",ex:"MOV A, B",bytes:[0x78],where:"operandul se află într-un registru, numărul registrului este un câmp în codul de operație",flow:["B = 11h","A ← 11h"]},{name:"Directă",ex:"LDA 0081h",bytes:[0x3a,0x81,0x00],where:"în instrucțiune este scrisă adresa celulei de memorie",flow:["adresa 0081h din instrucțiune","celula [0081h] = 11h","A ← 11h"]},{name:"Indirectă prin registru",ex:"MOV A, M",bytes:[0x7e],where:"adresa celulei se află în perechea HL: instrucțiunea e scurtă, iar adresa poate fi modificată într-o buclă",flow:["HL = 0081h","celula [0081h] = 11h","A ← 11h"]},{name:"Prin stivă",ex:"POP B",bytes:[0xc1],where:"adresa se ia din indicatorul de stivă SP și se modifică automat (detalii în secțiunea „Stiva” de mai jos)",flow:["SP = 00FEh","[00FEh] → C, [00FFh] → B","SP ← 0100h"]}],colEx:"Exemplu",colBytes:"Octeți",colWhere:"Unde e operandul",colFlow:"Ce se întâmplă"},flags:{h:"Indicatori (flaguri)",p:["După instrucțiunile aritmetice și logice, procesorul scrie în **registrul indicatorilor F** câteva semne de un bit ale rezultatului. Indicatorii singuri nu fac nimic: îi verifică **instrucțiunile de salt condiționat**: „dacă rezultatul a fost zero, sari acolo”. Așa ia programul decizii."],layout:"Poziția indicatorilor în octetul F",list:[["S","Semn (Sign)","copia bitului cel mai semnificativ al rezultatului: 1 înseamnă că rezultatul este negativ (dacă e considerat număr cu semn)."],["Z","Zero","1 dacă rezultatul este 0. Cel mai folosit indicator: așa se verifică dacă două numere sunt egale (diferența lor e zero) și dacă s-a terminat numărarea într-o buclă."],["AC","Transport auxiliar","transportul din rangul 3 în rangul 4 (între tetrade). Este necesar doar pentru aritmetica cu numere BCD (fila 1)."],["P","Paritate (Parity)","1 dacă rezultatul conține un număr par de unități. Se folosea la verificarea erorilor în transmiterea datelor."],["CY","Transport (Carry)","transportul din rangul cel mai semnificativ la adunare sau împrumutul la scădere. Arată că rezultatul nu a încăput într-un octet."]],which:"Biții 5 și 3 ai octetului F sunt mereu 0, bitul 1 este mereu 1: nu sunt folosiți. Ce instrucțiuni modifică indicatorii este arătat în îndrumar (fila 6); instrucțiunile de transfer (copiere) a datelor nu modifică indicatorii.",lab:"Verificați singuri: alegeți operația și numerele",labHint:"Procesorul execută scăderea ca A + (−B) (fila 1). AC se ia din această adunare așa cum este, iar transportul din rangul cel mai semnificativ este scris în CY **inversat**: CY = 1 înseamnă „a fost nevoie de împrumut” (A este mai mic decât B). Operațiile logice AND, OR, XOR pun întotdeauna CY la zero."},stack:{h:"Stiva",p:["**Stiva** este o zonă de memorie care funcționează după regula „ultimul intrat, primul ieșit” (LIFO), ca un teanc de farfurii: punem deasupra și luăm de deasupra.","Adresa vârfului stivei este păstrată în registrul **SP** (indicator de stivă); el indică ultimul octet scris. Stiva lui 8080 crește **în jos**, spre adrese mai mici. Instrucțiunea **PUSH** micșorează SP și scrie în stivă o pereche de registre (2 octeți: întâi cel superior, apoi cel inferior), **POP** citește 2 octeți din vârf în pereche și mărește SP. În instrucțiunile de stivă, litera B înseamnă perechea BC, D perechea DE, H perechea HL.","Instrucțiunile **PUSH PSW** și **POP PSW** salvează în stivă și restabilesc acumulatorul A împreună cu registrul indicatorilor F (PSW, „cuvântul de stare al programului”). În modelul nostru, pentru stivă sunt rezervate celulele 00E0–00FFh. Cât timp stiva e goală, SP = 0100h, cu o celulă deasupra zonei stivei, de aceea primul PUSH va scrie octeții în 00FFh și 00FEh.","Principala utilizare a stivei sunt **subprogramele**: bucăți de program apelate din locuri diferite (de exemplu, „afișează un caracter”). Instrucțiunea CALL pune în stivă **adresa de revenire** (adresa instrucțiunii aflate imediat după CALL) și sare în subprogram; instrucțiunea RET de la sfârșitul subprogramului ia această adresă din stivă și revine. La fel folosesc stiva și întreruperile (fila 5)."],lab:"Stivă interactivă",labHint:"Apăsați PUSH B: SP va scădea cu 2, iar în celulele 00FFh și 00FEh vor apărea octeții perechii BC: întâi B (superior), apoi C (inferior). Apoi apăsați POP B și urmăriți în ce ordine revin valorile.",logEmpty:"Aici vor apărea operațiile executate.",value:"Perechea BC =",push:"PUSH B",pop:"POP B",reset:"Resetare",empty:"Stiva e goală: POP ar returna „gunoi” din memorie.",top:"vârf",log:"Jurnal",pushed:(v,sp)=>`PUSH: s-a scris ${v}, SP = ${sp}`,popped:(v,sp)=>`POP: s-a citit ${v}, SP = ${sp}`}}});Object.assign(ui.ro,{// ================= Fila 5. Procesorul în sistem =================
sys:{intro:[{h:"Sistemul cu microprocesor",p:["Procesorul singur nu stochează nimic, în afară de câteva registre. Pentru a funcționa, el se conectează la **memorie** (unde se află programul și datele) și la **dispozitivele de intrare-ieșire** — tastatură, ecran, discuri. Totul împreună se numește **sistem cu microprocesor**.","Aceste părți sunt legate prin **magistrale**. O magistrală este un grup de fire prin care se transmit semnale: un fir — un bit."],terms:[["Magistrala de adrese (A0–A15)","16 fire. Procesorul pune pe ea adresa — **unde** accesează. Sens: numai de la procesor."],["Magistrala de date (D0–D7)","8 fire. Pe ea se transmite octetul însuși — **ce** se citește sau se scrie. Bidirecțională: octetul intră în procesor (citire) sau iese din procesor (scriere)."],["Magistrala de control","semnale separate — **când** și **ce să facă**: să citească sau să scrie, să acceseze memoria sau un dispozitiv, să aștepte, să cedeze magistralele."]]},{h:"Tact, ciclu mașină, ciclu de instrucțiune",terms:[["Tact","o perioadă a generatorului de tact. Toate acțiunile procesorului sunt sincronizate de tacte. Frecvența obișnuită a lui 8080 este 2 MHz — un tact durează 0,5 µs."],["Ciclu mașină","un acces la memorie sau la un dispozitiv: citirea sau scrierea unui octet. Durează 3–5 tacte (T1…T5). Ciclurile se numerotează M1, M2, …"],["Ciclu de instrucțiune","execuția unei instrucțiuni întregi: de la 1 la 5 cicluri mașină. Primul ciclu (M1) este întotdeauna extragerea codului de operație."]]}],legend:"Cum citim schema: „becurile” de pe procesor sunt semnalele lui (becul I/O nu este un pin separat, ci indicatorul „schimb cu dispozitivul” din cuvântul de stare; e arătat pentru claritate); becul verde înseamnă că semnalul este activ acum (READY e aprins cât timp memoria reușește). Linia colorată „în mișcare” este magistrala pe care are loc transferul; în chenarul alb — valoarea transmisă. Chenarul portocaliu marchează blocul care lucrează acum.",pinsTitle:"Semnalele principale ale lui 8080",pinsNote:"Toate semnalele, în afară de adrese și date, formează împreună magistrala de control. HOLD/HLDA și INT sunt desenate pe schemă ca linii separate, ca să se vadă cine le trimite. **Cuvântul de stare** este un octet pe care procesorul îl pune pe magistrala de date la începutul fiecărui ciclu mașină (la semnalul SYNC), pentru a comunica tipul ciclului: citirea instrucțiunii, citirea sau scrierea datelor, intrare-ieșire, stivă, oprire.",pins:[["A0–A15","ieșire","magistrala de adrese"],["D0–D7","intrare/ieșire","magistrala de date"],["SYNC","ieșire","începutul ciclului mașină; în acest moment procesorul transmite pe magistrala de date „cuvântul de stare” — tipul ciclului"],["DBIN","ieșire","procesorul citește: dispozitivul trebuie să pună octetul pe magistrala de date"],["WR","ieșire","procesorul scrie: octetul de pe magistrala de date trebuie memorat (pe pin e activ nivelul jos, pe schemă becul doar „se aprinde”)"],["READY / WAIT","intrare / ieșire","memoria nu reușește → READY = 0; procesorul așteaptă și anunță asta prin semnalul WAIT"],["HOLD / HLDA","intrare / ieșire","cererea altui dispozitiv de a prelua magistralele și confirmarea procesorului (acces direct la memorie)"],["INT / INTE","intrare / ieșire","cerere de întrerupere și indicatorul „întreruperi permise”. INTE nu este un indicator din registrul F, ci un bistabil intern separat; îl setează instrucțiunea EI și îl resetează instrucțiunea DI"],["RESET","intrare","resetare: PC = 0000h, procesorul începe lucrul din nou"],["Φ1, Φ2","intrare","două faze ale impulsurilor de tact de la generator"]],pinHead:["Semnal","Sens","Rol"],player:{title:"Cum lucrează procesorul cu memoria și dispozitivele",hint:"Alegeți un scenariu și parcurgeți-l pas cu pas.",prev:"◀ Înapoi",next:"Înainte ▶",auto:"▶ Auto",stop:"⏸ Stop",frame:"Pasul"},labels:{cpu:"Procesorul 8080",mem:"Memorie",io:"Dispozitive de intrare-ieșire",dma:"Controler DMA + disc",irq:"Sursă de întrerupere",abus:"Magistrala de adrese",dbus:"Magistrala de date",cbus:"Magistrala de control",mode:"Regim",off:"deconectat de la magistrale"},scenarios:[{id:"read",name:"Citire din memorie",mode:"execuția programului",frames:[{t:"Adresa pe magistrală (tactul T1)",x:"Procesorul vrea să citească locația 0081h. Pune această adresă pe magistrala de adrese și prin semnalul SYNC anunță: „încep un ciclu mașină”.",on:["cpu","abus"],sig:["SYNC"],a:0x0081,cpu:"pune adresa"},{t:"Memoria selectează locația (T1–T2)",x:"Decodorul de adrese din memorie (la fel ca în electronica digitală) selectează după cei 16 biți de adresă o singură locație din 65 536. Celelalte locații nu se conectează la magistrala de date.",on:["abus","mem","cell"],a:0x0081,cell:0x81},{t:"Semnalul de citire (T2–T3)",x:"Procesorul emite semnalul DBIN — „citesc”. Locația selectată pune conținutul ei, octetul 11h, pe magistrala de date.",on:["cbus","mem","cell","dbus"],sig:["DBIN"],a:0x0081,d:0x11,dd:"in",cell:0x81},{t:"Octet primit (sfârșitul lui T3)",x:"Procesorul memorează octetul de pe magistrala de date în registrul său și retrage semnalele. Întregul ciclu mașină de citire a durat 3 tacte; magistralele sunt libere pentru următorul acces.",on:["cpu"],cpu:"a primit 11h"}]},{id:"write",name:"Scriere în memorie",mode:"execuția programului",frames:[{t:"Adresa pe magistrală",x:"Procesorul pune pe magistrala de adrese 0082h — numărul locației în care trebuie scris rezultatul.",on:["cpu","abus"],sig:["SYNC"],a:0x0082,cpu:"pune adresa"},{t:"Datele pe magistrală",x:"Acum procesorul însuși pune octetul 2Ah pe magistrala de date — la scriere octetul iese din procesor.",on:["cpu","dbus","abus"],a:0x0082,d:0x2a,dd:"out",cpu:"trimite 2Ah"},{t:"Semnalul de scriere",x:"Semnalul WR („scrie”): memoria memorează octetul de pe magistrala de date în locația selectată. Conținutul anterior (00h) este șters.",on:["cbus","mem","cell","dbus"],sig:["WR"],a:0x0082,d:0x2a,dd:"out",cell:0x82,write:true},{t:"Gata",x:"Locația 0082h conține acum 2Ah. Procesorul retrage semnalele și trece la următorul ciclu mașină.",on:["mem","cell"],cell:0x82,write:true}]},{id:"program",name:"Execuția programului",mode:"execuția programului",frames:[{t:"Extragerea instrucțiunii",x:"Contorul de program PC = 0000h. Procesorul citește la această adresă primul octet al instrucțiunii — 3Ah (codul de operație LDA). După citire PC crește cu 1.",on:["cpu","abus","dbus","mem","cbus"],sig:["SYNC","DBIN"],a:0x0000,d:0x3a,dd:"in",pc:0x0001,cpu:"extragere"},{t:"Decodificare",x:"În interiorul procesorului decodorul analizează codul 3Ah: „LDA — încarcă în A un octet din memorie; adresa este în următorii doi octeți”. Magistralele nu sunt necesare în acest moment.",on:["cpu"],pc:0x0001,cpu:"decodifică LDA"},{t:"Citirea operandului: octetul inferior (M2)",x:"Instrucțiunea LDA are nevoie de o adresă. Procesorul citește următorul octet al instrucțiunii la adresa PC = 0001h — este 81h, octetul inferior al adresei. PC crește la 0002h.",on:["cpu","abus","dbus","mem","cbus"],sig:["SYNC","DBIN"],a:0x0001,d:0x81,dd:"in",pc:0x0002,cpu:"citește adresa (inf.)"},{t:"Citirea operandului: octetul superior (M3)",x:"Încă o citire: la adresa 0002h se află 00h — octetul superior. Acum procesorul cunoaște toată adresa 0081h. PC = 0003h.",on:["cpu","abus","dbus","mem","cbus"],sig:["SYNC","DBIN"],a:0x0002,d:0x00,dd:"in",pc:0x0003,cpu:"citește adresa (sup.)"},{t:"Execuție (M4)",x:"Al patrulea ciclu mașină accesează deja datele: adresa 0081h nu se ia din PC, ci din instrucțiune. Octetul 11h ajunge în acumulator. În total instrucțiunea LDA a durat 4 cicluri mașină (13 tacte).",on:["cpu","abus","dbus","mem","cell","cbus"],sig:["SYNC","DBIN"],a:0x0081,d:0x11,dd:"in",cell:0x81,pc:0x0003,cpu:"A ← 11h"},{t:"Instrucțiunea următoare",x:"Instrucțiunea s-a executat. PC = 0003h indică următoarea instrucțiune — ciclul „extragere → decodificare → execuție” se repetă până la întâlnirea instrucțiunii HLT.",on:["cpu"],pc:0x0003,cpu:"la instrucțiunea următoare"}]},{id:"io",name:"Schimb cu dispozitivul (OUT, IN)",mode:"execuția programului",frames:[{t:"Ieșire: numărul portului pe magistrala de adrese",x:"Instrucțiunea OUT 01h trimite un octet pe ecran. Procesorul pune pe magistrala de adrese numărul portului 01h (la 8080 el se dublează în ambele jumătăți ale adresei: 0101h). În cuvântul de stare procesorul anunță: „acesta e un schimb cu dispozitivul, nu cu memoria” — de aceea memoria nu răspunde.",on:["cpu","abus","io","cbus"],sig:["SYNC"],a:0x0101,cpu:"OUT 01h"},{t:"Ieșire: date și scriere",x:"Procesorul pune conținutul acumulatorului — codul caracterului 48h ('H') — pe magistrala de date și emite semnalul WR. Ecranul de la portul 01h preia octetul și desenează litera H.",on:["cpu","dbus","cbus","io","abus"],sig:["WR"],a:0x0101,d:0x48,dd:"out",cpu:"trimite 48h"},{t:"Intrare: citirea portului",x:"Instrucțiunea IN 00h citește tastatura. Numărul portului 00h e pe magistrala de adrese, semnalul DBIN — „citesc”. Tastatura pune pe magistrala de date codul tastei apăsate 69h ('i'), iar acesta ajunge în acumulator.",on:["cpu","abus","dbus","cbus","io"],sig:["SYNC","DBIN"],a:0x0000,d:0x69,dd:"in",cpu:"A ← 69h",noMem:true},{t:"Concluzie",x:"Dispozitivele de intrare-ieșire sunt conectate la aceleași magistrale ca memoria. Diferă doar instrucțiunile (IN/OUT în loc de instrucțiunile de lucru cu memoria) și cuvântul de stare, care spune cine trebuie să răspundă. Numerele porturilor — de la 00h la FFh.",on:["cpu","io"],cpu:"pregătit"}]},{id:"wait",name:"Așteptarea memoriei lente",mode:"așteptare (WAIT)",frames:[{t:"Memoria nu e gata",x:"Procesorul a pus adresa, dar cipul lent de memorie încă nu a găsit datele. El ține intrarea READY a procesorului în starea 0.",on:["cpu","abus","mem"],sig:["SYNC","DBIN"],ready0:true,a:0x0081,cpu:"așteaptă"},{t:"Tacte de așteptare",x:"Cât timp READY = 0, procesorul inserează în ciclul mașină **tacte de așteptare** suplimentare Tw și emite semnalul WAIT. Adresa și semnalele rămân neschimbate pe magistrale.",on:["cpu","abus","mem"],sig:["DBIN","WAIT"],ready0:true,a:0x0081,cpu:"tactul Tw"},{t:"Memoria e gata",x:"Memoria a pus octetul și a setat READY = 1. Procesorul preia datele și continuă lucrul. Așa se pot conecta dispozitive lente la un procesor rapid.",on:["cpu","dbus","mem","cell"],sig:["DBIN"],a:0x0081,d:0x11,dd:"in",cell:0x81,cpu:"a primit 11h"}]},{id:"dma",name:"Acces direct la memorie (DMA)",mode:"preluarea magistralelor (HOLD)",frames:[{t:"Cererea magistralelor",x:"Controlerul de disc trebuie să copieze rapid un bloc de date în memorie. Dacă ar face-o procesorul, fiecare octet ar trece prin el. În schimb, controlerul DMA trimite semnalul HOLD — „cedează magistralele”.",on:["dma","hold"],sig:["HOLD"],cpu:"execută programul"},{t:"Procesorul cedează magistralele",x:"Procesorul termină ciclul mașină curent și își **deconectează** ieșirile de la magistrale — le trece în a treia stare, de înaltă impedanță, ca la un element logic cu trei stări: ieșirea e parcă desprinsă de fir. Apoi răspunde cu semnalul HLDA. Execuția programului este suspendată.",on:["cpu","hold"],sig:["HOLD","HLDA"],cpuOff:true,cpu:"deconectat de la magistrale"},{t:"Transfer ocolind procesorul",x:"Acum magistralele sunt controlate de controlerul DMA: el însuși pune adresa 00A0h, octetul de pe disc și semnalul de scriere. Octeții merg de la dispozitiv direct în memorie — de aici denumirea „acces direct”.",on:["dma","abus","dbus","cbus","mem","cell"],sig:["HOLD","HLDA"],cpuOff:true,a:0x00a0,d:0x5a,dd:"dma",cell:0xa0,write:true,cpu:"deconectat de la magistrale"},{t:"Magistralele sunt returnate",x:"Blocul a fost transferat, controlerul retrage HOLD. Procesorul retrage HLDA, se reconectează la magistrale și continuă programul din locul în care s-a oprit.",on:["cpu"],cpu:"continuă programul"}]},{id:"int",name:"Întrerupere",mode:"tratarea întreruperii",intro:"De ce avem nevoie de întreruperi? Fără ele programul ar trebui să interogheze mereu tastatura: „e apăsată o tastă?” — și să piardă cu asta aproape tot timpul. Întreruperea permite dispozitivului să „cheme” singur procesorul când s-a întâmplat ceva. Subprogramul care deservește o astfel de chemare se numește **rutină de tratare a întreruperii**.",frames:[{t:"Cerere de întrerupere",x:"Procesorul execută programul (aici sistemul este unul „real”, cu memorie de 64 KB: programul principal începe de la adresa 0100h). Întreruperile sunt permise: INTE = 1 — este un bistabil intern al procesorului (nu un indicator din registrul F), setat de instrucțiunea EI („permite întreruperile”). Utilizatorul a apăsat o tastă — tastatura trimite semnalul INT: „tratează-mă urgent”.",on:["irq","int"],sig:["INT","INTE"],pc:0x0104,cpu:"execută programul"},{t:"Procesorul acceptă cererea",x:"Procesorul **termină instrucțiunea curentă** (nu o întrerupe la jumătate), vede INT = 1 și INTE = 1 și acceptă întreruperea. Bistabilul INTE se resetează automat (INTE = 0), ca o nouă întrerupere să nu încurce tratarea.",on:["cpu","int"],sig:["INT"],pc:0x0104,cpu:"acceptă întreruperea"},{t:"Instrucțiune de la dispozitiv",x:"În loc să citească următoarea instrucțiune din memorie, procesorul o citește **de pe magistrala de date, de la dispozitiv**. Tastatura pune codul CFh — instrucțiunea de un octet RST 1 („apelează subprogramul de la adresa 0008h”). Astfel dispozitivul spune imediat ce rutină e necesară: dispozitive diferite trimit instrucțiuni RST 0…7 diferite (adresele 0000h, 0008h, …, 0038h).",on:["cpu","dbus","irq"],sig:["DBIN"],d:0xcf,dd:"irq",pc:0x0104,cpu:"a primit RST 1"},{t:"Adresa de revenire — în stivă",x:"Ca la apelul unui subprogram, procesorul scrie valoarea curentă a lui PC (0104h) în stivă și încarcă în PC adresa 0008h — acolo începe **rutina de tratare a întreruperii**.",on:["cpu","abus","dbus","mem","cbus"],sig:["WR"],a:0x00fe,d:0x04,dd:"out",pc:0x0008,cpu:"PC → stivă"},{t:"Revenire",x:"Rutina citește codul tastei, permite din nou întreruperile cu instrucțiunea EI și execută RET: din stivă revine adresa 0104h. Programul principal continuă „fără să observe” pauza. Ca să nu-i strice registrele și indicatorii, rutina îi salvează la început în stivă (PUSH), iar înainte de RET îi restabilește (POP).",on:["cpu"],sig:["INTE"],pc:0x0104,cpu:"continuă programul"}]},{id:"halt",name:"Oprire (HLT)",mode:"oprire",frames:[{t:"Instrucțiunea HLT",x:"Procesorul a executat instrucțiunea HLT și s-a oprit: nu mai citește instrucțiuni, magistralele sunt inactive. PC indică instrucțiunea care urmează după HLT.",on:["cpu"],pc:0x000c,cpu:"OPRIT",halt:true},{t:"Cum se iese din oprire",x:"Se poate ieși în două moduri: prin semnalul RESET (programul începe de la capăt, de la adresa 0000h) sau printr-o întrerupere (vezi scenariul „Întrerupere”), dacă aceasta era permisă (INTE = 1). În timpul opririi procesorul poate și să cedeze magistralele la semnalul HOLD.",on:["cpu","irq","int"],sig:["INT","INTE"],pc:0x000c,cpu:"OPRIT",halt:true},{t:"Trezire prin întrerupere",x:"A venit semnalul INT — procesorul iese din oprire, execută rutina de tratare a întreruperii, apoi continuă cu instrucțiunea de după HLT. Așa procesorul „adormit” așteaptă un eveniment fără să lucreze degeaba.",on:["cpu","int"],sig:["INT"],pc:0x0008,cpu:"rutina de tratare"}]},{id:"reset",name:"Resetare (RESET)",mode:"resetare",frames:[{t:"Semnalul RESET",x:"La pornirea alimentării sau la apăsarea butonului „Reset” pe intrarea RESET se aplică 1. Procesorul întrerupe orice activitate.",on:["cpu"],sig:["RESET"],cpu:"resetare"},{t:"Starea inițială",x:"Procesorul scrie PC = 0000h, interzice întreruperile (INTE = 0) și anulează preluarea magistralelor (HLDA = 0). Conținutul celorlalte registre este nedefinit — programul trebuie să-l stabilească singur.",on:["cpu"],sig:["RESET"],pc:0x0000,cpu:"PC = 0000h"},{t:"Pornirea programului",x:"Când RESET redevine 0, procesorul începe extragerea de la adresa 0000h. De aceea la începutul spațiului de adrese se află de obicei o memorie ROM cu programul de pornire.",on:["cpu","abus","dbus","mem","cbus"],sig:["SYNC","DBIN"],a:0x0000,d:0x31,dd:"in",pc:0x0001,cpu:"extragere de la 0000h"}]}],modesTitle:"Regimurile de lucru ale procesorului — rezumat",modesHead:["Regim","Cum începe","Ce face procesorul","Cum se termină"],modes:[["Execuția programului","după resetare","ciclic: extragere → decodificare → execuție","prin instrucțiunea HLT, cererile HOLD / INT"],["Așteptare","READY = 0","inserează tacte de așteptare Tw, menține semnalele pe magistrale","READY = 1"],["Preluarea magistralelor (DMA)","HOLD = 1","se deconectează de la magistrale, emite HLDA","HOLD = 0"],["Întrerupere","INT = 1 cu INTE = 1","după instrucțiunea curentă execută instrucțiunea de la dispozitiv (de obicei RST), salvând PC în stivă","prin instrucțiunea RET în rutina de tratare"],["Oprire","instrucțiunea HLT","nu execută nimic","RESET sau întrerupere"],["Resetare","RESET = 1","PC = 0000h, INTE = 0","RESET = 0 → pornire de la 0000h"]]}});Object.assign(ui.ro,{// ================= Fila 6. Setul de instrucțiuni =================
isa:{intro:[{h:"Setul de instrucțiuni 8080",p:["Procesorul 8080 are **78 de tipuri de instrucțiuni**; ținând cont de registre și condiții diferite, sunt 244 de coduri de operație din 256 posibile (12 coduri nu sunt folosite). Nu trebuie să le învățați pe toate: după comportament ele se împart în cinci grupe, iar în interiorul unei grupe sunt construite asemănător.","Cu steluța ★ sunt marcate instrucțiunile pe care le poate executa simulatorul din fila 7. Sunt cele mai folosite instrucțiuni — pe ele se bazează toate exemplele cursului."]}],legend:[["Notații","r — registrul A, B, C, D, E, H, L sau M (celula de la adresa HL); rp — perechea BC, DE, HL sau SP; d8 / d16 — constantă de 1 / 2 octeți; a16 — adresă de 16 biți; port — numărul portului; cc — condiție (NZ, Z, NC, C, PO, PE, P, M); n — numărul 0…7 din instrucțiunea RST"],["Format","forma binară a codului de operație: 0/1 — biți ficși; DDD — destinație, SSS — sursă, RP — pereche, CCC — condiție, NNN — numărul RST (vezi fila 3); R — un bit al perechii în LDAX/STAX: 0 = BC, 1 = DE. ★ parț. — dintre instrucțiunile Jcc simulatorul execută doar JZ, JNZ, JC, JNC"],["Octeți","lungimea instrucțiunii"],["Tacte","câte tacte durează execuția (la 2 MHz un tact = 0,5 µs). Fiecare acces la memorie este încă un ciclu mașină (circa 3 tacte), de aceea ADD B durează 4 tacte, iar ADD M — 7; LDA — 13 (codul, doi octeți de adresă și octetul de date propriu-zis). La instrucțiunile condiționale — „neîndeplinită / îndeplinită”"],["Indicatori","ce indicatori modifică instrucțiunea; „—” — nu modifică; CY=0 — îl resetează mereu; (PSW: *) — POP PSW restabilește toți indicatorii din stivă"]],tableHint:"Apăsați pe un rând — în dreapta va apărea analiza instrucțiunii și exemplele gata făcute (fila 8) în care apare.",groups:{move:{name:"Transfer de date",d:"Copiază octeți între registre, memorie și constante. Nu modifică indicatorii. Sunt cele mai frecvente instrucțiuni din orice program.",fmt:"Registrele sunt date prin câmpurile de 3 biți DDD/SSS, perechile — prin câmpul de 2 biți RP."},arith:{name:"Aritmetică",d:"Adunare, scădere, incrementare și decrementare cu 1. Rezultatul operațiilor pe 8 biți ajunge în acumulatorul A; modifică indicatorii.",fmt:"10 ooo SSS (al doilea operand este un registru sau M) sau 11 ooo 110 + octet (constantă); ooo — numărul operației: 000 ADD, 001 ADC, 010 SUB, 011 SBB."},logic:{name:"Logice și comparare",d:"ȘI, SAU, SAU exclusiv pe biți, comparare, deplasări ale acumulatorului. Compararea CMP/CPI scade fără a păstra rezultatul — doar pentru a seta indicatorii.",fmt:"Aceeași structură ca la aritmetică: 10 ooo SSS sau 11 ooo 110 + octet, unde ooo este numărul operației (ȘI, SAU exclusiv, SAU, comparare)."},branch:{name:"Salturi și subprograme",d:"Schimbă ordinea execuției: salturi necondiționate și condiționate, apelul subprogramelor și revenirea. Condiția verifică unul dintre indicatori.",fmt:"Condiția este dată de câmpul de 3 biți CCC; adresa — de următorii doi octeți (cel inferior primul)."},ctrl:{name:"Stivă, intrare-ieșire, control",d:"Lucrul cu stiva, schimbul de date cu dispozitivele prin porturi, controlul întreruperilor și oprirea.",fmt:"În instrucțiunile PUSH/POP, în locul perechii SP se folosește PSW — acumulatorul împreună cu indicatorii."}},filterAll:"Toate instrucțiunile",filterSim:"Doar ★ (există în simulator)",head:["","Instrucțiune","Format","Octeți","Tacte","Indicatori","Acțiune"],simPart:"★ parțial: în simulator există JZ, JNZ, JC, JNC",starPart:"parț.",detail:{title:"Detalii despre instrucțiune",pick:"Alegeți o instrucțiune din tabel.",example:"Exemplu",bytes:"Codul mașină al exemplului",usedIn:"Apare în exemplele gata făcute",open:"Deschide în simulator",notSim:"Această instrucțiune nu face parte din setul simulatorului — o puteți studia doar din referință."},desc:{MOV_rr:"r1 ← r2: copiază registrul-sursă r2 în registrul-destinație r1",MOV_rm:"încarcă în registrul r octetul din memorie de la adresa din HL",MOV_mr:"scrie registrul r în memorie la adresa din HL",MVI_r:"încarcă în registru o constantă (al doilea octet al instrucțiunii)",MVI_m:"scrie o constantă în memorie la adresa din HL",LXI:"încarcă o constantă de 16 biți într-o pereche de registre",LDA:"încarcă în A octetul din memorie de la o adresă",STA:"scrie A în memorie la o adresă",LHLD:"încarcă în HL doi octeți din memorie (L ← [a], H ← [a+1])",SHLD:"scrie HL în memorie (doi octeți)",LDAX:"încarcă în A octetul din memorie de la adresa din perechea BC sau DE",STAX:"scrie A în memorie la adresa din perechea BC sau DE",XCHG:"schimbă între ele conținutul perechilor HL și DE",ADD:"A ← A + r",ADC:"A ← A + r + CY (adunare cu transport — pentru numere pe mai mulți octeți)",ADI:"A ← A + constantă",ACI:"A ← A + constantă + CY",SUB:"A ← A − r",SBB:"A ← A − r − CY (scădere cu împrumut)",SUI:"A ← A − constantă",SBI:"A ← A − constantă − CY",INR:"r ← r + 1 (indicatorul CY nu se modifică)",DCR:"r ← r − 1 (indicatorul CY nu se modifică)",INX:"pereche ← pereche + 1 (16 biți, indicatorii nu se modifică)",DCX:"pereche ← pereche − 1",DAD:"HL ← HL + pereche (adunare pe 16 biți)",DAA:"corecție zecimală a lui A după adunarea numerelor BCD",ANA:"A ← A AND r (ȘI pe biți)",XRA:"A ← A XOR r (SAU exclusiv); XRA A — o cale rapidă de a pune A pe zero",ORA:"A ← A OR r (SAU pe biți)",CMP:"compară A cu r: calculează A − r doar pentru indicatori (Z=1 — egale, CY=1 — A este mai mic)",ANI:"A ← A AND constantă (mască: resetează biții doriți)",XRI:"A ← A XOR constantă (inversează biții doriți)",ORI:"A ← A OR constantă (setează biții doriți)",CPI:"compară A cu o constantă",RLC:"rotire ciclică a lui A la stânga; bitul superior → CY și în bitul inferior",RRC:"rotire ciclică a lui A la dreapta",RAL:"rotire a lui A la stânga prin transportul CY",RAR:"rotire a lui A la dreapta prin transportul CY",CMA:"inversează toți biții lui A",CMC:"inversează indicatorul CY",STC:"setează CY = 1",JMP:"salt la adresă: PC ← adresă",Jcc:"salt dacă este îndeplinită condiția (JNZ, JZ, JNC, JC, JPO, JPE, JP, JM)",CALL:"apel de subprogram: adresa de revenire → stivă, PC ← adresă",Ccc:"apel de subprogram condiționat (CNZ, CZ, CNC, CC, …)",RET:"revenire din subprogram: PC ← adresa din stivă",Rcc:"revenire condiționată (RNZ, RZ, …)",RST:"apel scurt de subprogram la adresa 8·n (așa apelează dispozitivele rutinele de tratare a întreruperilor → fila 5)",PCHL:"salt la adresa din HL",PUSH:"scrie perechea în stivă: SP ← SP − 2",POP:"extrage perechea din stivă: SP ← SP + 2",XTHL:"schimbă HL cu cei doi octeți din vârful stivei",SPHL:"SP ← HL",IN:"citește un octet din portul dispozitivului în A (→ fila 5)",OUT:"trimite A în portul dispozitivului (→ fila 5)",EI:"permite întreruperile: INTE = 1 (→ fila 5)",DI:"interzice întreruperile: INTE = 0",HLT:"oprește procesorul (după șablonul MOV acest cod ar fi MOV M, M — o instrucțiune fără sens, de aceea a fost dat lui HLT)",NOP:"nu face nimic (1 instrucțiune = o întârziere de 4 tacte)"}},// ================= Fila 7. Arhitectura =================
arch:{intro:[{h:"În interiorul procesorului",p:["În fila 5 procesorul era o „cutie neagră”. Acum să privim înăuntru. Schema de mai jos reproduce schema bloc a lui Intel 8080 din documentație. Toate blocurile sunt legate prin **magistrala internă de date** (8 biți); cu exteriorul procesorul comunică prin **bufferul magistralei de date** și **bufferul de adrese**.","**Cum începem:** alegeți un program din lista de mai jos și apăsați **„Pas ▶”**, citind după fiecare apăsare panoul **„Ce se întâmplă acum”** de sub schemă. Un pas este o **etapă** a execuției instrucțiunii: de obicei un tact sau o acțiune în interiorul procesorului. Butonul **„Instrucțiune ⏩”** execută dintr-odată toate etapele instrucțiunii curente, **„◀ Pas”** revine cu o etapă înapoi, **„▶ Auto”** execută programul singur, cu viteza aleasă — pe etape sau direct pe instrucțiuni.","**Culorile pe schemă:** fundal galben — blocul care lucrează în această etapă; linia colorată „în mișcare” — drumul octetului (portocalie — magistrala de adrese, albastră — magistrala de date, violetă — semnalele de control, turcoaz — transfer în interiorul procesorului); **numărul roșu** — o valoare care tocmai s-a schimbat."]}],blocksTitle:"Referință: ce sunt aceste blocuri? (deschideți; un clic pe card încadrează blocul pe schemă cu albastru)",phaseHint:"Banda de mai jos arată etapele instrucțiunii curente. M — ciclu mașină (un acces la memorie sau la un dispozitiv), T — tact. Primul ciclu M1 începe întotdeauna cu extragerea codului de operație (T1–T3) și decodificarea (T4); la o instrucțiune scurtă ca MOV B, A el durează 4–5 tacte și alte cicluri nu există. O instrucțiune cu operanzi în memorie adaugă cicluri: LDA are M2 și M3 pentru cei doi octeți de adresă și M4 pentru octetul de date propriu-zis. Uneori într-un tact au loc două acțiuni (de exemplu, în T4 — decodificarea și primul transfer) — atunci tactul se repetă în bandă.",irStale:"Atenție: în etapele T1–T2 registrul IR păstrează încă codul instrucțiunii anterioare — noul cod intră în IR în tactul T3, iar decodificatorul îl analizează în T4.",busLegend:"SYNC — începutul ciclului mașină; MEMR — citire din memorie; MEMW — scriere în memorie; I/O RD, I/O WR — citire și scriere la dispozitiv; HLTA — confirmarea opririi. MEMR, MEMW, I/O RD, I/O WR sunt semnale ale magistralei de control a sistemului: le formează un circuit extern din DBIN / WR și cuvântul de stare (fila 5); 8080 nu are pini proprii cu aceste nume.",labelsNote:"NUM1, NUM2, SUM și alte nume cu două puncte sunt etichete (nume de adrese). ORG și DB sunt indicații pentru asamblor, nu instrucțiuni ale procesorului. Detalii — în fila 8.",btnHint:"Pas — o etapă · Instrucțiune — până la sfârșitul instrucțiunii curente · Auto — continuu · Scară — mărimea schemei",kbdHint:"(folosit de instrucțiunea IN 00h — exemplul 12; apăsați Enter)",blocks:[["acc","Acumulatorul A","registrul principal: primul operand și rezultatul UAL"],["act","Bufferul acumulatorului ACT","o copie a lui A pe durata calculului. UAL citește primul număr din ACT, iar rezultatul îl scrie în A: fără copie, intrarea UAL s-ar schimba chiar în timpul calculului"],["tmp","Registrul temporar TMP","al doilea operand al UAL și copie intermediară la transferuri"],["alu","UAL","unitatea aritmetică și logică: sumator și circuite logice"],["flags","Indicatori","bistabilii care rețin proprietățile rezultatului S Z AC P CY"],["ir","Registrul de instrucțiuni IR","păstrează codul de operație al instrucțiunii executate"],["dec","Decodificatorul de instrucțiuni","după codul de operație stabilește ce acțiuni și cicluri mașină sunt necesare"],["tc","Unitatea de comandă","emite semnalele de control în tactele potrivite: SYNC, DBIN, WR…"],["mux","Multiplexor","conectează la magistrala internă registrul necesar din blocul de registre"],["rB","B, C, D, E, H, L","registre de uz general, accesibile programului"],["rW","W, Z","registre invizibile pentru programator: în ele procesorul asamblează adresa de 16 biți din octeții instrucțiunii (la LDA 0080h: Z = 80h, W = 00h). A nu se confunda cu indicatorul Z"],["rPC","PC, SP","contorul de program și indicatorul de stivă"],["incLatch","Incrementare/decrementare și latch de adresă","adună sau scade 1 din valori de 16 biți (PC, SP, perechi). Latch-ul ține adresa curentă pe magistrala de adrese, în timp ce PC a fost deja mărit la următoarea"],["abuf","Bufferul de adrese","pune adresa de 16 biți pe magistrala externă de adrese"],["dbb","Bufferul magistralei de date","leagă magistrala internă de magistrala externă de date"],["daa","Corecție zecimală","corectează rezultatul la aritmetica cu numere BCD (instrucțiunea DAA); nu se folosește în exemplele noastre"]]},// ================= Fila 8. Editor =================
editor:{intro:[{h:"Scriem singuri un program",p:["Un program în limbaj de asamblare este un text în care **un rând = o instrucțiune**. Asamblorul transformă rândurile în octeți și îi așază în memorie, începând de la adresa 0000h. După aceea programul poate fi executat în fila 7.","Începeți cu un exemplu gata făcut: deschideți-l, citiți comentariile, executați-l pas cu pas. Apoi schimbați numerele sau instrucțiunile (după referința din fila 6) și urmăriți ce se schimbă."]}],syntaxTitle:"Reguli de scriere",syntax:["`ETICHETĂ:  INSTRUCȚIUNE  operanzi   ; comentariu` — eticheta și comentariul sunt opționale.","**Eticheta** — numele unei adrese. În loc de `JMP 0004h` se poate scrie `JMP LOOP`, iar asamblorul va pune singur adresa rândului cu eticheta `LOOP:`.","**Numere**: 25 (zecimal), 19h sau 0F0h (hexazecimal; începe cu o cifră), 1010b (binar), 'A' (codul caracterului).","**ORG** și **DB** nu sunt instrucțiuni ale procesorului, ci **directive**: indicații pentru asamblorul însuși. Ele nu au cod mașină. `ORG adresă` — de la ce adresă se plasează rândurile următoare (în exemple datele încep cu `ORG 0080h`). `DB` — scrie în memorie octeți de date: `DB 25, 17`, `DB 'HELLO', 0`.","**Memoria simulatorului — 256 de octeți**: programul — în 0000–007Fh, datele — de la 0080h, stiva crește în jos de la 0100h (celulele 00E0–00FFh).","Tot ce urmează după punct și virgulă `;` este comentariu, procesorul nu îl vede."],supported:"Instrucțiuni pe care le înțelege simulatorul",templates:"Exemple gata făcute",open:"Deschide în editor",run:"Execută în fila 7",commands:"Instrucțiuni",title:"Editor",assemble:"Asamblează",assembleRun:"Asamblează și execută →",errors:"Erori",ok:"Nicio eroare — programul a fost încărcat în memorie.",line:"Rândul",listing:"Rezultatul asamblării",kbdNote:"Pentru instrucțiunea IN 00h introduceți textul „tastelor apăsate” în fila 7 — în câmpul „Tastatură” de sub schemă.",openNote:"„Deschide în editor” înlocuiește textul din editor cu exemplul. „Execută” încarcă exemplul și trece imediat în fila 7.",tryLabel:"Încercați:",presetInfo:{copy:["Constante și copiere","Prima cunoștință: o constantă se încarcă într-un registru și se copiază între registre. Observați că o copie nu „mută” datele."],add:["Adunarea a două numere","Schema clasică a unui program: ia datele din memorie, prelucrează-le, pune rezultatul înapoi în memorie.","înlocuiți 25 cu 250. Ce sumă s-a obținut și ce s-a întâmplat cu indicatorul CY?"],sub:["Scădere și indicatori","5 − 7 dă FEh: acesta este −2 în cod complementar. Urmăriți indicatorii CY, S și Z.","scădeți 5 din 7 — cum se schimbă indicatorii?"],char:["Afișarea unui caracter","Cum devine un octet literă pe ecran: instrucțiunea OUT trimite codul caracterului în portul 01h.","afișați-vă numele cu litere latine (MVI A, '…' și OUT 01h pentru fiecare literă)."],hl:["Pointerul HL","Adresare indirectă: adresa celulei se păstrează în perechea HL și poate fi schimbată cu instrucțiunea INX."],loop:["Buclă cu contor","Instrucțiunea DCR micșorează contorul și setează indicatorul Z când acesta ajunge la zero; JNZ repetă bucla.","calculați suma 1…10. Câte instrucțiuni va executa procesorul?"],mult:["Înmulțire prin adunare","8080 nu are instrucțiune de înmulțire — înmulțim prin adunări repetate.","înmulțiți 20 cu 15. De ce rezultatul este greșit? (indiciu: 300 > 255)"],string:["Afișarea unui șir","Buclă pe un șir până la octetul 00h: pointer, comparare, salt condiționat.","ștergeți 0 de la sfârșitul șirului. Ce va afișa programul și de ce?"],upper:["Minuscule → majuscule","ȘI logic cu masca 0DFh resetează bitul 5 — diferența dintre o literă mică și una mare."],stack:["Stiva PUSH / POP","Perechea BC se salvează în stivă, se „strică” și se restabilește în DE. Urmăriți SP și celulele 00FEh–00FFh.","salvați două perechi una după alta și extrageți-le — în ce ordine revin?"],call:["Subprogram CALL / RET","Un subprogram este apelat de două ori; adresa de revenire se salvează de fiecare dată în stivă."],echo:["Tastatură → ecran","Intrare-ieșire prin porturi: IN citește codul tastei (portul 00h), OUT îl afișează pe ecran (portul 01h)."],carry:["Depășire și CY","Suma nu încape într-un octet — procesorul semnalează asta prin indicatorul CY, iar programul reacționează cu saltul JC."],data:["Date sau instrucțiune?","Un program fără HLT: procesorul „execută” datele. Un octet devine instrucțiune dacă PC ajunge la el."]}},// ================= Fila 9. 8086 =================
emu:{intro:[{h:"De la 8080 la 8086",p:["Procesorul **8086** (1978) este succesorul pe 16 biți al lui 8080. Intel l-a conceput astfel încât programele pentru 8080 să poată fi rescrise aproape mecanic: registrele lui 8080 au devenit jumătăți de 8 biți ale registrelor lui 8086; aritmetica, comparațiile, salturile, subprogramele și stiva (ADD, SUB, CMP, JMP, JZ, CALL, RET, PUSH, POP, IN, OUT, HLT) și-au păstrat numele și sensul, iar toate instrucțiunile de transfer s-au unit într-una singură — MOV. Instrucțiunile IN și OUT există și la 8086, dar în EMU8086 tastatura și ecranul nu sunt conectate la porturile noastre didactice 00h și 01h, de aceea caracterele se citesc și se afișează prin DOS (vezi mai jos).","Dar **codurile mașină ale lui 8086 sunt cu totul altele**: un program pentru 8080 nu poate fi rulat pe 8086 așa cum este — trebuie rescris în limbajul de asamblare 8086. În schimb, tot ce ați studiat în acest curs — octeți, coduri, registre, indicatori, stivă, extragerea și execuția instrucțiunilor — funcționează la fel în 8086. De aceea puteți trece cu încredere la emulatorul **EMU8086**.","Registrele lui 8086 sunt de 16 biți și fiecare se împarte în două jumătăți: **AX = AH:AL**, unde H este jumătatea superioară (high), L — cea inferioară (low). De aceea perechea BC devine CX, iar părțile ei: B → CH (octetul superior), C → CL (octetul inferior). Literele perechilor nu coincid intenționat: la 8086 CX este contorul de bucle, ca odinioară perechea BC, iar BX este pointerul spre memorie, ca perechea HL. Celelalte registre și indicatori din tabelul de mai jos, pe care 8080 nu le are (segmente, BP, SI, DI, OF, DF, IF, TF), le veți studia deja în EMU8086."]}],compareTitle:"Compararea procesoarelor",compareHead:["","8080","8086"],compare:[["Anul lansării","1974","1978"],["Lățimea datelor","8 biți","16 biți"],["Magistrala de adrese","16 linii → 64 KB","20 de linii → 1 MB (memoria se împarte în segmente de 64 KB)"],["Registre de uz general","A, B, C, D, E, H, L (8 biți)","AX, BX, CX, DX (16 biți = două jumătăți: AH/AL…)"],["Pointeri","SP, PC, HL","SP, BP, SI, DI, IP + registrele de segment CS, DS, SS, ES"],["Înmulțire și împărțire","nu, prin program","da: MUL, IMUL, DIV, IDIV"],["Indicatori","S Z AC P CY","SF ZF AF PF CF + OF, DF, IF, TF"],["Frecvența de tact","2 MHz","5–10 MHz"]],regTitle:"Corespondența registrelor",regs:[["A","AL"],["B, C","CH, CL (perechea BC → CX)"],["D, E","DH, DL (perechea DE → DX)"],["H, L","BH, BL (perechea HL → BX)"],["PC","IP"],["SP","SP"],["Indicatori S Z AC P CY","SF ZF AF PF CF"]],cmdTitle:"Corespondența instrucțiunilor",head:["8080","8086 (EMU8086)","Sens"],cmds:[["MVI A, 5","MOV AL, 5","constantă → registru"],["MOV B, A","MOV CH, AL","registru → registru"],["LDA NUM1","MOV AL, [NUM1]","memorie → registru"],["STA SUM","MOV [SUM], AL","registru → memorie"],["LXI H, MSG","MOV BX, OFFSET MSG","adresă → pointer (OFFSET — „adresa etichetei”)"],["MOV A, M","MOV AL, [BX]","memorie prin pointer"],["ADD B","ADD AL, CH","adunare"],["SUI 7","SUB AL, 7","scăderea unei constante"],["CPI 0","CMP AL, 0","comparare"],["ANI 0DFh","AND AL, 0DFh","ȘI logic"],["INR A / DCR B","INC AL / DEC CH","±1"],["INX H","INC BX","celula următoare"],["JMP / JZ / JNZ / JC","JMP / JZ / JNZ / JC","salturi"],["CALL / RET","CALL / RET","subprograme"],["PUSH B / POP B","PUSH CX / POP CX","stivă (la 8086 — registre de 16 biți)"],["OUT 01h","MOV DL, AL\nMOV AH, 2\nINT 21h","afișarea unui caracter pe ecran prin DOS"],["IN 00h","MOV AH, 1\nINT 21h","citirea unui caracter de la tastatură prin DOS (codul — în AL)"],["HLT","HLT (sau RET / INT 20h)","încheiere"]],exTitle:"Un program — două procesoare",exNote:"În EMU8086 un program simplu (format .COM) începe cu directiva ORG 100h și se încheie cu instrucțiunea RET. Datele se plasează după cod; etichetele de date se scriu fără două puncte, etichetele instrucțiunilor — cu două puncte.",dosTitle:"Ce este INT 21h",dos:"Pe calculatoarele cu 8086 rula sistemul de operare DOS. Acesta are subprograme gata făcute pentru intrare-ieșire; ele se apelează cu instrucțiunea INT 21h — o întrerupere software: o instrucțiune asemănătoare cu RST, care apelează un subprogram după număr (a nu se confunda cu semnalul INT din fila 5). Numărul funcției dorite se pune în registrul AH: 1 — citește un caracter de la tastatură (codul ajunge în AL), 2 — afișează pe ecran caracterul din DL. DOS încarcă un program simplu .COM de la adresa 100h (primii 256 de octeți îi ocupă el însuși) și îl apelează ca pe un subprogram, de aceea RET de la sfârșit returnează controlul lui DOS.",runTitle:"Cum rulăm exemplul în EMU8086",run:["Deschideți EMU8086 și creați un fișier nou (șablonul COM).","Copiați acolo codul din dreapta.","Apăsați „emulate”, apoi „single step” — executați programul câte o instrucțiune, ca în fila 7.","În fereastra emulatorului deschideți variabilele cu butonul „vars”: după execuție sum = 42."],ex8080:`; 8080: adunarea a două numere
      LDA  NUM1
      MOV  B, A
      LDA  NUM2
      ADD  B
      STA  SUM
      HLT
      ORG  0080h
NUM1:   DB   25
NUM2:   DB   17
SUM:    DB   0`,ex8086:`; 8086 (EMU8086): același lucru
org 100h
      mov  al, [num1]
      mov  ch, al
      mov  al, [num2]
      add  al, ch
      mov  [sum], al
      ret
num1    db   25
num2    db   17
sum     db   0`}});Object.assign(ui.ro,{// ================= Fila 1. Numere și date =================
numbers:{startH:"De unde începe totul",startP:["O poartă logică distinge doar două stări: **0** (nivel jos) și **1** (nivel înalt). Un bistabil păstrează o astfel de valoare, iar mai mulți bistabili formează un **registru**. Procesorul este un circuit digital mare, iar tot ce prelucrează (numere, litere, instrucțiuni) se păstrează ca seturi de zerouri și unu."],anatomyTitle:"Din ce este format un număr binar",anatomyHint:"Apăsați pe un termen — va fi evidențiat pe schemă. Apăsați pe biți pentru a schimba numărul.",terms:[["bit","Bit","o cifră binară: 0 sau 1. Atât păstrează un bistabil."],["pos","Rang","poziția bitului. Numerotarea — de la dreapta la stânga, de la 0; fiecare rang are ponderea sa."],["msb","Rangul superior / inferior","cel mai din stânga (MSB, cea mai mare pondere) și cel mai din dreapta (LSB, pondere 1)."],["nib","Tetradă","4 biți = o cifră hexazecimală."],["byte","Octet","8 biți — unitatea de bază a datelor la 8080: el păstrează și transmite totul în porții de câte 8 biți."],["word","Cuvânt","la 8080 — 16 biți = 2 octeți."],["width","Număr de biți","câți biți sunt alocați unui număr. De el depinde ce numere încap."]],weight:"pondere",sysH:"Sisteme de numerație",sysP:["Într-un sistem **pozițional** valoarea unei cifre depinde de locul ei: fiecare rang „cântărește” de **baza** ori mai mult decât vecinul din dreapta. Sistemul zecimal are baza 10, cel binar — 2, cel hexazecimal (hex) — 16 (cifrele 0…9, A…F)."],sysNote:"Notații: 1011b — binar, B6h — hexazecimal (dacă începe cu o literă, în programe se scrie 0B6h), 182 — zecimal. Uneori apare și 0xB6.",tableTitle:"Aceleași numere în sisteme diferite",tableHint:"Apăsați pe un rând — numărul ajunge în convertorul din dreapta.",baseNames:{2:"binar",3:"ternar",4:"cuaternar",8:"octal",10:"zecimal",16:"hexazecimal"},conv:{title:"Convertor: un număr în toate sistemele",hint:"Introduceți un număr (200, −5, 0C8h, 11001000b), mișcați cursorul sau apăsați pe biți.",width:"Număr de biți",bitsWord:"biți",signed:"cu semn (cod complementar — vezi mai jos)"},posTitle:"Cum funcționează scrierea pozițională",posHint:"Alegeți baza și apăsați pe cifre (fiecare apăsare +1). Jos se vede cum se formează numărul din cifre și ponderi.",base:"Baza",digitClick:"cifra",reset:"Resetare",posNote:b=>`Ponderea fiecărui rang este de ${b} ori mai mare decât a vecinului din dreapta. Sistemul are exact ${b} cifre: de la 0 la ${b===16?"F (15)":b-1}.`,xTitle:"Conversia dintr-un sistem în altul",xHint:"În stânga — numărul inițial, în centru — scrierea lui binară, în dreapta — rezultatul. Culorile arată ce biți au devenit ce cifră.",from:"Din sistemul",to:"În sistemul",number:"Număr",bad:"Numărul conține cifre care nu există în acest sistem.",bitsPer:"biți pe o cifră",viaGroups:(b,k)=>`Baza ${b} = 2${sup(k)}: fiecare cifră are exact ${k} ${k===1?"bit":"biți"}. Convertim pe grupe.`,viaSum:b=>`Baza ${b} nu este o putere a lui doi, deci nu există grupe de biți. Mai întâi calculăm numărul (suma cifră × pondere), apoi îl împărțim la noua bază.`,viaDiv:b=>`Împărțim la ${b}, resturile le citim de jos în sus:`,divHead:["Deîmpărțit","cât","rest"],bitsTable:"Câți biți sunt necesari pentru o cifră",bitsTableNote:"Pentru 3 și 10 numărul de biți nu este întreg — de aceea cifrele lor nu pot fi „tăiate” din scrierea binară, iar cele hex și octale — da.",fmtTitle:"Formate de numere: ce încape în n biți",fmtHint:"Aceiași biți pot fi folosiți pentru formate diferite. Alegeți numărul de biți și comparați domeniul și precizia. Aceasta este o privire de ansamblu: fiecare format este explicat detaliat mai jos, în această filă.",fmtHead:["Format","Cum este construit","Minim","Maxim","Precizie (pas)"],fmtRows:{u:"Întreg fără semn",s:"Întreg cu semn",x:"Virgulă fixă",f:"Virgulă mobilă"},fmtHow:{u:"toți biții sunt ponderi ale numărului",s:"bitul superior este semnul (cod complementar)",x:(i,f)=>`${i} ${i===1?"bit":"biți"} de parte întreagă + ${f} ${f===1?"bit":"biți"} de fracție, cu semn`,f:(e,m)=>`1 bit de semn + ${e} biți de exponent + ${m} ${m>=20?"de ":""}biți de mantisă`},fmtStep1:"1",fmtRel:d=>`≈ ${d} cifre zecimale semnificative`,fmtNote:"Cu cât domeniul este mai mare, cu atât precizia este mai mică: virgula mobilă are un domeniu uriaș, dar păstrează doar câteva cifre semnificative. Hardware, 8080 lucrează doar cu numere întregi pe 8 biți (și parțial pe 16 biți) — celelalte formate sunt prelucrate de programe.",uH:"Numere întregi fără semn",uP:["Toți biții sunt ponderi ale numărului. În n biți încap numere de la 0 la 2ⁿ − 1. Dacă adunăm 1 la cel mai mare număr, „iese” un transport, iar rezultatul începe de la zero — ca la un contor mecanic de kilometraj. Procesorul reține bitul ieșit în indicatorul de transport **CY**."],wheelTitle:"Inelul numerelor (4 biți)",wheelHint:"Rotiți inelul cu butoanele ±1. În exterior — valori fără semn, în interior — cu semn. Trecerea 15 → 0 este un transport (CY), trecerea 7 → −8 — o depășire cu semn.",wheelCarry:"transport! CY = 1",wheelOvf:"depășire cu semn",sH:"Numere negative",sP:["Biții nu au semnul minus, de aceea și semnul se codifică printr-un bit — cel **superior**. Există trei metode; procesoarele, inclusiv 8080, folosesc **codul complementar**: cu el adunarea și scăderea se fac de același circuit sumator ca pentru numerele fără semn, iar zero are o singură reprezentare. Un mod simplu de a citi codul complementar: bitul superior nu valorează +128, ci **−128** (−32768 pe 16 biți), ceilalți biți — ca de obicei."],sLabTitle:"Introduceți un număr — și vedeți codurile lui",sLabHint:"Puteți introduce numere pozitive și negative. Bitul roșu este bitul de semn.",codeNames:{direct:"Cod direct",ones:"Cod invers",twos:"Cod complementar"},codeHow:{direct:"semn + modul",ones:"la negative — inversarea tuturor biților modulului",twos:"cod invers + 1 (folosit de 8080)"},posNum:"pozitiv",negNum:"negativ",outOfRange:"nu încape",howTwos:"Cum se obține codul complementar al unui număr negativ",howSteps:["modulul numărului","inversăm toți biții","adunăm 1"],rangeTitle:"Domeniile numerelor întregi",rangeHead:["Număr de biți","Fără semn","Cu semn (cod complementar)"],fxH:"Numere fracționare: virgulă fixă",fxP:["Programatorul stabilește unde se află virgula binară. Biții din dreapta ei au ponderile 1/2, 1/4, 1/8… Virgula însăși nu se păstrează nicăieri — doar în logica programului. Cu cât virgula este mai la dreapta, cu atât domeniul este mai mare și precizia mai mică — și invers."],fxTableTitle:"Unde punem virgula",fxTableHint:"Alegeți numărul de biți; apăsați pe un rând pentru a-l vedea în laboratorul de mai jos.",fxHead:["Biți de fracție","Scriere","Fără semn: min … max","Cu semn: min … max","Pas (precizie)"],fxLab:"Laboratorul virgulei fixe",fxPoint:"Poziția virgulei (biți de fracție)",fxAsU:"ca fracție fără semn",fxAsS:"ca fracție cu semn",fxSignNote:w=>`La citirea cu semn bitul superior are ponderea −${w}, nu +${w} — de aceea cele două rezultate diferă când el este 1.`,flH:"Numere fracționare: virgulă mobilă",flP:["Numărul se păstrează ca **semn**, **exponent** (putere a lui doi) și **mantisă** (cifrele semnificative) — analogul binar al scrierii 2,5 = 1,25·2¹. Astfel, în aceiași biți încap atât numere foarte mari, cât și foarte mici, dar doar cu un număr limitat de cifre semnificative."],flTableTitle:"Formate răspândite",flHead:["Format","Biți: semn + exponent + mantisă","Deplasarea exponentului","Maxim","Min. normalizat","Precizie"],flNames:{8:"float8 (didactic, după regulile IEEE)",16:"float16 (half)",32:"float32 (float, single)",64:"float64 (double)"},flLab:"Laboratorul virgulei mobile",flInput:"Număr zecimal",flStored:"Se păstrează exact",flErr:"Eroare de rotunjire",flFormula:"valoare = (−1)^semn · 1,mantisă · 2^(exponent − deplasare)",flNotes:bias=>[`**Deplasarea exponentului.** Exponentul se păstrează deplasat cu +${bias}, ca să nu fie nevoie de un bit de semn: numărul păstrat ${bias} înseamnă puterea 0, cele mai mici — puteri negative.`,"**Unitatea ascunsă.** La un număr normalizat mantisa începe mereu cu „1,”, de aceea acest 1 nu se păstrează — este subînțeles. Așa se economisește un bit.","**Min. normalizat** este cel mai mic număr pozitiv care mai are unitatea ascunsă. Numerele mai mici se păstrează fără ea (denormalizate) și cu precizie mai mică."],flSpecial:{inf:"infinit (exponentul — numai unu)",nan:"nu este număr (NaN)",sub:"denormalizat (exponent = 0: fără unitatea ascunsă)",zero:"zero"},sign:"semn",exp:"exponent",mant:"mantisă",bytesMem:"Octeții în memorie (inferiorul primul)",interp:{h:"Se poate înțelege din cod ce fel de date sunt?",p:["Luăm un octet și îl citim cu „ochi” diferiți."],labTitle:"Un octet — șase citiri",labHint:"Mișcați cursorul sau apăsați pe biți.",rows:{unsigned:"Întreg fără semn",signed:"Întreg cu semn",fixed:"Virgulă fixă (4 biți de fracție)",bcd:"BCD: fiecare tetradă este o cifră zecimală",char:"Caracter ASCII (fila 2)",cmd:"Instrucțiune a procesorului 8080 (fila 3)"},bcdBad:"invalid: tetradă mai mare decât 9",noChar:"de control, nu se afișează",answerH:"Răspuns: nu.",answer:"Octetul nu are nicio etichetă „sunt număr” sau „sunt literă”. **Sensul datelor îl stabilește programul** — adică instrucțiunea care lucrează cu acel octet. Procesorul nu verifică nimic: va aduna două coduri de litere la fel de ușor ca două numere."},arith:{h:"Aritmetica în sistemul binar",p:["Adunarea se face „în coloană”: 1 + 1 = 10, adică 0 și transport în rangul următor (așa funcționează sumatorul). Scăderea procesorul o face prin adunare: A − B = A + (−B). Înmulțire și împărțire 8080 **nu are** — le execută programele. După operație procesorul setează **indicatorii** — caracteristicile rezultatului (în dreapta calculului)."],title:"Laborator: aritmetică pe 8 și 16 biți",a:"A",b:"B",ops:{add:"Adunare",sub:"Scădere",mul:"Înmulțire",div:"Împărțire"},carryRow:"transporturi",carryNote:"transportul se scrie deasupra rangului în care trece",colHead:"fără semn / cu semn",negTitle:"Cum s-a obținut −B",negSteps:["B","inversăm toți biții","+1 → acesta este −B"],flags:"Indicatori",flagExpl:{CY:"transport din rangul superior (la scădere — împrumut)",Z:"rezultatul este zero",S:"bitul superior (de semn) al rezultatului",P:"număr par de unu în rezultat",AC:"transport din rangul 3 în rangul 4"},vFlag:"V — depășire cu semn (8080 nu are un astfel de indicator)",ovfText:(a,b,r,op)=>`Dacă numerele sunt considerate cu semn: ${a} ${op} ${b} = ${op==="+"?a+b:a-b}, iar aceasta este în afara domeniului −128…127. Rezultatul „s-a răsturnat” și se citește ca ${r}.`,subNoBorrow:"La scădere procesorul scrie transportul ieșit în CY inversat: transportul 1 (unitatea roșie din stânga) înseamnă „nu a fost împrumut”, deci CY = 0. Rezultatul este pozitiv.",subBorrow:"Nu a existat transport din rangul superior — deci a fost nevoie de „împrumut”: A este mai mic decât B, CY = 1. Fără semn rezultatul este greșit, iar cu semn este un număr negativ în cod complementar.",carryOut:n=>`Rezultatul ${n} nu încape într-un octet: al nouălea bit a trecut în indicatorul CY.`,mulExpl:["Înmulțim „în coloană”, ca la școală, dar mai simplu: cifrele înmulțitorului B sunt doar 0 sau 1.","Pentru fiecare rang al lui B scriem un rând: dacă cifra este 1 — o copie a lui A, dacă 0 — zerouri. Fiecare rând următor se deplasează cu un rang la stânga (ca la școală — cu o căsuță).","Adunăm toate rândurile. Deplasarea la stânga cu k ranguri = înmulțirea cu 2ᵏ, de aceea procesorul poate înmulți prin deplasări și adunări."],mulRow:(i,on)=>on?`bitul ${i} al înmulțitorului = 1 → A, deplasare cu ${i}`:`bitul ${i} = 0 → zerouri`,mulResult:"Produsul (până la 16 biți)",divExpl:["Împărțim ca la școală. În sistemul binar fiecare cifră a câtului este 0 sau 1: împărțitorul fie încape în restul curent (scriem 1 și scădem), fie nu (scriem 0).","Parcurgem cifrele deîmpărțitului de la stânga la dreapta: coborâm cifra următoare, comparăm restul cu împărțitorul și, dacă e nevoie, scădem."],divQuot:"cât",divRem:"rest",divCheck:"Verificare",divSteps:"Toți pașii în ordine",divHead:["Cifra deîmpărțitului","Restul după coborâre","≥ împărțitorul?","Cifra câtului","Rest"],yes:"da",no:"nu",divZero:"Împărțirea la zero nu este permisă.",simLink:"Vedeți cum face asta procesorul (fila 7)"}}});Object.assign(ui.ro,{// ================= Fila 2. Caractere și codificări =================
enc:{introH:"Și literele sunt numere",introP:["Procesorul stochează doar numere. De aceea fiecărui caracter i se atribuie un număr — un **cod**, iar tabelul „caracter ↔ cod” se numește **codificare**. În calculator nu există litere: tastatura trimite un cod, iar ecranul desenează litera după cod."],pipe:[["⌨","Se apasă o tastă","„A”"],["🔢","Tastatura transmite codul","41h = 65"],["💾","În memorie — un octet","0100 0001"],["🖥","Ecranul desenează după cod","„A”"]],hexTitle:"De ce 41h = 65: tabelul 0…255",hexHint:"Rândul — cifra hex superioară, coloana — cea inferioară. În celulă — valoarea zecimală. Apăsați pe o celulă sau pe un caracter din dreapta.",hexFormula:(h,l,n)=>{const H=h.toString(16).toUpperCase();const Lo=l.toString(16).toUpperCase();const mid=h>9||l>9?` = ${H} · 16 + ${Lo}`:"";return`${H}${Lo}h${mid} = ${h} · 16 + ${l} = ${h*16} + ${l} = ${n}`;},cpTitle:"Tabele de coduri",hexDimNote:"Rândurile palide 8–F sunt codurile 80h–FFh: în ASCII nu există, ele sunt ocupate de tabelele naționale (mai jos).",uniLowByte:b=>`Codul Unicode este mai mare decât un octet, de aceea în tabelul din stânga este evidențiat doar octetul său inferior (${b}h); conversia completă — în formula de mai sus.`,cpHint:"Alegeți un tabel. Rândul — cifra hex superioară a codului, coloana — cea inferioară: caracterul din rândul 4, coloana 1 are codul 41h.",tables:{ascii:"ASCII",cp1251:"Windows-1251",cp866:"CP866 (DOS)",koi8:"KOI8-R",unicode:"Unicode (chirilic)"},tableAbout:{ascii:"Tabelul latin de bază (1963), 128 de coduri, 7 biți. Îl folosesc programele pentru 8080 și EMU8086.",cp1251:"Chirilica Windows. Codurile 00–7Fh — ca în ASCII, literele chirilice (rusești) — C0–FFh, în ordine alfabetică.",cp866:"Chirilica DOS. Literele chirilice (rusești) sunt împărțite în bucăți: А–п — 80–AFh, р–я — E0–EFh; între ele — caractere pentru desenarea chenarelor ferestrelor.",koi8:"Chirilica Unix. Literele sunt așezate astfel încât, la pierderea bitului superior, „П” devine „p”: textul rămâne lizibil cu litere latine.",unicode:"O numerotare unică a tuturor caracterelor din lume (coduri până la 10FFFFh). Este afișat blocul chirilic 0400–04FFh. În memorie aceste coduri se păstrează cel mai des în UTF-8."},groups:{ctrl:"de control",digit:"cifră",upper:"majusculă latină",lower:"minusculă latină",space:"spațiu",punct:"semn",cyr:"chirilică",other:"alt caracter",none:"nefolosit"},sel:{char:"Caracter",code:"Cod",group:"Grupă",ctrlName:"Rol",utf8:"Octeți UTF-8",cp:"Punct de cod"},utf8How:"Cum se transformă codul în octeți UTF-8",utf8Note:"Biții codului se așază după un șablon: primul octet începe cu 110, al doilea — cu 10. Astfel programul vede imediat unde începe caracterul și câți octeți are.",caseBtn:"Comută bitul 5 (majusculă ↔ minusculă)",ctrlNote:"Celulele gri sunt codurile de control 00–1Fh și 7Fh: ele nu se desenează, ci controlează dispozitivul. Nu trebuie memorate; importante sunt LF 0Ah (rând nou), CR 0Dh (întoarcerea carului — a capului de imprimare — la începutul rândului), NUL 00h (adesea — sfârșitul textului în memorie). SP 20h — spațiu.",lawsH:"Regularități utile",law1T:"O cifră nu este un număr",law1:"Caracterul „7” are codul 37h, numărul 7 — 07h. Diferența este exact 30h: pentru a obține valoarea cifrei, din cod se scade 30h.",law2T:"Majusculă și minusculă — un singur bit",law2:"„A” și „a” diferă doar prin bitul 5 (ponderea 20h). Punându-l la zero (ȘI logic cu masca 1101 1111b), programul transformă litera în majusculă.",law3T:"Literele sunt în ordine alfabetică",law3:"Codurile cresc odată cu alfabetul, așa că cuvintele pot fi sortate comparând codurile. Dar toate majusculele stau înaintea minusculelor: „Z” (5Ah) < „a” (61h).",cyrH:"O literă — coduri diferite",cyrP:["În ASCII nu există chirilică, de aceea au apărut tabele pe 8 biți în care literele chirilice (rusești) au ocupat codurile 80–FFh — fiecare firmă în felul ei. Nici literele românești ă, â, î, ș, ț nu sunt în ASCII (Windows-1250, ISO 8859-16). Dacă un text este scris într-un tabel și citit în altul, apar caractere „stricate”. Soluția este **Unicode**: fiecare caracter are un singur număr, iar în memorie se scrie în **UTF-8** (latina — 1 octet, ca în ASCII; chirilica — 2 octeți)."],letter:"Literă",letterHint:"scrieți orice literă — chirilică sau latină",kindCyr:"chirilică",kindLat:"latină (ASCII)",kindOther:"alt caracter",bytesWord:n=>n===1?"octet":"octeți",pairs:[["C","С","C (lat.) și С (chir.)"],["A","А","A (lat.) și А (chir.)"],["P","Р","P (lat.) și Р (chir.)"],["Ц","ц","Ц și ц"],["A","a","A și a"]],cmpDiff:"Literele arată la fel, dar sunt caractere diferite, cu coduri diferite. Pentru calculator, „C” latin și „С” chirilic sunt la fel de diferite ca „C” și „Ж”: căutarea unui cuvânt tastat cu altă aranjare a tastaturii nu va găsi nimic.",cmpNote:"Comparați rândurile: sunt evidențiate codificările în care cele două caractere au același cod.",uniNote:"U+041F este numărul caracterului în Unicode (punct de cod). UTF-8 așază biții lui după șablonul 110xxxxx 10xxxxxx — de aceea o literă chirilică ocupă 2 octeți (detaliat — în tabelul Unicode de mai sus).",oneLetterHead:["Tabel","Cod","Binar","Octeți"],convTitle:"Text → octeți → text",convHint:"Introduceți un text și alegeți codificarea. Sub fiecare caracter — octeții lui în hex; SP — spațiu. Apăsați pe un caracter — el va fi găsit în tabelul de coduri de mai sus. Jos — aceiași octeți, citiți în alte codificări (· — cod de control, � — octet care nu este caracter).",text:"Text",encoding:"Codificarea scrierii",read:"Aceiași octeți, citiți ca…",cant:"nu există în tabel",total:n=>`Octeți în total: ${n}`,showInTable:"arată în tabel ↑",summary:"Concluzie: în programele pentru 8080 și EMU8086 se folosește ASCII — un caracter ocupă un octet. Textul în memorie este un șir de coduri (**șir de caractere**); sfârșitul lui se marchează cu codul 00h (în DOS — cu semnul „$”). Nu confundați cu rândul nou 0Ah — acesta doar mută textul pe un rând nou al ecranului."},// ================= Fila 3. Instrucțiuni =================
cmd:{progH:"Procesorul execută un program",progP:["**Procesorul** este un circuit care execută pe rând **instrucțiuni**: copiază un octet, adună, compară, sare. **Programul** este o succesiune de instrucțiuni; el se află în **memorie** (un șir de celule numerotate, de câte 1 octet) la fel ca datele. Adresa instrucțiunii următoare este păstrată în registrul **PC** — contorul de program."],progHint:"Apăsați „Execută instrucțiunea”: procesorul execută instrucțiunea indicată de PC, iar PC trece la următoarea. Atenție: instrucțiunile au lungimi diferite. Toate numerele sunt în hex.",progNext:"Execută instrucțiunea ▶",progReset:"De la început",progLabels:{mem:"Memorie",addr:"adresă",cpu:"Procesor",pc:"PC — adresa instrucțiunii care se va executa următoarea",done:"Tocmai executată",next:"Următoarea (indicată de PC)",stopped:"procesorul este oprit",screen:"Ecran"},progItems:[["MVI A, 03h","încarcă în A numărul 3"],["MOV B, A","copiază A în B"],["ADD B","A ← A + B (3 + 3 = 6)"],["ADI 30h","A ← A + 30h: numărul 6 → codul caracterului „6”"],["OUT 01h","afișează A pe ecran"],["HLT","oprire"]],anatH:"Anatomia unei instrucțiuni",anatP:["Aceeași instrucțiune în două forme: text pentru om (limbaj de asamblare) și octeți pentru procesor (cod mașină). Alegeți un exemplu."],anatLabels:{asm:"Limbaj de asamblare — pentru om",assembler:"asamblorul traduce",code:"Cod mașină — pentru procesor",opcode:"cod de operație (COP)",operand:"operand",bits:"Biții codului de operație (primul octet)",mnem:"mnemonică"},anat:[{asm:[["MVI","mn"],[" A","o1"],[", 05h","o2"]],bytes:[0x3e,0x05],roles:["COP: „încarcă o constantă în registrul A”","operand: constanta 5"],fields:[["00","op","„încarcă…”"],["111","dst","unde: A"],["110","op","„…o constantă din octetul următor”"]],note:"MVI = Move Immediate: „transferă o valoare imediată”. Numărul 5 este scris direct în instrucțiune."},{asm:[["MOV","mn"],[" B","o1"],[", A","o2"]],bytes:[0x47],roles:["COP: totul într-un singur octet"],fields:[["01","op","transfer"],["000","dst","unde: B"],["111","src","de unde: A"]],note:"Ambele registre sunt codificate prin câmpuri în interiorul codului de operație — de aceea instrucțiunea ocupă doar 1 octet. Primul se scrie destinația: B ← A."},{asm:[["LDA","mn"],[" 0081h","o2"]],bytes:[0x3a,0x81,0x00],roles:["COP: „încarcă A din memorie”","octetul inferior al adresei","octetul superior al adresei"],fields:[["00111010","op","LDA — întregul octet definește instrucțiunea"]],note:"Adresa 0081h ocupă 2 octeți; în memorie ea se află cu octetul inferior înainte: 81h, apoi 00h."},{asm:[["ADD","mn"],[" B","o1"]],bytes:[0x80],roles:["COP: „adună la A registrul B”"],fields:[["10000","op","adunare cu A"],["000","src","ce se adună: B"]],note:"Primul operand al adunării este întotdeauna acumulatorul A, de aceea în instrucțiune se indică doar al doilea."},{asm:[["JMP","mn"],[" 0000h","o2"]],bytes:[0xc3,0x00,0x00],roles:["COP: „salt”","octetul inferior al adresei","octetul superior al adresei"],fields:[["11000011","op","JMP — salt necondiționat"]],note:"Saltul doar scrie adresa 0000h în PC — instrucțiunea următoare va fi citită de acolo."}],termsH:"Noțiuni de bază",terms:[["prog","Program","o succesiune de instrucțiuni în memorie."],["code","Cod mașină","instrucțiunea sub formă de octeți înțeleși de procesor: 3Eh 05h."],["opcode","Cod de operație (COP)","primul octet al instrucțiunii: din el procesorul află **ce** trebuie să facă și câți octeți mai are de citit."],["operand","Operand","**asupra a ce** se face acțiunea: un număr, un registru, o celulă de memorie, un port."],["mnem","Mnemonică","un cuvânt scurt în locul codului: MVI, MOV, ADD, JMP."],["asm","Asamblor","limbaj de scriere prin mnemonice (1 rând = 1 instrucțiune) și programul care îl traduce în cod mașină."],["reg","Registru","o celulă din interiorul procesorului, formată din bistabile — cea mai rapidă memorie. La 8080: A, B, C, D, E, H, L."],["acc","Acumulatorul A","registrul principal: primul număr din aritmetică și locul pentru rezultat."],["pair","Pereche de registre","două registre ca un singur număr pe 16 biți: BC, DE, HL. HL păstrează de obicei o adresă; celula de la această adresă se notează **M**."],["mem","Memorie și adresă","un șir de celule de câte 1 octet; adresa este numărul celulei (16 biți). Detaliat — fila 4."],["pc","Contorul de program PC","registrul cu adresa instrucțiunii următoare."],["flags","Indicatori (flag-uri)","semne de un bit ale rezultatului: CY — transport, Z — zero, S — semn…"],["port","Port","numărul unui dispozitiv. În model: 00h — tastatura, 01h — ecranul."]],srcH:"De unde își ia instrucțiunea operandul",srcs:[{ex:"MVI A, 5",from:"din instrucțiunea însăși",kind:"imm"},{ex:"MOV B, A",from:"dintr-un registru",kind:"reg"},{ex:"LDA 0080h",from:"din memorie, de la o adresă",kind:"mem"},{ex:"IN 00h",from:"de la un dispozitiv (port)",kind:"port"}],orderNote:"În scrierea `MOV B, A` primul se scrie **destinația**, al doilea — **sursa**: „B ← A”. Așa sunt construite aproape toate instrucțiunile 8080 și 8086.",fmtH:"Formatele instrucțiunilor 8080",fmtP:"O instrucțiune ocupă 1, 2 sau 3 octeți. Primul octet este întotdeauna codul de operație: după ce îl citește, procesorul știe câți octeți mai are de citit.",formats:[{n:1,what:"doar codul de operație — tot ce trebuie este „încorporat” în el",ex:[["MOV B, A",[0x47]],["ADD B",[0x80]],["HLT",[0x76]]],parts:["COP"]},{n:2,what:"cod de operație + un octet de date (constantă) sau numărul portului",ex:[["MVI A, 05h",[0x3e,0x05]],["OUT 01h",[0xd3,0x01]]],parts:["COP","date / port"]},{n:3,what:"cod de operație + adresă sau constantă pe 16 biți: întâi octetul inferior, apoi cel superior",ex:[["LDA 0081h",[0x3a,0x81,0x00]],["JMP 0104h",[0xc3,0x04,0x01]]],parts:["COP","octet inferior","octet superior"]}],byteWord:n=>`${n} ${n===1?"octet":"octeți"}`,littleEndian:"„Octetul inferior primul” (little-endian) — așa au decis proiectanții lui 8080; această ordine au moștenit-o 8086 și procesoarele x86 moderne. Adresa 0081h se scrie prin octeții 81h 00h.",fields:{h:"Câmpuri în interiorul codului de operație",p:["Biții codului de operație sunt împărțiți în **câmpuri**: biții constanți (cifre) spun ce instrucțiune este, iar câmpurile cu litere — ce operanzi are. La `MOV r1, r2` codul este 01 DDD SSS: DDD — numărul destinației, SSS — al sursei. Trei biți dau 8 variante: A, B, C, D, E, H, L și M."],regs:"Codurile registrelor (câmpurile DDD și SSS)",pairs:"Codurile perechilor de registre (câmpul RP)",conds:"Codurile condițiilor (câmpul CCC)",condNote:"Condițiile verifică indicatorii. Aici M înseamnă „minus” — nu confundați cu celula de memorie M.",usage:"Câmpul RP apare în instrucțiunile cu perechi pe 16 biți (LXI, INX, PUSH, POP); câmpul CCC — în instrucțiunile de salt condiționat (JZ, JNZ…). SP și stiva — fila 4.",condDesc:{NZ:"nu e zero (Z=0)",Z:"zero (Z=1)",NC:"fără transport (CY=0)",C:"transport (CY=1)",PO:"paritate impară (P=0)",PE:"paritate pară (P=1)",P:"plus (S=0)",M:"minus (S=1)"}},lab:{title:"Codificarea și decodificarea unei instrucțiuni",encTitle:"Asamblor → cod mașină",encHint:"Alegeți instrucțiunea și operanzii — obțineți octeții ei. Numerele sunt zecimale (25) sau hex (19h); octeții sunt mereu în hex, deci 25 va deveni 19.",decTitle:"Cod mașină → asamblor",decHint:"Apăsați pe biți sau mișcați cursorul — decodificatorul va spune ce instrucțiune este codificată de acest octet.",template:"Instrucțiune",reg1:"Destinație",reg2:"Sursă",reg:"Registru",pair:"Pereche",value:"Număr",addr:"Adresă",port:"Port",cond:"Condiție",bytesLabel:"Octeți în memorie",unused:"Acest cod nu este folosit în 8080 (nedocumentat).",len:"Lungime",group:"Grupă"},exH:"Cum execută procesorul o instrucțiune",exP:["Fiecare instrucțiune trece prin aceleași etape — acesta este **ciclul de instrucțiune**. Mai jos un mic program se execută câte o instrucțiune, iar fiecare instrucțiune — pe etape. Apăsați „Etapa ▶” și urmăriți ce se schimbă în memorie și în procesor."],stages:{fetch:["Extragere","procesorul citește octetul de la adresa din PC în registrul de instrucțiuni IR; PC + 1"],decode:["Decodificare","decodificatorul analizează biții codului: ce instrucțiune, ce operanzi, câți octeți mai trebuie citiți"],operand:["Citirea operandului","dacă instrucțiunea are mai mult de 1 octet, se citesc octeții ei următori (constantă, adresă, port); PC + 1 pentru fiecare"],exec:["Execuție","se realizează acțiunea propriu-zisă: transfer, adunare, salt, afișare"],next:["Instrucțiunea următoare","PC indică deja instrucțiunea următoare — ciclul se repetă"]},cycleCenter:["Ciclu de","instrucțiune"],ex:{prev:"◀ Etapa",next:"Etapa ▶",restart:"De la început",cmdList:"Program",mem:"Memorie",cpu:"Procesor",decoder:"Decodificator",bus:"Schimb pe magistrale",busA:"adresă",busD:"date",idle:"—",busNote:"Magistrala este un grup de fire între procesor și memorie: pe magistrala de adrese procesorul transmite numărul celulei, pe magistrala de date circulă octetul însuși (detaliat — fila 5).",done:"Programul s-a executat. Apăsați „De la început” pentru a-l repeta.",waitDecode:"așteaptă: octetul abia se citește"},exText:{fetch:(pc,op,pc1)=>`**Extragere.** PC = ${pc}: procesorul pune această adresă pe magistrala de adrese și citește din memorie octetul **${op}**. Octetul ajunge în registrul de instrucțiuni IR. Deocamdată este doar un număr — ce înseamnă, procesorul va afla la etapa următoare. PC crește imediat: ${pc1}.`,decode:["**Decodificare.** Decodificatorul se uită la biții 3Eh = 00 111 110. Șablonul 00 ··· 110 înseamnă MVI — „încarcă o constantă în registru”; câmpul 111 — registrul A. Concluzia decodificatorului: „instrucțiune de 2 octeți — trebuie citit încă un octet, acesta va fi numărul”.","**Decodificare.** 47h = 01 000 111. Începutul 01 — este transferul MOV; câmpul 000 — destinația B, câmpul 111 — sursa A. Toate informațiile sunt deja într-un singur octet — nu mai trebuie citit nimic.","**Decodificare.** 80h = 10000 000. Începutul 10000 — „adună la A”; câmpul 000 — al doilea termen, registrul B. Instrucțiune de un octet.","*
