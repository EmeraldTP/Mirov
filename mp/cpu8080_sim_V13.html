mory; the address is in the next two bytes”. The buses are not needed at this moment.",on:["cpu"],pc:0x0001,cpu:"decoding LDA"},{t:"Operand read: low byte (M2)",x:"LDA needs an address. The CPU reads the next instruction byte at PC = 0001h — it is 81h, the low byte of the address. PC increases to 0002h.",on:["cpu","abus","dbus","mem","cbus"],sig:["SYNC","DBIN"],a:0x0001,d:0x81,dd:"in",pc:0x0002,cpu:"reads address (low)"},{t:"Operand read: high byte (M3)",x:"One more read: address 0002h holds 00h — the high byte. Now the CPU knows the whole address 0081h. PC = 0003h.",on:["cpu","abus","dbus","mem","cbus"],sig:["SYNC","DBIN"],a:0x0002,d:0x00,dd:"in",pc:0x0003,cpu:"reads address (high)"},{t:"Execute (M4)",x:"The fourth machine cycle accesses data: address 0081h comes not from PC but from the instruction. Byte 11h goes into the accumulator. In total, LDA took 4 machine cycles (13 clock cycles).",on:["cpu","abus","dbus","mem","cell","cbus"],sig:["SYNC","DBIN"],a:0x0081,d:0x11,dd:"in",cell:0x81,pc:0x0003,cpu:"A ← 11h"},{t:"Next instruction",x:"The instruction is done. PC = 0003h points to the next instruction — the “fetch → decode → execute” cycle repeats until an HLT instruction is reached.",on:["cpu"],pc:0x0003,cpu:"to next instruction"}]},{id:"io",name:"Device exchange (OUT, IN)",mode:"program execution",frames:[{t:"Output: port number on the address bus",x:"The OUT 01h instruction sends a byte to the screen. The CPU puts port number 01h on the address bus (on the 8080 it is duplicated in both halves of the address: 0101h). In the status word the CPU reports: “this is a device exchange, not memory” — so memory does not respond.",on:["cpu","abus","io","cbus"],sig:["SYNC"],a:0x0101,cpu:"OUT 01h"},{t:"Output: data and write",x:"The CPU puts the accumulator contents — character code 48h ('H') — on the data bus and issues the WR signal. The screen on port 01h takes the byte and draws the letter H.",on:["cpu","dbus","cbus","io","abus"],sig:["WR"],a:0x0101,d:0x48,dd:"out",cpu:"outputs 48h"},{t:"Input: reading a port",x:"The IN 00h instruction reads the keyboard. Port number 00h is on the address bus, the DBIN signal says “reading”. The keyboard puts the code of the pressed key 69h ('i') on the data bus, and it goes into the accumulator.",on:["cpu","abus","dbus","cbus","io"],sig:["SYNC","DBIN"],a:0x0000,d:0x69,dd:"in",cpu:"A ← 69h",noMem:true},{t:"Summary",x:"I/O devices are connected to the same buses as memory. Only the instructions differ (IN/OUT instead of memory instructions) and the status word, which tells who must respond. Port numbers range from 00h to FFh.",on:["cpu","io"],cpu:"ready"}]},{id:"wait",name:"Waiting for slow memory",mode:"wait (WAIT)",frames:[{t:"Memory not ready",x:"The CPU has put out an address, but the slow memory chip hasn't found the data yet. It holds the CPU's READY input at 0.",on:["cpu","abus","mem"],sig:["SYNC","DBIN"],ready0:true,a:0x0081,cpu:"waiting"},{t:"Wait states",x:"While READY = 0, the CPU inserts extra **wait states** Tw into the machine cycle and issues the WAIT signal. The address and signals stay on the buses unchanged.",on:["cpu","abus","mem"],sig:["DBIN","WAIT"],ready0:true,a:0x0081,cpu:"state Tw"},{t:"Memory ready",x:"Memory has put out the byte and set READY = 1. The CPU takes the data and continues. This is how slow devices can be connected to a fast CPU.",on:["cpu","dbus","mem","cell"],sig:["DBIN"],a:0x0081,d:0x11,dd:"in",cell:0x81,cpu:"got 11h"}]},{id:"dma",name:"Direct memory access (DMA)",mode:"bus hold (HOLD)",frames:[{t:"Bus request",x:"The disk controller needs to copy a block of data into memory quickly. If the CPU did it, every byte would pass through it. Instead, the DMA controller sends the HOLD signal — “give me the buses”.",on:["dma","hold"],sig:["HOLD"],cpu:"running program"},{t:"The CPU gives up the buses",x:"The CPU finishes the current machine cycle and **disconnects** its outputs from the buses — puts them into the third, high-impedance state, like a tri-state logic gate: the output is as if unplugged from the wire. Then it answers with the HLDA signal. Program execution is paused.",on:["cpu","hold"],sig:["HOLD","HLDA"],cpuOff:true,cpu:"disconnected from buses"},{t:"Transfer bypassing the CPU",x:"Now the DMA controller drives the buses: it puts out address 00A0h, a byte from the disk and the write signal itself. Bytes go from the device straight into memory — hence the name “direct access”.",on:["dma","abus","dbus","cbus","mem","cell"],sig:["HOLD","HLDA"],cpuOff:true,a:0x00a0,d:0x5a,dd:"dma",cell:0xa0,write:true,cpu:"disconnected from buses"},{t:"Buses returned",x:"The block is transferred, the controller removes HOLD. The CPU removes HLDA, reconnects to the buses and continues the program from where it stopped.",on:["cpu"],cpu:"continues program"}]},{id:"int",name:"Interrupt",mode:"interrupt handling",intro:"Why do we need interrupts? Without them, a program would have to keep polling the keyboard: “is a key pressed?” — and spend almost all its time on that. An interrupt lets a device “call” the CPU itself when something happens. The subroutine that services such a call is called an **interrupt handler**.",frames:[{t:"Interrupt request",x:"The CPU is running a program (here the system is a “real” one with 64 KB of memory: the main program starts at address 0100h). Interrupts are enabled: INTE = 1 — an internal CPU flip-flop (not a flag in register F), set by the EI instruction (“enable interrupts”). The user pressed a key — the keyboard sends the INT signal: “service me urgently”.",on:["irq","int"],sig:["INT","INTE"],pc:0x0104,cpu:"running program"},{t:"The CPU accepts the request",x:"The CPU **finishes the current instruction** (it doesn't stop it halfway), sees INT = 1 and INTE = 1 and accepts the interrupt. The INTE flip-flop is cleared automatically (INTE = 0) so that a new interrupt won't disturb the handling.",on:["cpu","int"],sig:["INT"],pc:0x0104,cpu:"accepts interrupt"},{t:"Instruction from the device",x:"Instead of reading the next instruction from memory, the CPU reads it **from the data bus, from the device**. The keyboard puts out code CFh — the one-byte instruction RST 1 (“call the subroutine at address 0008h”). This way the device immediately says which handler is needed: different devices send different RST 0…7 instructions (addresses 0000h, 0008h, …, 0038h).",on:["cpu","dbus","irq"],sig:["DBIN"],d:0xcf,dd:"irq",pc:0x0104,cpu:"got RST 1"},{t:"Return address — onto the stack",x:"As with a subroutine call, the CPU writes the current PC value (0104h) onto the stack and loads PC with address 0008h — where the **interrupt handler** begins.",on:["cpu","abus","dbus","mem","cbus"],sig:["WR"],a:0x00fe,d:0x04,dd:"out",pc:0x0008,cpu:"PC → stack"},{t:"Return",x:"The handler reads the key code, re-enables interrupts with EI and executes RET: address 0104h comes back from the stack. The main program continues without “noticing” the break. So as not to spoil its registers and flags, the handler saves them on the stack at the start (PUSH) and restores them before RET (POP).",on:["cpu"],sig:["INTE"],pc:0x0104,cpu:"continues program"}]},{id:"halt",name:"Halt (HLT)",mode:"halt",frames:[{t:"HLT instruction",x:"The CPU executed the HLT instruction and stopped: it no longer reads instructions, the buses are idle. PC points to the instruction following HLT.",on:["cpu"],pc:0x000c,cpu:"HALTED",halt:true},{t:"How to leave the halt state",x:"There are two ways out: the RESET signal (the program starts over from address 0000h) or an interrupt (see the “Interrupt” scenario), if interrupts were enabled (INTE = 1). While halted, the CPU can also give up the buses on a HOLD signal.",on:["cpu","irq","int"],sig:["INT","INTE"],pc:0x000c,cpu:"HALTED",halt:true},{t:"Wake-up by interrupt",x:"An INT signal arrives — the CPU leaves the halt state, runs the interrupt handler and then continues from the instruction after HLT. This way a “sleeping” CPU waits for an event without doing useless work.",on:["cpu","int"],sig:["INT"],pc:0x0008,cpu:"handler"}]},{id:"reset",name:"Reset (RESET)",mode:"reset",frames:[{t:"RESET signal",x:"When power is turned on or the “Reset” button is pressed, 1 is applied to the RESET input. The CPU stops whatever it was doing.",on:["cpu"],sig:["RESET"],cpu:"reset"},{t:"Initial state",x:"The CPU sets PC = 0000h, disables interrupts (INTE = 0) and cancels the bus hold (HLDA = 0). The contents of the other registers are undefined — the program must set them itself.",on:["cpu"],sig:["RESET"],pc:0x0000,cpu:"PC = 0000h"},{t:"Program start",x:"When RESET goes back to 0, the CPU starts fetching from address 0000h. That is why a ROM with a startup program is usually placed at the beginning of the address space.",on:["cpu","abus","dbus","mem","cbus"],sig:["SYNC","DBIN"],a:0x0000,d:0x31,dd:"in",pc:0x0001,cpu:"fetch from 0000h"}]}],modesTitle:"CPU operating modes — summary",modesHead:["Mode","How it starts","What the CPU does","How it ends"],modes:[["Program execution","after reset","cyclically: fetch → decode → execute","HLT instruction, HOLD / INT requests"],["Wait","READY = 0","inserts wait states Tw, keeps signals on the buses","READY = 1"],["Bus hold (DMA)","HOLD = 1","disconnects from the buses, issues HLDA","HOLD = 0"],["Interrupt","INT = 1 with INTE = 1","after the current instruction executes the instruction from the device (usually RST), saving PC on the stack","RET instruction in the handler"],["Halt","HLT instruction","executes nothing","RESET or interrupt"],["Reset","RESET = 1","PC = 0000h, INTE = 0","RESET = 0 → start from 0000h"]]}});Object.assign(ui.en,{// ================= Tab 6. Instruction set =================
isa:{intro:[{h:"The 8080 instruction set",p:["The 8080 has **78 kinds of instructions**; counting the different registers and conditions, that is 244 opcodes out of 256 possible (12 codes are unused). You don't need to memorize them all: by behavior they fall into five groups, and instructions inside a group are built alike.","A star ★ marks instructions that the simulator in tab 7 can execute. These are the most common instructions — all the course examples are built on them."]}],legend:[["Notation","r — register A, B, C, D, E, H, L or M (the memory cell at address HL); rp — pair BC, DE, HL or SP; d8 / d16 — a 1- / 2-byte constant; a16 — a 16-bit address; port — port number; cc — condition (NZ, Z, NC, C, PO, PE, P, M); n — number 0…7 in the RST instruction"],["Format","binary form of the opcode: 0/1 — fixed bits; DDD — destination, SSS — source, RP — pair, CCC — condition, NNN — RST number (see tab 3); R — one pair bit in LDAX/STAX: 0 = BC, 1 = DE. ★ part. — of the Jcc instructions the simulator executes only JZ, JNZ, JC, JNC"],["Bytes","instruction length"],["Cycles","how many clock cycles execution takes (at 2 MHz one cycle = 0.5 µs). Each memory access is one more machine cycle (about 3 clock cycles), so ADD B takes 4 cycles and ADD M takes 7; LDA takes 13 (opcode, two address bytes and the data byte itself). Conditional instructions show “not taken / taken”"],["Flags","which flags the instruction changes; “—” — none; CY=0 — always clears it; (PSW: *) — POP PSW restores all flags from the stack"]],tableHint:"Click a row — on the right you will see a breakdown of the instruction and the ready-made examples (tab 8) where it is used.",groups:{move:{name:"Data transfer",d:"Copy bytes between registers, memory and constants. They don't change flags. These are the most frequent instructions in any program.",fmt:"Registers are given by 3-bit fields DDD/SSS, pairs by the 2-bit field RP."},arith:{name:"Arithmetic",d:"Addition, subtraction, increment and decrement by 1. The result of 8-bit operations goes to the accumulator A; they change flags.",fmt:"10 ooo SSS (second operand is a register or M) or 11 ooo 110 + byte (constant); ooo is the operation number: 000 ADD, 001 ADC, 010 SUB, 011 SBB."},logic:{name:"Logic and compare",d:"Bitwise AND, OR, exclusive OR, compare, accumulator shifts. Compare (CMP/CPI) subtracts without keeping the result — only to set the flags.",fmt:"Same structure as arithmetic: 10 ooo SSS or 11 ooo 110 + byte, where ooo is the operation number (AND, exclusive OR, OR, compare)."},branch:{name:"Jumps and subroutines",d:"Change the order of execution: unconditional and conditional jumps, subroutine calls and returns. A condition tests one of the flags.",fmt:"The condition is given by the 3-bit field CCC; the address is in the next two bytes (low byte first)."},ctrl:{name:"Stack, I/O, control",d:"Stack operations, data exchange with devices through ports, interrupt control and halting.",fmt:"In PUSH/POP, PSW is used instead of the SP pair — the accumulator together with the flags."}},filterAll:"All instructions",filterSim:"Only ★ (in the simulator)",head:["","Instruction","Format","Bytes","Cycles","Flags","Action"],simPart:"★ partly: the simulator has JZ, JNZ, JC, JNC",starPart:"part.",detail:{title:"Instruction details",pick:"Select an instruction in the table.",example:"Example",bytes:"Machine code of the example",usedIn:"Used in the ready-made examples",open:"Open in the simulator",notSim:"This instruction is not part of the simulator's set — you can study it only from the reference."},desc:{MOV_rr:"r1 ← r2: copy source register r2 into destination register r1",MOV_rm:"load register r with the memory byte at the address in HL",MOV_mr:"store register r to memory at the address in HL",MVI_r:"load a constant (the second instruction byte) into a register",MVI_m:"store a constant to memory at the address in HL",LXI:"load a 16-bit constant into a register pair",LDA:"load A with the memory byte at an address",STA:"store A to memory at an address",LHLD:"load HL with two bytes from memory (L ← [a], H ← [a+1])",SHLD:"store HL to memory (two bytes)",LDAX:"load A with the memory byte at the address in pair BC or DE",STAX:"store A to memory at the address in pair BC or DE",XCHG:"swap the contents of pairs HL and DE",ADD:"A ← A + r",ADC:"A ← A + r + CY (add with carry — for multi-byte numbers)",ADI:"A ← A + constant",ACI:"A ← A + constant + CY",SUB:"A ← A − r",SBB:"A ← A − r − CY (subtract with borrow)",SUI:"A ← A − constant",SBI:"A ← A − constant − CY",INR:"r ← r + 1 (the CY flag is not changed)",DCR:"r ← r − 1 (the CY flag is not changed)",INX:"pair ← pair + 1 (16 bits, flags not changed)",DCX:"pair ← pair − 1",DAD:"HL ← HL + pair (16-bit addition)",DAA:"decimal adjust of A after adding BCD numbers",ANA:"A ← A AND r (bitwise AND)",XRA:"A ← A XOR r (exclusive OR); XRA A is a quick way to clear A",ORA:"A ← A OR r (bitwise OR)",CMP:"compare A with r: compute A − r only for the flags (Z=1 — equal, CY=1 — A is smaller)",ANI:"A ← A AND constant (mask: clear chosen bits)",XRI:"A ← A XOR constant (invert chosen bits)",ORI:"A ← A OR constant (set chosen bits)",CPI:"compare A with a constant",RLC:"rotate A left; the high bit → CY and into the low bit",RRC:"rotate A right",RAL:"rotate A left through the carry CY",RAR:"rotate A right through the carry CY",CMA:"invert all bits of A",CMC:"invert the CY flag",STC:"set CY = 1",JMP:"jump to an address: PC ← address",Jcc:"jump if the condition holds (JNZ, JZ, JNC, JC, JPO, JPE, JP, JM)",CALL:"call a subroutine: return address → stack, PC ← address",Ccc:"call a subroutine on a condition (CNZ, CZ, CNC, CC, …)",RET:"return from a subroutine: PC ← address from the stack",Rcc:"return on a condition (RNZ, RZ, …)",RST:"short subroutine call to address 8·n (this is how devices call interrupt handlers → tab 5)",PCHL:"jump to the address in HL",PUSH:"push a pair onto the stack: SP ← SP − 2",POP:"pop a pair from the stack: SP ← SP + 2",XTHL:"swap HL with the two bytes on top of the stack",SPHL:"SP ← HL",IN:"read a byte from a device port into A (→ tab 5)",OUT:"send A to a device port (→ tab 5)",EI:"enable interrupts: INTE = 1 (→ tab 5)",DI:"disable interrupts: INTE = 0",HLT:"halt the processor (by the MOV pattern this code would be MOV M, M — a meaningless instruction, so it was given to HLT)",NOP:"do nothing (1 instruction = a 4-cycle delay)"}},// ================= Tab 7. Architecture =================
arch:{intro:[{h:"Inside the processor",p:["In tab 5 the processor was a “black box”. Now let's look inside. The diagram below follows the Intel 8080 block diagram from the datasheet. All blocks are connected by the **internal data bus** (8 bits); the processor talks to the outside world through the **data bus buffer** and the **address buffer**.","**How to start:** choose a program in the list below and press **“Step ▶”**, reading the **“What is happening now”** panel under the diagram after each press. One step is one **stage** of executing an instruction: usually one clock cycle or one action inside the processor. The **“Instruction ⏩”** button runs all stages of the current instruction at once, **“◀ Step”** goes one stage back, **“▶ Auto”** runs the program by itself at the chosen speed — stage by stage or instruction by instruction.","**Colors on the diagram:** yellow fill — the block working at this stage; a colored “running” line — the path of a byte (orange — address bus, blue — data bus, purple — control signals, teal — transfer inside the processor); a **red number** — a value that has just changed."]}],blocksTitle:"Reference: what are these blocks? (expand; clicking a card outlines the block on the diagram in blue)",phaseHint:"The strip below shows the stages of the current instruction. M is a machine cycle (one access to memory or a device), T is a clock cycle. The first cycle M1 always starts with the opcode fetch (T1–T3) and decode (T4); for a short instruction like MOV B, A it lasts 4–5 clock cycles, and there are no other cycles. An instruction with operands in memory adds cycles: LDA has M2 and M3 for the two address bytes and M4 for the data byte itself. Sometimes two actions happen in one clock cycle (for example, decode and the first transfer at T4) — then the clock cycle is repeated in the strip.",irStale:"Note: at stages T1–T2 the IR register still holds the previous instruction's code — the new code enters IR at T3, and the decoder analyzes it at T4.",busLegend:"SYNC — start of a machine cycle; MEMR — memory read; MEMW — memory write; I/O RD, I/O WR — device read and write; HLTA — halt acknowledge. MEMR, MEMW, I/O RD, I/O WR are system control bus signals: an external circuit builds them from DBIN / WR and the status word (tab 5); the 8080 has no pins with these names.",labelsNote:"NUM1, NUM2, SUM and other names with a colon are labels (names of addresses). ORG and DB are directives for the assembler, not processor instructions. Details are in tab 8.",btnHint:"Step — one stage · Instruction — to the end of the current instruction · Auto — continuously · Zoom — diagram size",kbdHint:"(used by the IN 00h instruction — example 12; press Enter)",blocks:[["acc","Accumulator A","the main register: first ALU operand and the result"],["act","Accumulator latch ACT","a copy of A during computation. The ALU reads the first number from ACT and writes the result to A: without the copy, the ALU input would change right in the middle of the calculation"],["tmp","Temporary register TMP","second ALU operand and an intermediate copy during transfers"],["alu","ALU","arithmetic logic unit: an adder and logic circuits"],["flags","Flags","flip-flops for result properties S Z AC P CY"],["ir","Instruction register IR","holds the opcode of the instruction being executed"],["dec","Instruction decoder","determines from the opcode which actions and machine cycles are needed"],["tc","Timing and control unit","issues control signals at the right clock cycles: SYNC, DBIN, WR…"],["mux","Multiplexer","connects the needed register from the register array to the internal bus"],["rB","B, C, D, E, H, L","general-purpose registers available to the program"],["rW","W, Z","registers hidden from the programmer: the processor assembles a 16-bit address in them from the instruction bytes (for LDA 0080h: Z = 80h, W = 00h). Don't confuse with the Z flag"],["rPC","PC, SP","program counter and stack pointer"],["incLatch","Increment/decrement and address latch","adds or subtracts 1 from 16-bit values (PC, SP, pairs). The latch holds the current address on the address bus while PC has already been incremented to the next one"],["abuf","Address buffer","puts the 16-bit address on the external address bus"],["dbb","Data bus buffer","links the internal bus with the external data bus"],["daa","Decimal adjust","corrects the result of arithmetic with BCD numbers (the DAA instruction); not used in our examples"]]},// ================= Tab 8. Editor =================
editor:{intro:[{h:"Writing a program ourselves",p:["An assembly program is text where **one line = one instruction**. The assembler turns the lines into bytes and places them in memory starting at address 0000h. After that the program can be run in tab 7.","Start with a ready-made example: open it, read the comments, run it step by step. Then change the numbers or instructions (using the reference in tab 6) and see what changes."]}],syntaxTitle:"Syntax rules",syntax:["`LABEL:  INSTRUCTION  operands   ; comment` — the label and comment are optional.","**Label** — a name for an address. Instead of `JMP 0004h` you can write `JMP LOOP`, and the assembler will substitute the address of the line with the label `LOOP:`.","**Numbers**: 25 (decimal), 19h or 0F0h (hexadecimal; starts with a digit), 1010b (binary), 'A' (character code).","**ORG** and **DB** are not processor instructions but **directives**: instructions to the assembler itself. They have no machine code. `ORG address` — the address from which to place the following lines (in the examples, data starts with `ORG 0080h`). `DB` — write data bytes to memory: `DB 25, 17`, `DB 'HELLO', 0`.","**Simulator memory is 256 bytes**: program — in 0000–007Fh, data — from 0080h, the stack grows down from 0100h (cells 00E0–00FFh).","Everything after the semicolon `;` is a comment; the processor doesn't see it."],supported:"Instructions the simulator understands",templates:"Ready-made examples",open:"Open in the editor",run:"Run in tab 7",commands:"Instructions",title:"Editor",assemble:"Assemble",assembleRun:"Assemble and run →",errors:"Errors",ok:"No errors — the program is loaded into memory.",line:"Line",listing:"Assembly result",kbdNote:"For the IN 00h instruction, set the text of “pressed keys” in tab 7 — in the “Keyboard” field under the diagram.",openNote:"“Open in the editor” replaces the editor text with the example. “Run” loads the example and goes straight to tab 7.",tryLabel:"Try this:",presetInfo:{copy:["Constants and copying","A first look: a constant is loaded into a register and copied between registers. Notice that copying doesn't “move” the data."],add:["Adding two numbers","The classic program pattern: take data from memory, process it, put the result back into memory.","replace 25 with 250. What sum do you get and what happened to the CY flag?"],sub:["Subtraction and flags","5 − 7 gives FEh: that is −2 in two's complement. Watch the CY, S and Z flags.","subtract 5 from 7 — how do the flags change?"],char:["Printing a character","How a byte turns into a letter on the screen: the OUT instruction sends the character code to port 01h.","print your name in Latin letters (MVI A, '…' and OUT 01h for each letter)."],hl:["The HL pointer","Indirect addressing: the cell address is kept in the HL pair and can be changed with INX."],loop:["Counter loop","DCR decrements the counter and sets the Z flag when it reaches zero; JNZ repeats the loop.","compute the sum 1…10. How many instructions will the processor execute?"],mult:["Multiplication by addition","The 8080 has no multiply instruction — we multiply by repeated addition.","multiply 20 by 15. Why is the result wrong? (hint: 300 > 255)"],string:["Printing a string","A loop over a string up to the 00h byte: pointer, compare, conditional jump.","delete the 0 at the end of the string. What will the program print and why?"],upper:["Lowercase → uppercase","A logical AND with the mask 0DFh clears bit 5 — the difference between a lowercase and an uppercase letter."],stack:["Stack PUSH / POP","Pair BC is saved on the stack, “spoiled” and restored into DE. Watch SP and cells 00FEh–00FFh.","save two pairs in a row and pop them — in what order do they come back?"],call:["Subroutine CALL / RET","One subroutine is called twice; the return address is saved on the stack each time."],echo:["Keyboard → screen","I/O through ports: IN reads a key code (port 00h), OUT prints it on the screen (port 01h)."],carry:["Overflow and CY","The sum doesn't fit in a byte — the processor reports this with the CY flag, and the program reacts with a JC jump."],data:["Data or instruction?","A program without HLT: the processor “executes” data. A byte becomes an instruction if PC reaches it."]}},// ================= Tab 9. 8086 =================
emu:{intro:[{h:"From 8080 to 8086",p:["The **8086** processor (1978) is the 16-bit successor of the 8080. Intel designed it so that 8080 programs could be rewritten almost mechanically: the 8080 registers became 8-bit halves of the 8086 registers; arithmetic, compares, jumps, subroutines and the stack (ADD, SUB, CMP, JMP, JZ, CALL, RET, PUSH, POP, IN, OUT, HLT) kept their names and meaning, and all the transfer instructions merged into one — MOV. The 8086 also has IN and OUT, but in EMU8086 the keyboard and screen are not connected to our course ports 00h and 01h, so characters are input and output through DOS (see below).","But **the 8086 machine codes are completely different**: an 8080 program cannot run on the 8086 as is — it must be rewritten in 8086 assembly. On the other hand, everything you studied in this course — bytes, codes, registers, flags, the stack, instruction fetch and execution — works the same way in the 8086. So you can confidently move on to the **EMU8086** emulator.","The 8086 registers are 16-bit, and each splits into two halves: **AX = AH:AL**, where H is the high half and L is the low half. So pair BC becomes CX, and its parts: B → CH (high byte), C → CL (low byte). The pair letters don't match on purpose: in the 8086, CX is the loop counter, like pair BC before, and BX is the memory pointer, like pair HL. The other registers and flags in the table below that the 8080 doesn't have (segments, BP, SI, DI, OF, DF, IF, TF) you will study in EMU8086."]}],compareTitle:"Processor comparison",compareHead:["","8080","8086"],compare:[["Year released","1974","1978"],["Data width","8 bits","16 bits"],["Address bus","16 lines → 64 KB","20 lines → 1 MB (memory is divided into 64 KB segments)"],["General-purpose registers","A, B, C, D, E, H, L (8 bits)","AX, BX, CX, DX (16 bits = two halves: AH/AL…)"],["Pointers","SP, PC, HL","SP, BP, SI, DI, IP + segment CS, DS, SS, ES"],["Multiply and divide","none, done in software","yes: MUL, IMUL, DIV, IDIV"],["Flags","S Z AC P CY","SF ZF AF PF CF + OF, DF, IF, TF"],["Clock frequency","2 MHz","5–10 MHz"]],regTitle:"Register mapping",regs:[["A","AL"],["B, C","CH, CL (pair BC → CX)"],["D, E","DH, DL (pair DE → DX)"],["H, L","BH, BL (pair HL → BX)"],["PC","IP"],["SP","SP"],["Flags S Z AC P CY","SF ZF AF PF CF"]],cmdTitle:"Instruction mapping",head:["8080","8086 (EMU8086)","Meaning"],cmds:[["MVI A, 5","MOV AL, 5","constant → register"],["MOV B, A","MOV CH, AL","register → register"],["LDA NUM1","MOV AL, [NUM1]","memory → register"],["STA SUM","MOV [SUM], AL","register → memory"],["LXI H, MSG","MOV BX, OFFSET MSG","address → pointer (OFFSET — “address of the label”)"],["MOV A, M","MOV AL, [BX]","memory via pointer"],["ADD B","ADD AL, CH","addition"],["SUI 7","SUB AL, 7","subtract a constant"],["CPI 0","CMP AL, 0","compare"],["ANI 0DFh","AND AL, 0DFh","logical AND"],["INR A / DCR B","INC AL / DEC CH","±1"],["INX H","INC BX","next cell"],["JMP / JZ / JNZ / JC","JMP / JZ / JNZ / JC","jumps"],["CALL / RET","CALL / RET","subroutines"],["PUSH B / POP B","PUSH CX / POP CX","stack (16-bit registers in the 8086)"],["OUT 01h","MOV DL, AL\nMOV AH, 2\nINT 21h","print a character on the screen via DOS"],["IN 00h","MOV AH, 1\nINT 21h","read a character from the keyboard via DOS (code in AL)"],["HLT","HLT (or RET / INT 20h)","end of program"]],exTitle:"One program — two processors",exNote:"In EMU8086 a simple program (.COM format) starts with the ORG 100h directive and ends with the RET instruction. Data is placed after the code; data labels are written without a colon, instruction labels with a colon.",dosTitle:"What is INT 21h",dos:"Computers with the 8086 ran the DOS operating system. It has ready-made subroutines for input and output; they are called with INT 21h — a software interrupt: an instruction similar to RST that calls a subroutine by number (not to be confused with the INT signal from tab 5). The number of the needed function goes into register AH: 1 — read a character from the keyboard (the code ends up in AL), 2 — print the character in DL on the screen. DOS loads a simple .COM program at address 100h (it uses the first 256 bytes itself) and calls it like a subroutine, so the RET at the end returns control to DOS.",runTitle:"How to run the example in EMU8086",run:["Open EMU8086 and create a new file (COM template).","Copy the code on the right into it.","Press “emulate”, then “single step” — run the program one instruction at a time, like in tab 7.","In the emulator window, press “vars” to open the variables: after execution sum = 42."],ex8080:`; 8080: adding two numbers
      LDA  NUM1
      MOV  B, A
      LDA  NUM2
      ADD  B
      STA  SUM
      HLT
      ORG  0080h
NUM1:   DB   25
NUM2:   DB   17
SUM:    DB   0`,ex8086:`; 8086 (EMU8086): the same thing
org 100h
      mov  al, [num1]
      mov  ch, al
      mov  al, [num2]
      add  al, ch
      mov  [sum], al
      ret
num1    db   25
num2    db   17
sum     db   0`}});Object.assign(ui.en,{// ================= Tab 1. Numbers and data =================
numbers:{startH:"Where it all begins",startP:["A logic gate distinguishes only two states: **0** (low level) and **1** (high level). A flip-flop stores one such value, and several flip-flops form a **register**. The processor is a large digital circuit, and everything it works with (numbers, letters, instructions) is stored as sets of zeros and ones."],anatomyTitle:"What a binary number is made of",anatomyHint:"Click a term — it will be highlighted in the diagram. Click the bits to change the number.",terms:[["bit","Bit","one binary digit: 0 or 1. That is what one flip-flop stores."],["pos","Bit position","the place of a bit. Numbered right to left from 0; each position has its own weight."],["msb","Most / least significant bit","the leftmost (MSB, largest weight) and the rightmost (LSB, weight 1)."],["nib","Nibble","4 bits = one hexadecimal digit."],["byte","Byte","8 bits — the basic unit of data for the 8080: it stores and transfers everything in 8-bit portions."],["word","Word","on the 8080 — 16 bits = 2 bytes."],["width","Bit width","how many bits are reserved for a number. It determines which numbers will fit."]],weight:"weight",sysH:"Number systems",sysP:["In a **positional** system the value of a digit depends on its place: each position “weighs” **base** times more than its neighbour on the right. The decimal system has base 10, binary — 2, hexadecimal (hex) — 16 (digits 0…9, A…F)."],sysNote:"Notation: 1011b — binary, B6h — hexadecimal (if it starts with a letter, programs write 0B6h), 182 — decimal. Sometimes you will see 0xB6.",tableTitle:"The same numbers in different systems",tableHint:"Click a row — the number goes to the converter on the right.",baseNames:{2:"binary",3:"ternary",4:"quaternary",8:"octal",10:"decimal",16:"hexadecimal"},conv:{title:"Converter: one number in all systems",hint:"Enter a number (200, −5, 0C8h, 11001000b), move the slider or click the bits.",width:"Bit width",bitsWord:"bits",signed:"signed (two's complement — see below)"},posTitle:"How positional notation works",posHint:"Choose a base and click the digits (each click adds 1). Below you can see how the number is built from digits and weights.",base:"Base",digitClick:"digit",reset:"Reset",posNote:b=>`Each position weighs ${b} times more than its neighbour on the right. The system has exactly ${b} digits: from 0 to ${b===16?"F (15)":b-1}.`,xTitle:"Converting from one system to another",xHint:"Left — the original number, center — its binary form, right — the result. Colors show which bits became which digit.",from:"From base",to:"To base",number:"Number",bad:"The number contains digits that do not exist in this system.",bitsPer:"bits per digit",viaGroups:(b,k)=>`Base ${b} = 2${sup(k)}: each digit is exactly ${k} bit${k===1?"":"s"}. We convert in groups.`,viaSum:b=>`Base ${b} is not a power of two, so there are no bit groups. First we compute the number (sum of digit × weight), then divide by the new base.`,viaDiv:b=>`Divide by ${b}, read the remainders from bottom to top:`,divHead:["Dividend","quotient","remainder"],bitsTable:"How many bits one digit needs",bitsTableNote:"For 3 and 10 the number of bits is not whole — so their digits cannot be “cut” out of the binary form, while hex and octal digits can.",fmtTitle:"Number formats: what fits in n bits",fmtHint:"The same bits can be used for different formats. Choose a bit width and compare range and precision. This is an overview: each format is explained in detail further down this tab.",fmtHead:["Format","How it is built","Minimum","Maximum","Precision (step)"],fmtRows:{u:"Unsigned integer",s:"Signed integer",x:"Fixed-point",f:"Floating-point"},fmtHow:{u:"all bits are weights of the number",s:"the top bit is the sign (two's complement)",x:(i,f)=>`${i} integer bit${i===1?"":"s"} + ${f} fraction bit${f===1?"":"s"}, signed`,f:(e,m)=>`1 sign bit + ${e} exponent bits + ${m} mantissa bits`},fmtStep1:"1",fmtRel:d=>`≈ ${d} significant decimal digits`,fmtNote:"The larger the range, the lower the precision: floating-point has a huge range but keeps only a few significant digits. In hardware the 8080 has only 8-bit (and partly 16-bit) integers — other formats are handled by programs.",uH:"Unsigned integers",uP:["All bits are weights of the number. n bits hold numbers from 0 to 2ⁿ − 1. If you add 1 to the largest number, a carry “falls out” and the result starts again from zero — like a mechanical odometer. The processor keeps the bit that fell out in the carry flag **CY**."],wheelTitle:"Number ring (4 bits)",wheelHint:"Turn the ring with the ±1 buttons. Outside — unsigned values, inside — signed. Going over 15 → 0 is a carry (CY), over 7 → −8 is a signed overflow.",wheelCarry:"carry! CY = 1",wheelOvf:"signed overflow",sH:"Negative numbers",sP:["Bits have no minus sign, so the sign is also encoded by a bit — the **most significant** one. There are three ways; processors, including the 8080, use **two's complement**: with it, addition and subtraction are done by the same adder circuit as for unsigned numbers, and zero has only one representation. An easy way to read two's complement: the top bit weighs not +128 but **−128** (−32768 in 16 bits), the other bits as usual."],sLabTitle:"Enter a number — and see its codes",sLabHint:"You can enter positive and negative numbers. The red bit is the sign bit.",codeNames:{direct:"Sign-magnitude",ones:"One's complement",twos:"Two's complement"},codeHow:{direct:"sign + magnitude",ones:"for negatives — all bits of the magnitude inverted",twos:"one's complement + 1 (used by the 8080)"},posNum:"positive",negNum:"negative",outOfRange:"does not fit",howTwos:"How to get the two's complement of a negative number",howSteps:["magnitude of the number","invert all bits","add 1"],rangeTitle:"Integer ranges",rangeHead:["Bit width","Unsigned","Signed (two's complement)"],fxH:"Fractions: fixed-point",fxP:["The programmer agrees on where the binary point is. Bits to its right weigh 1/2, 1/4, 1/8… The point itself is not stored anywhere — only in the program's logic. The further right the point, the larger the range and the lower the precision — and vice versa."],fxTableTitle:"Where to put the point",fxTableHint:"Choose a bit width; click a row to view it in the lab below.",fxHead:["Fraction bits","Notation","Unsigned: min … max","Signed: min … max","Step (precision)"],fxLab:"Fixed-point lab",fxPoint:"Point position (fraction bits)",fxAsU:"as an unsigned fraction",fxAsS:"as a signed fraction",fxSignNote:w=>`When read as signed, the top bit weighs −${w} instead of +${w} — so the two results differ when it is 1.`,flH:"Fractions: floating-point",flP:["A number is stored as a **sign**, an **exponent** (power of two) and a **mantissa** (significant digits) — the binary version of writing 2.5 = 1.25·2¹. This way the same bits can hold both very large and very small numbers, but only with a limited number of significant digits."],flTableTitle:"Common formats",flHead:["Format","Bits: sign + exponent + mantissa","Exponent bias","Maximum","Min. normal","Precision"],flNames:{8:"float8 (educational, IEEE rules)",16:"float16 (half)",32:"float32 (float, single)",64:"float64 (double)"},flLab:"Floating-point lab",flInput:"Decimal number",flStored:"Stored exactly",flErr:"Rounding error",flFormula:"value = (−1)^sign · 1.mantissa · 2^(exponent − bias)",flNotes:bias=>[`**Exponent bias.** The exponent is stored shifted by +${bias} so that no sign bit is needed: the stored number ${bias} means power 0, smaller ones mean negative powers.`,"**Hidden one.** In a normal number the mantissa always starts with “1.”, so this one is not stored — it is implied. This saves one bit.","**Min. normal** is the smallest positive number that still has the hidden one. Smaller numbers are stored without it (subnormal) and with less precision."],flSpecial:{inf:"infinity (exponent — all ones)",nan:"not a number (NaN)",sub:"subnormal (exponent = 0: no hidden one)",zero:"zero"},sign:"sign",exp:"exponent",mant:"mantissa",bytesMem:"Bytes in memory (least significant first)",interp:{h:"Can you tell from the code what kind of data it is?",p:["Let's take one byte and read it through different “eyes”."],labTitle:"One byte — six readings",labHint:"Move the slider or click the bits.",rows:{unsigned:"Unsigned integer",signed:"Signed integer",fixed:"Fixed-point (4 fraction bits)",bcd:"BCD: each nibble is one decimal digit",char:"ASCII character (tab 2)",cmd:"8080 processor instruction (tab 3)"},bcdBad:"invalid: nibble greater than 9",noChar:"control character, not printable",answerH:"Answer: no.",answer:"A byte has no label saying “I am a number” or “I am a letter”. **The meaning of data is determined by the program** — by which instruction works with that byte. The processor checks nothing: it will add two letter codes just as happily as two numbers."},arith:{h:"Binary arithmetic",p:["Addition is done in columns: 1 + 1 = 10, that is, 0 and a carry into the next position (this is how an adder works). The processor does subtraction by addition: A − B = A + (−B). The 8080 has **no** multiplication or division — programs perform them. After an operation the processor sets **flags** — properties of the result (to the right of the calculation)."],title:"Lab: 8- and 16-bit arithmetic",a:"A",b:"B",ops:{add:"Addition",sub:"Subtraction",mul:"Multiplication",div:"Division"},carryRow:"carries",carryNote:"a carry is written above the position it goes into",colHead:"unsigned / signed",negTitle:"How −B was obtained",negSteps:["B","invert all bits","+1 → this is −B"],flags:"Flags",flagExpl:{CY:"carry out of the top bit (borrow in subtraction)",Z:"the result is zero",S:"top (sign) bit of the result",P:"even number of ones in the result",AC:"carry from bit 3 into bit 4"},vFlag:"V — signed overflow (the 8080 has no such flag)",ovfText:(a,b,r,op)=>`If the numbers are treated as signed: ${a} ${op} ${b} = ${op==="+"?a+b:a-b}, which is outside −128…127. The result “wrapped around” and reads as ${r}.`,subNoBorrow:"In subtraction the processor stores the carry-out in CY inverted: a carry of 1 (the red one on the left) means “there was no borrow”, so CY = 0. The result is positive.",subBorrow:"There was no carry out of the top bit — so a “borrow” was needed: A is less than B, CY = 1. As unsigned the result is wrong, but as signed it is a negative number in two's complement.",carryOut:n=>`The result ${n} does not fit in a byte: the ninth bit went into the CY flag.`,mulExpl:["We multiply in columns, as at school, but it is simpler: the digits of multiplier B are only 0 or 1.","For each position of B we write a row: if the digit is 1 — a copy of A, if 0 — zeros. Each next row is shifted one position to the left (as at school — one cell).","Add up all the rows. A left shift by k positions = multiplication by 2ᵏ, so the processor can multiply using shifts and additions."],mulRow:(i,on)=>on?`multiplier bit ${i} = 1 → A, shift by ${i}`:`bit ${i} = 0 → zeros`,mulResult:"Product (up to 16 bits)",divExpl:["We do long division, as at school. In binary each digit of the quotient is 0 or 1: the divisor either fits into the current remainder (write 1 and subtract) or it does not (write 0).","Go through the digits of the dividend from left to right: bring down the next digit, compare the remainder with the divisor, subtract if needed."],divQuot:"quotient",divRem:"remainder",divCheck:"Check",divSteps:"All steps in order",divHead:["Dividend digit","Remainder after bring-down","≥ divisor?","Quotient digit","Remainder"],yes:"yes",no:"no",divZero:"Division by zero is not allowed.",simLink:"See how the processor does it (tab 7)"}}});Object.assign(ui.en,{// ================= Tab 2. Characters and encodings =================
enc:{introH:"Letters are numbers too",introP:["The processor stores only numbers. So every character is assigned a number — a **code**, and the “character ↔ code” table is called an **encoding**. There are no letters inside a computer: the keyboard sends a code, and the screen draws a letter from the code."],pipe:[["⌨","A key is pressed","“A”"],["🔢","The keyboard sends a code","41h = 65"],["💾","A byte in memory","0100 0001"],["🖥","The screen draws by code","“A”"]],hexTitle:"Why 41h = 65: the 0…255 table",hexHint:"Row — the high hex digit, column — the low one. Each cell holds the decimal value. Click a cell or a character on the right.",hexFormula:(h,l,n)=>{const H=h.toString(16).toUpperCase();const Lo=l.toString(16).toUpperCase();const mid=h>9||l>9?` = ${H} · 16 + ${Lo}`:"";return`${H}${Lo}h${mid} = ${h} · 16 + ${l} = ${h*16} + ${l} = ${n}`;},cpTitle:"Code pages",hexDimNote:"Pale rows 8–F are codes 80h–FFh: ASCII does not have them, they are taken by national tables (below).",uniLowByte:b=>`A Unicode code is larger than a byte, so the table on the left highlights only its low byte (${b}h); the full conversion is in the formula above.`,cpHint:"Choose a table. Row — the high hex digit of the code, column — the low one: the character in row 4, column 1 has code 41h.",tables:{ascii:"ASCII",cp1251:"Windows-1251",cp866:"CP866 (DOS)",koi8:"KOI8-R",unicode:"Unicode (Cyrillic)"},tableAbout:{ascii:"The basic Latin table (1963), 128 codes, 7 bits. It is used by programs for the 8080 and EMU8086.",cp1251:"Windows Cyrillic. Codes 00–7Fh are the same as in ASCII, Cyrillic (Russian) letters are C0–FFh in alphabetical order.",cp866:"DOS Cyrillic. Cyrillic (Russian) letters are split into pieces: А–п — 80–AFh, р–я — E0–EFh; in between are box-drawing characters for windows.",koi8:"Unix Cyrillic. Letters are placed so that if the high bit is lost, “П” becomes “p”: the text stays readable in Latin letters.",unicode:"A single numbering of all the world’s characters (codes up to 10FFFFh). Shown is the Cyrillic block 0400–04FFh. In memory these codes are most often stored in UTF-8."},groups:{ctrl:"control",digit:"digit",upper:"Latin uppercase",lower:"Latin lowercase",space:"space",punct:"symbol",cyr:"Cyrillic",other:"other character",none:"not used"},sel:{char:"Character",code:"Code",group:"Group",ctrlName:"Purpose",utf8:"UTF-8 bytes",cp:"Code point"},utf8How:"How a code turns into UTF-8 bytes",utf8Note:"The code bits are laid out by a template: the first byte starts with 110, the second with 10. This way a program immediately sees where a character starts and how many bytes it has.",caseBtn:"Toggle bit 5 (uppercase ↔ lowercase)",ctrlNote:"Grey cells are control codes 00–1Fh and 7Fh: they are not drawn, they control the device. You don’t need to memorize them; the important ones are LF 0Ah (line feed), CR 0Dh (carriage return — the print head goes back to the start of the line), NUL 00h (often the end of text in memory). SP 20h is a space.",lawsH:"Useful patterns",law1T:"A digit is not a number",law1:"The character “7” is code 37h, the number 7 is 07h. The difference is exactly 30h: to get the value of a digit, subtract 30h from its code.",law2T:"Uppercase and lowercase — one bit",law2:"“A” and “a” differ only in bit 5 (weight 20h). By clearing it (logical AND with the mask 1101 1111b), a program makes a letter uppercase.",law3T:"Letters go in alphabetical order",law3:"Codes grow along with the alphabet, so words can be sorted by comparing codes. But all uppercase letters come before lowercase: “Z” (5Ah) < “a” (61h).",cyrH:"One letter — different codes",cyrP:["ASCII has no Cyrillic, so 8-bit tables appeared where Cyrillic (Russian) letters took codes 80–FFh — each company in its own way. If text is written in one table and read in another, you get garbled text (“mojibake”). The solution is **Unicode**: each character has one number, and in memory it is written in **UTF-8** (Latin — 1 byte, as in ASCII; Cyrillic — 2 bytes)."],letter:"Letter",letterHint:"type any letter — Cyrillic or Latin",kindCyr:"Cyrillic",kindLat:"Latin (ASCII)",kindOther:"other character",bytesWord:n=>n===1?"byte":"bytes",pairs:[["C","С","C (Latin) and С (Cyrillic)"],["A","А","A (Latin) and А (Cyrillic)"],["P","Р","P (Latin) and Р (Cyrillic)"],["Ц","ц","Ц and ц"],["A","a","A and a"]],cmpDiff:"The letters look the same, but they are different characters with different codes. For a computer, Latin “C” and Cyrillic “С” are as different as “C” and “Ж”: searching for a word typed in the wrong keyboard layout finds nothing.",cmpNote:"Compare the rows: highlighted are the encodings in which the two characters have the same code.",uniNote:"U+041F is the character’s number in Unicode (code point). UTF-8 lays out its bits by the template 110xxxxx 10xxxxxx — that is why a Cyrillic letter takes 2 bytes (details in the Unicode table above).",oneLetterHead:["Table","Code","Binary","Bytes"],convTitle:"Text → bytes → text",convHint:"Enter text and choose an encoding. Under each character are its bytes in hex; SP is a space. Click a character to find it in the code table above. Below are the same bytes read in other encodings (· — control code, � — a byte that is not a character).",text:"Text",encoding:"Write encoding",read:"The same bytes read as…",cant:"not in the table",total:n=>`Total bytes: ${n}`,showInTable:"show in table ↑",summary:"Summary: programs for the 8080 and EMU8086 use ASCII — one character takes one byte. Text in memory is a chain of codes (a **string**); its end is marked with code 00h (in DOS — with the “$” sign). Don’t confuse it with line feed 0Ah — it only moves text to a new line on the screen."},// ================= Tab 3. Instructions =================
cmd:{progH:"The processor runs a program",progP:["A **processor** is a circuit that executes **instructions** one by one: copy a byte, add, compare, jump. A **program** is a sequence of instructions; it lies in **memory** (a row of numbered 1-byte cells) just like data. The address of the next instruction is held in the **PC** register — the program counter."],progHint:"Click “Execute instruction”: the processor executes the instruction PC points to, and PC moves to the next one. Note that instructions have different lengths. All numbers are in hex.",progNext:"Execute instruction ▶",progReset:"Restart",progLabels:{mem:"Memory",addr:"address",cpu:"Processor",pc:"PC — address of the instruction to be executed next",done:"Just executed",next:"Next (PC points to it)",stopped:"processor halted",screen:"Screen"},progItems:[["MVI A, 03h","load the number 3 into A"],["MOV B, A","copy A to B"],["ADD B","A ← A + B (3 + 3 = 6)"],["ADI 30h","A ← A + 30h: number 6 → code of character “6”"],["OUT 01h","output A to the screen"],["HLT","halt"]],anatH:"Anatomy of an instruction",anatP:["The same instruction in two forms: text for a human (assembly language) and bytes for the processor (machine code). Choose an example."],anatLabels:{asm:"Assembly language — for a human",assembler:"the assembler translates",code:"Machine code — for the processor",opcode:"opcode",operand:"operand",bits:"Opcode bits (first byte)",mnem:"mnemonic"},anat:[{asm:[["MVI","mn"],[" A","o1"],[", 05h","o2"]],bytes:[0x3e,0x05],roles:["Opcode: “load a constant into register A”","operand: constant 5"],fields:[["00","op","“load…”"],["111","dst","where: A"],["110","op","“…a constant from the next byte”"]],note:"MVI = Move Immediate: “move an immediate value”. The number 5 is written right in the instruction."},{asm:[["MOV","mn"],[" B","o1"],[", A","o2"]],bytes:[0x47],roles:["Opcode: everything in one byte"],fields:[["01","op","move"],["000","dst","where: B"],["111","src","from: A"]],note:"Both registers are encoded as fields inside the opcode — that is why the instruction takes only 1 byte. The destination is written first: B ← A."},{asm:[["LDA","mn"],[" 0081h","o2"]],bytes:[0x3a,0x81,0x00],roles:["Opcode: “load A from memory”","low byte of the address","high byte of the address"],fields:[["00111010","op","LDA — the whole byte defines the instruction"]],note:"The address 0081h takes 2 bytes; in memory it is stored low byte first: 81h, then 00h."},{asm:[["ADD","mn"],[" B","o1"]],bytes:[0x80],roles:["Opcode: “add register B to A”"],fields:[["10000","op","add to A"],["000","src","what to add: B"]],note:"The first operand of addition is always the accumulator A, so only the second one is given in the instruction."},{asm:[["JMP","mn"],[" 0000h","o2"]],bytes:[0xc3,0x00,0x00],roles:["Opcode: “jump”","low byte of the address","high byte of the address"],fields:[["11000011","op","JMP — unconditional jump"]],note:"A jump simply writes the address 0000h into PC — the next instruction will be read from there."}],termsH:"Key concepts",terms:[["prog","Program","a sequence of instructions in memory."],["code","Machine code","an instruction as bytes the processor understands: 3Eh 05h."],["opcode","Opcode","the first byte of an instruction: from it the processor learns **what** to do and how many more bytes to read."],["operand","Operand","**what** the action works on: a number, a register, a memory cell, a port."],["mnem","Mnemonic","a short word instead of a code: MVI, MOV, ADD, JMP."],["asm","Assembler","a language written in mnemonics (1 line = 1 instruction) and the program that translates it into machine code."],["reg","Register","a cell inside the processor made of flip-flops — the fastest memory. The 8080 has: A, B, C, D, E, H, L."],["acc","Accumulator A","the main register: the first number in arithmetic and the place for the result."],["pair","Register pair","two registers as one 16-bit number: BC, DE, HL. HL usually holds an address; the cell at that address is denoted **M**."],["mem","Memory and address","a row of 1-byte cells; an address is the cell number (16 bits). Details in tab 4."],["pc","Program counter PC","the register holding the address of the next instruction."],["flags","Flags","one-bit indicators of the result: CY — carry, Z — zero, S — sign…"],["port","Port","a device number. In the model: 00h — keyboard, 01h — screen."]],srcH:"Where an instruction gets its operand",srcs:[{ex:"MVI A, 5",from:"from the instruction itself",kind:"imm"},{ex:"MOV B, A",from:"from a register",kind:"reg"},{ex:"LDA 0080h",from:"from memory at an address",kind:"mem"},{ex:"IN 00h",from:"from a device (port)",kind:"port"}],orderNote:"In `MOV B, A` the **destination** is written first and the **source** second: “B ← A”. Almost all 8080 and 8086 instructions work this way.",fmtH:"8080 instruction formats",fmtP:"An instruction takes 1, 2 or 3 bytes. The first byte is always the opcode: after reading it, the processor knows how many more bytes to read.",formats:[{n:1,what:"opcode only — everything needed is “built into” it",ex:[["MOV B, A",[0x47]],["ADD B",[0x80]],["HLT",[0x76]]],parts:["opcode"]},{n:2,what:"opcode + a data byte (constant) or a port number",ex:[["MVI A, 05h",[0x3e,0x05]],["OUT 01h",[0xd3,0x01]]],parts:["opcode","data / port"]},{n:3,what:"opcode + a 16-bit address or constant: low byte first, then high byte",ex:[["LDA 0081h",[0x3a,0x81,0x00]],["JMP 0104h",[0xc3,0x04,0x01]]],parts:["opcode","low byte","high byte"]}],byteWord:n=>`${n} byte${n===1?"":"s"}`,littleEndian:"“Low byte first” (little-endian) — this is what the 8080 designers chose; the order was inherited by the 8086 and modern x86. The address 0081h is written as bytes 81h 00h.",fields:{h:"Fields inside the opcode",p:["The opcode bits are divided into **fields**: fixed bits (digits) tell which instruction it is, and letter fields tell which operands. For `MOV r1, r2` the code is 01 DDD SSS: DDD is the destination number, SSS the source. Three bits give 8 options: A, B, C, D, E, H, L and M."],regs:"Register codes (DDD and SSS fields)",pairs:"Register pair codes (RP field)",conds:"Condition codes (CCC field)",condNote:"Conditions test the flags. Here M means “minus” — not to be confused with the memory cell M.",usage:"The RP field appears in instructions with 16-bit pairs (LXI, INX, PUSH, POP); the CCC field in conditional jump instructions (JZ, JNZ…). SP and the stack — tab 4.",condDesc:{NZ:"not zero (Z=0)",Z:"zero (Z=1)",NC:"no carry (CY=0)",C:"carry (CY=1)",PO:"parity odd (P=0)",PE:"parity even (P=1)",P:"plus (S=0)",M:"minus (S=1)"}},lab:{title:"Encoding and decoding an instruction",encTitle:"Assembler → machine code",encHint:"Choose an instruction and operands to get its bytes. Numbers are decimal (25) or hex (19h); bytes are always in hex, so 25 becomes 19.",decTitle:"Machine code → assembler",decHint:"Click the bits or move the slider — the decoder will tell you which instruction this byte encodes.",template:"Instruction",reg1:"Destination",reg2:"Source",reg:"Register",pair:"Pair",value:"Number",addr:"Address",port:"Port",cond:"Condition",bytesLabel:"Bytes in memory",unused:"This code is not used in the 8080 (undocumented).",len:"Length",group:"Group"},exH:"How the processor executes an instruction",exP:["Every instruction goes through the same stages — this is the **instruction cycle**. Below, a small program runs one instruction at a time, and each instruction stage by stage. Click “Stage ▶” and watch what changes in memory and in the processor."],stages:{fetch:["Fetch","the processor reads the byte at the address in PC into the instruction register IR; PC + 1"],decode:["Decode","the decoder analyzes the code bits: which instruction, which operands, how many more bytes to read"],operand:["Operand read","if the instruction is longer than 1 byte, its next bytes are read (constant, address, port); PC + 1 for each"],exec:["Execute","the action itself is performed: move, add, jump, output"],next:["Next instruction","PC already points to the next instruction — the cycle repeats"]},cycleCenter:["Instruction","cycle"],ex:{prev:"◀ Stage",next:"Stage ▶",restart:"Restart",cmdList:"Program",mem:"Memory",cpu:"Processor",decoder:"Decoder",bus:"Bus transfer",busA:"address",busD:"data",idle:"—",busNote:"A bus is a group of wires between the processor and memory: on the address bus the processor sends the cell number, on the data bus the byte itself travels (details in tab 5).",done:"The program is finished. Click “Restart” to run it again.",waitDecode:"waiting: the byte is still being read"},exText:{fetch:(pc,op,pc1)=>`**Fetch.** PC = ${pc}: the processor puts this address on the address bus and reads the byte **${op}** from memory. The byte goes into the instruction register IR. For now it is just a number — what it means, the processor will find out at the next stage. PC is incremented right away: ${pc1}.`,decode:["**Decode.** The decoder looks at the bits 3Eh = 00 111 110. The pattern 00 ··· 110 means MVI — “load a constant into a register”; field 111 is register A. The decoder’s conclusion: “a 2-byte instruction — one more byte must be read, and that will be the number”.","**Decode.** 47h = 01 000 111. The prefix 01 means a MOV move; field 000 is destination B, field 111 is source A. All the information is already in one byte — nothing more needs to be read.","**Decode.** 80h = 10000 000. The prefix 10000 means “add to A”; field 000 is the second addend, register B. A one-byte instruction.","**Decode.** 3Ah = 0011 1010 is LDA, “load A from memory”. The decoder knows: LDA has 2 more bytes — the cell address. They must be read before executing the instruction.","**Decode.** C3h = 1100 0011 is JMP, “jump”. The opcode is followed by 2 bytes of the jump address."],operand:[(j,addr,v,pc1)=>`**Operand read.** The processor reads the next byte of the instruction at address ${addr}: it is **${v}** — the number 5 to be loaded. PC = ${pc1}.`,()=>"",()=>"",(j,addr,v,pc1)=>j===1?`**Operand read.** Byte at address ${addr}: **${v}** — the low byte of the cell address. PC = ${pc1}.`:`**Operand read.** Byte at address ${addr}: **${v}** — the high byte. Now the processor knows the whole address: 0081h. PC = ${pc1}.`,(j,addr,v,pc1)=>j===1?`**Operand read.** Byte at address ${addr}: **${v}** — the low byte of the jump address. PC = ${pc1}.`:`**Operand read.** Byte at address ${addr}: **${v}** — the high byte. Jump address: 0000h.`],exec:["**Execute.** The number read, 05h, is written into register A. Memory is no longer needed — everything has been read.","**Execute.** The value of A (05h) is copied into B. It also stays in A — copying does not “move” data.","**Execute.** The arithmetic logic unit adds A and B: 5 + 5 = 10 (0Ah). The result is written into A, and the flags are updated.","**Execute.** Now the processor accesses **data**: it puts out the address 0081h (taken from the instruction, not from PC) and reads the byte 11h. It goes into A.","**Execute.** The jump address 0000h is written into PC. Nothing else happens — but the next instruction will be read from the start of the program."],next:(pc,jump)=>jump?`**Next instruction.** PC = ${pc}: the program will loop — MVI A, 05h again. This is how loops work.`:`**Next instruction.** The instruction is done. PC = ${pc} already points to the next instruction — the cycle starts again with fetch.`},groupsH:"Instruction groups",groupsP:"All 8080 instructions fall into five groups. The full list is in tab 6; subroutines and the stack — tab 4, interrupts — tab 5."}});ui.en.helper={title:"Number systems",short:"Systems",label:"Open the number systems reference and converter",hint:"While the field is empty, you see a table of numbers 0…20. Enter a number to see it in all systems, its code in a byte, and its neighbors.",placeholder:"216, −40, D8h, 11011000b",clear:"Clear",inBase:"Input base",auto:"auto",bad:"Could not parse the number in the selected base.",width:"Store in",bits:"bits",stored:w=>`Code in a ${w}-bit cell (two's complement, the red bit is the sign bit):`,asU:"read as unsigned",asS:"read as signed",negNote:(m,code)=>`−${m} is stored as ${code}: ${code} = 2ⁿ − ${m}. Check: invert the bits and add 1 — you get ${m}.`,noFit:(w,min,max)=>`${w} bits can hold numbers from ${min} to ${max}.`,tableTitle:"Numbers 0…20 (click a row)",neighbors:"Neighboring numbers",rowClick:"Click a row — the number goes into the input field."};Object.assign(ui.en.numbers,{sysNote:"How the base is written. In math — as a subscript: 1011₂, 102₃, 23₄, 13₈, 11₁₀, B₁₆ (all the same number 11). In assembly — as a letter at the end: 1011b (binary), 13o or 13q (octal), 11 or 11d (decimal), 0Bh (hex; if the number starts with a letter, a 0 is written in front). Base 3 and base 4 have no assembly suffix; for any base there is a notation with the letter r (radix) after the base itself: 3r102 (ternary), 4r23 (quaternary) — as written in Smalltalk; in Common Lisp — #3r102, #4r23. In C/Python: 0b1011, 0o13, 0xB.",notation:{10:"11, 11d",2:"1011b, 1011₂",3:"102₃",4:"23₄",8:"13o, 13₈",16:"0Bh, B₁₆"},numberIs:"Number:",sumLine:"Sum of blocks:",posHint:"Choose a base. Clicking a digit increases it by 1 (right mouse button decreases it). Each block: digit × base to the power of the digit position (the power's value in brackets) = the position's contribution. The blocks are added up.",wheelHint:"Turn the ring with the ±1 buttons. Outside — unsigned values, inside — signed. The flags on the right show what happened on the last step.",wheelIdle:"normal step: no carry, no overflow",wheelCarry:"carry! For unsigned numbers the result did not fit in 4 bits: CY = 1",wheelOvf:"signed overflow! For signed numbers the result jumped 7 ↔ −8: V = 1",wheelCyLbl:"carry: crossing 15 ↔ 0",wheelVLbl:"signed overflow: crossing 7 ↔ −8",wheelBits:"bits",wheelU:"unsigned (outside)",wheelS:"signed (inside)",wheelL1:"- - boundary 15 | 0: carry",wheelL2:"- - boundary 7 | −8: signed overflow"});Object.assign(ui.en.numbers,{fmtHint:"Section summary. The same n bits can hold any of the four formats — only the reading rules differ. Choose a bit width and compare range and step: the larger the range, the coarser the step.",weightCheck:"Check by weights",cmpH:"The same bits — two readings",cmpP:["The code in a cell is one, but the number depends on how it is read. Unsigned, 1111b is 15; signed, it is −1. The processor does not care: it adds the bits the same way, and two flags report what happened at the boundary: **CY** for the unsigned reading, signed overflow for the signed reading."],bcdH:"BCD: decimal digits in nibbles",bcdP:["Sometimes a number is more convenient to store not in binary but **digit by digit**: each nibble holds one decimal digit 0…9 (BCD, binary-coded decimal). This makes it easy to show the number on a display and to count money without rounding errors, but a byte then holds only 0…99 instead of 0…255. The 8080 supports this arithmetic with the **DAA** instruction and the **AC** flag (tab 6)."],bcdLab:"One number — two codes",bcdHint:"Enter a number 0…99 and compare its BCD code with plain binary.",bcdNum:"Number",bcdHead:["Code","Bits","Hex","Read by the processor as unsigned"],bcdRowHow:"each nibble is one decimal digit",bcdBin:"Binary",bcdBinHow:"ordinary unsigned integer",bcdNote:"In BCD the hex notation matches the decimal number (42 → 42h), so it is easy to read in a memory dump. Nibbles A…F are not allowed in BCD."});Object.assign(ui.en.numbers.arith,{inBase:"Enter A and B in base",badIn:"not a number in this base",inByte:"in a byte:",inBits:w=>`in ${w} bits:`,bitsW:"bits",wTitle:m=>`Computation width: 2 to ${m} bits`,cut:(n,v,w,k)=>`${n} = ${v} does not fit in ${w} bits — only the low ${w} bits are used: ${k}. Increase the width.`,wNote:w=>`The 8080 ALU is 8-bit; of 16-bit arithmetic it has only the DAD addition, which changes only the CY flag. Flags for the ${w}-bit result are shown here by the same rules as for a byte.`,checkConv:v=>`Check ${v} in the converter`,carryOut:(sum,r,w=8)=>w===8?`The sum ${sum} does not fit in a byte (max 255): the ninth bit went to the CY flag, and the byte holds ${r} = ${sum} − 256.`:`The sum ${sum} does not fit in ${w} bits (max ${2**w-1}): bit ${w+1} went to the CY flag, and the ${w} bits hold ${r} = ${sum} − ${2**w}.`,ovfText:(a,b,r,op,w=8)=>{const t=op==="+"?a+b:a-b;const h=2**(w-1);return`If the numbers are treated as signed: ${a} ${op} ${b} = ${t}, which is outside −${h}…${h-1}. Why we got ${r}: in two's complement the top bit weighs not +${h} but −${h}. The result ${t>0?"went above":"went below"} the range, and the same ${w} bits read as ${t} ${t>0?"−":"+"} ${2*h} = ${r}. The sign of this error: the sign of the result contradicts the signs of the operands (e.g., the sum of two positive numbers came out negative).`;},readTitle:"How to tell that the result is negative and find its value",read1T:"Step 1. Look at the top (sign) bit — this is the S flag",read1neg:"top bit = 1: the number is negative (in two's complement).",read1pos:"top bit = 0: the number is positive, its value is read as is.",read2T:"Step 2. Find the magnitude: invert all bits and add 1",readRes:"result",readAbs:"magnitude",read3T:"Result",readCy1:(w=8)=>`The CY flag = 1 (borrow) confirms: A is less than B, a 1 had to be “borrowed” from a nonexistent ${w===8?"ninth":`${w+1}${[,"st","nd","rd"][(w+1)%100>>3===1?0:(w+1)%10]||"th"}`} bit position — so the difference is negative.`,readCy0:"The CY flag = 0: there was no borrow, A ≥ B — the difference is non-negative.",readMismatch:(a,b,t,sr,w=8)=>`Here CY and S disagree: if A and B are unsigned numbers, the true difference ${a} − ${b} = ${t} does not fit in a signed ${w===8?"byte":`${w}-bit number`} (−${2**(w-1)}…${2**(w-1)-1}), so the “signed” reading (${sr}) is wrong. Use CY for unsigned numbers and S (together with V) for signed ones.`,mulExpl:["We multiply “in a column”, like at school, but simpler: each digit of multiplier B is only 0 or 1, so each row is either a copy of A or zeros.","**Shifting left by k positions = multiplying by 2ᵏ** — just like appending k zeros in decimal (13 → 130 → 1300). The row for position k is A shifted by k positions, i.e. A·2ᵏ.","Add up all rows. An 8080 program multiplies the same way: it checks the next bit of B, adds the shifted A if it is 1, then shifts — 8 repetitions for a byte."],mulRow:(i,on,a)=>on?`bit ${i} = 1 → A·2${sup(i)} = ${a}·${2**i} = ${a*2**i}`:`bit ${i} = 0 → zeros`,mulSum:(a,b,ones)=>`B = ${b} = ${ones.map(i=>2**i).reverse().join(" + ")}, so A × B = ${ones.map(i=>`${a}·${2**i}`).reverse().join(" + ")} = ${ones.map(i=>a*2**i).reverse().join(" + ")} = ${a*b}`,divExpl:["We use long division, like at school. In binary each digit of the quotient is **0 or 1**: the divisor either fits into the current remainder (write 1 and subtract) or it does not (write 0). No guessing needed — just compare.","Go through the digits of the dividend from left to right: **bring down** the next digit (remainder ×2 + digit), **compare** with the divisor, and **subtract** if needed. An 8080 program divides the same way: shift, compare, subtract — once per bit.","In the end we get an **integer quotient and a remainder**. The exact result of division is usually **fractional** — how to get it is shown below."],divWhat:(a,b)=>`${a} ÷ ${b}: divisor ) dividend`,divHead:["Step","Bring down a digit: remainder·2 + digit","Does the divisor fit?","Quotient digit"],divBring:(before,d,r0)=>`${before}·2 + ${d} = ${r0}`,divYes:(r0,b,r1)=>`yes: ${r0} ≥ ${b}, subtract → ${r1}`,divNo:(r0,b)=>`no: ${r0} < ${b}`,divSteps:"All steps in order",fracTitle:"Where is the fractional part?",fracExact:"The remainder is 0 — the number divides evenly, there is no fractional part.",fracIntro:(rem,b)=>`The remainder ${rem} is less than the divisor ${b}: the integer part is done, but division can continue past the binary point — append zeros (remainder·2) and compare the same way. Each step gives one fraction digit with weight 1/2, 1/4, 1/8…`,fracHead:["Digit weight","Remainder·2","Does the divisor fit?","Digit"],fracExactVal:"exact:",fracNote:"Conclusion: integer division gives a quotient and a remainder. If a fraction is needed, division continues past the point and the result is stored in fixed-point format. Infinite fractions (like 1/3 or 1/7) have to be cut off — hence the rounding error."});Object.assign(ui.en.memt,{addrHint:"Enter an address in hex (e.g. 0081h, C000h, FFFFh) or move the slider: its binary code appears on lines A15…A0. The map on the right shows where this address falls.",mapTitle:"Memory address space map",mapReal:"Example of a real 8080 computer (each machine has its own layout)",mapModel:"Our learning model: only the first 256 bytes are used",mapHint:"Each band is labeled with its “from — to” range. The orange marker is the address selected on the left.",realMap:[["0000h","0FFFh","ROM: startup program (monitor)","rom","4 KB"],["1000h","DFFFh","RAM: programs, data, stack","ram","52 KB"],["E000h","EFFFh","screen video memory (device in memory addresses)","vid","4 KB"],["F000h","FFFFh","not installed","free","4 KB"]],modelMap:[["0000h","007Fh","program instructions","code","128 bytes"],["0080h","00DFh","data (DB)","data","96 bytes"],["00E0h","00FFh","stack (grows down from 0100h)","stk","32 bytes"]],modelRest:"0100h — FFFFh: no memory in the learning model",zoom:"zoomed in: 0000h — 00FFh",inModel:"the address is in the learning memory",outModel:"this address does not exist in the learning model",usedTitle:"Currently loaded program:",usedCode:(a,b,n)=>`instructions — ${a}…${b} (${n} byte${n===1?"":"s"})`,usedData:(a,b,n)=>`data — ${a}…${b} (${n} byte${n===1?"":"s"})`,usedNone:"no data",usedFree:n=>`free for instructions: ${n} byte${n===1?"":"s"}`,wordTitle:"How a 16-bit number (address) is stored in two cells",wordHint:"Why this matters: addresses in LDA, STA, JMP, CALL and LXI constants take 2 bytes. The processor stores them **low byte first**. Enter a 16-bit number in hex (digits 0–9 and letters A–F, e.g. 12AB) — you will see which cell each byte goes into.",wordValue:"Number (hex)",wordAt:"Starting at address",wordBad:"Enter 1 to 4 hex digits: 0–9, A–F.",wordLo:"low byte",wordHi:"high byte",wordCmd:v=>`An address in an instruction is stored the same way: LDA ${v} → 3Ah, then the low and high bytes.`,ioH:"The second address space — I/O ports",ioP:["The 8080 has **two** address spaces. The first is **memory**: 65,536 cells (0000h–FFFFh), accessed by MOV, LDA, STA and other instructions. The second is **I/O ports**: 256 numbers (00h–FFh), accessed by only two instructions — **IN** (read a byte from a port) and **OUT** (write a byte to a port).","The processor puts the port number on the same address bus (on lines A0–A7, with a copy on A8–A15), but at the start of the machine cycle it signals “this is a device transfer”, so memory does not respond — the device with this number does. How this works on the pins is shown in tab 5.","There is another way: place a device **directly in the memory address space** (e.g. screen video memory at E000h–EFFFh on the map above). Then it is used with ordinary memory instructions — this is called memory-mapped I/O."],ioMem:"Memory: 0000h — FFFFh (64 KB)",ioMemCmd:"MOV, LDA, STA, LXI…",ioPorts:"Ports: 00h — FFh (256)",ioPortsCmd:"only IN and OUT",ioOurs:[["00h","keyboard (IN 00h)"],["01h","screen (OUT 01h)"],["02h…FFh","free"]]});Object.assign(ui.en.sys,{pinTitle:"8080 chip pins: the same lines — different roles",pinHint:"Click a pin group — it lights up on the package. The 8080 has 40 pins: 16 for the address and 8 for data.",pinGroups:{addr:["Address A0–A15","outputs: memory cell or port number"],data:["Data D0–D7","bidirectional: read, write and status word"],ctrl:["Control","SYNC, DBIN, WR, READY, WAIT, HOLD, HLDA, INT, INTE, RESET"],clk:["Clock","Φ1, Φ2 — two phases of the clock generator"],pwr:["Power","+5 V, −5 V, +12 V, ground (GND)"]},muxH:"How the same pins work for input, output and status information",muxP:["Pins **D0–D7** are connected to the data bus and play three roles: the processor can **output** a byte (write), **input** a byte (read), and at the start of each machine cycle it outputs the **status word**. The direction is switched by processor signals:"],muxList:["**SYNC = 1** (T1): the processor outputs the **status word** on D0–D7 — a byte where each bit tells what kind of cycle this is: memory read, write, I/O, stack, halt… An external chip (the 8228 system controller) latches it and uses it to generate MEMR, MEMW, I/OR, I/OW.","**DBIN = 1** (T2–T3): the processor outputs are disconnected (tri-state), D0–D7 work as **inputs** — memory or a device puts a byte on the bus, the processor reads it.","**WR = 0** (active low, T2–T3): D0–D7 work as **outputs** — the processor puts a byte on the bus, memory or a device writes it.","Pins **A0–A15** are always outputs: for memory it is the cell address, for IN/OUT — the port number (on A0–A7 with a copy on A8–A15). Whether memory or a device responds is decided by the status word."],muxNote:"The next Intel processor, the 8085, has fewer pins: the lower 8 address lines and the data share the same pins AD0–AD7 and are separated in time by the ALE signal. On the 8080 address and data use different pins, and what is shared in time is the data and the status word.",cycTitle:"Machine cycle by clock cycles: what is on the pins",cycHint:"Choose a cycle type. The diagram shows when D0–D7 carry the status word and when they carry data, and in which direction.",cycTypes:{fetch:"Instruction fetch (M1)",mread:"Memory read",mwrite:"Memory write",sread:"Stack read",swrite:"Stack write",ioread:"Input from port (IN)",iowrite:"Output to port (OUT)",intack:"Interrupt acknowledge",halt:"Halt (HLT)"},swTitle:"Status word of this cycle",swBits:[["D7","MEMR","memory read"],["D6","INP","input from port"],["D5","M1","opcode fetch"],["D4","OUT","output to port"],["D3","HLTA","halt acknowledge"],["D2","STACK","stack access"],["D1","WO̅","0 — write/output, 1 — read/input"],["D0","INTA","interrupt acknowledge"]],swOut:(hex,sig)=>`Status word = ${hex}. The system controller generates the ${sig} signal from it.`,rowsLbl:{sync:"SYNC",data:"D0–D7",dbin:"DBIN",wr:"WR̅",addr:"A0–A15"},dStatus:"status",dIn:"← input to CPU",dOut:"output from CPU →",dFloat:"disconnected",aAddr:"address",aPort:"port number",ioTheoryH:"How the processor works with I/O devices",ioTheoryP:["A device (keyboard, screen, printer) is connected to the buses through a **controller** — a circuit with several registers. Each register is given a **port number**. Usually there are two: a **data register** (bytes pass through it) and a **status register** (it holds “ready”, “busy”, “error” bits).","A **port decoder** on the board compares the number on the address bus with its own and, on a match, connects the register to the data bus — just as the memory decoder selects a cell. There is one difference: it responds only in I/O cycles (the I/OR, I/OW signals).","The **IN port** instruction reads a byte from a device register into accumulator A, and **OUT port** writes A to a device register. The processor has no other actions for devices — all the device “logic” is in its controller."],ioDiagram:{cpu:"Processor",dec:"Port decoder",ctrl:"Keyboard controller",st:["Status register","port 02h (example)"],dt:["Data register","port 00h"],kbd:"Keyboard",a:"address bus: port number",d:"data bus: byte",c:"I/OR, I/OW"},pollH:"Two ways to know that a device is ready",pollA:["Polling","The program reads the status register in a loop: “key pressed?”. If not, it repeats. Simple, but the processor is busy just waiting."],pollB:["Interrupt","The device itself sends the INT signal when it is ready. Meanwhile the processor does other work (the “Interrupt” scenario above)."],pollCode:`WAIT:  IN   02h      ; read the status register
       ANI  01h      ; keep bit 0 “key pressed”
       JZ   WAIT     ; 0 — not yet, poll again
       IN   00h      ; 1 — read the key code
       OUT  01h      ; and show it on the screen`,pollNote:"In our simulator (tab 7) the keyboard is simplified: port 00h immediately returns the code of the next “pressed” key, or 0 if there are no key presses."});Object.assign(ui.en.arch,{nodesBtn:"Processor units",nodesHint:"Click a unit — it is highlighted on the diagram with a blue frame and its description opens.",nodesClose:"Hide list"});ui.en.langSoon="Translation will be added later";ui.en.x={bitWord:"bit",tetrad:"nibble",hiByte:"high byte",loByte:"low byte",wordLbl:"word: 16 bits = 2 bytes",callBit:"↑ bit",callPos:"↑ bit position 5, weight 2⁵ = 32",callMsb:"↑ most significant (MSB), weight 2¹⁵",callLsb:"least significant (LSB), weight 1 ↑",callWidth:"width = 16 bits → numbers from 0 to 65,535",decimal:"decimal",fValue:"value",fInt:"integer",fFrac:"fraction",fExp:"exponent",fMant:"mantissa",ctrl:{0:"null character, often the end of a text in memory",7:"beep (bell)",8:"Backspace",9:"tab",10:"line feed (LF)",13:"carriage return (CR)",27:"Escape",127:"delete (DEL)"},diff30:"difference 0011 0000b = 30h",bit5:"↑ bit 5",portKbd:"⌨ port 00h: 'i'",dataLbl:"data",alu:"ALU",cellHL:" — memory cell at the address in HL",pswNote:" (in PUSH/POP, PSW replaces SP: A + flags)",mNote:"**M** is not a register but a memory cell whose address is held in the HL pair. Code 110.",alsoMov:" (and also MOV B, A → 47h)",fNote:"The flag register cannot be addressed directly: it is saved and restored together with A by PUSH PSW / POP PSW.",spPcNote:"The 16-bit registers SP and PC are specified implicitly or by the RP field (SP = 11).",b256:"256 B",portLines:"(A0–A7 and A8–A15)",select:"select",stackLbl:"stack",oneStage:"One stage"};// Preset program sources (comments in the interface language; code unchanged)
ui.en.presetSrc={copy:`; Loading constants and copying between registers
        MVI  A, 2Ah     ; A ← 2Ah (the constant is inside the instruction)
        MOV  B, A       ; B ← A   (register → register)
        MOV  C, B       ; C ← B
        MVI  D, 'Z'     ; D ← code of character 'Z' (5Ah)
        HLT             ; halt the processor`,add:`; Adding two numbers from the data area
        LDA  NUM1       ; A ← [NUM1]   (memory → register)
        MOV  B, A       ; B ← A
        LDA  NUM2       ; A ← [NUM2]
        ADD  B          ; A ← A + B
        STA  SUM        ; [SUM] ← A    (register → memory)
        HLT

        ORG  0080h      ; ---- data area ----
NUM1:   DB   25         ; first addend
NUM2:   DB   17         ; second addend
SUM:    DB   0          ; the sum goes here`,sub:`; Subtraction: negative result and flags
        MVI  A, 5       ; A = 5
        SUI  7          ; 5 − 7 = −2 → A = FEh, CY = 1 (borrow), S = 1
        STA  RES1       ; FEh is −2 in two's complement
        MVI  A, 7
        SUI  7          ; 7 − 7 = 0 → Z = 1
        STA  RES2
        HLT

        ORG  0080h
RES1:   DB   0
RES2:   DB   0FFh`,char:`; Printing characters on the screen (port 01h)
        MVI  A, 'H'     ; code of character 'H' = 48h
        OUT  01h        ; send the byte to the screen
        LDA  SYM        ; take a character from the data area
        OUT  01h
        HLT

        ORG  0080h
SYM:    DB   'i'        ; the character is stored as the number 69h`,hl:`; Memory access through the HL pointer (MOV r,M / MOV M,r)
        LXI  H, SRC     ; HL ← address of SRC
        MOV  A, M       ; A ← [HL]
        INX  H          ; HL ← HL + 1 (next cell)
        MOV  B, M       ; B ← [HL]
        LXI  H, DST
        MOV  M, A       ; [HL] ← A
        HLT

        ORG  0080h
SRC:    DB   11h, 22h
DST:    DB   0`,loop:`; Loop: sum 5 + 4 + 3 + 2 + 1
        MVI  B, 5       ; counter N = 5
        MVI  A, 0       ; sum = 0
LOOP:   ADD  B          ; A ← A + B
        DCR  B          ; B ← B − 1 (changes flag Z)
        JNZ  LOOP       ; if B ≠ 0, repeat
        STA  RES        ; save the result
        HLT

        ORG  0080h
RES:    DB   0`,mult:`; Multiplying 6 × 7 by addition (the 8080 has no MUL instruction)
        MVI  B, 6       ; multiplicand
        MVI  C, 7       ; multiplier = how many times to add
        MVI  A, 0       ; product = 0
LOOP:   ADD  B          ; A ← A + 6
        DCR  C          ; one time fewer left
        JNZ  LOOP       ; while C ≠ 0
        STA  RES        ; 42 = 2Ah
        HLT

        ORG  0080h
RES:    DB   0`,string:`; Printing a string: a loop with an exit condition
        LXI  H, MSG     ; HL points to the start of the string
NEXT:   MOV  A, M       ; A ← next character
        CPI  0          ; end of string? (code 0)
        JZ   DONE       ; yes, leave the loop
