    // --- BJT: Ebers-Moll (transport form) with Early effect -------------------
    function bjtModel(p) {

        bf: bf,

      var it = m.IS * (ef - er) * early;
      var ic = it - m.IS / m.br * er;
      var ib = m.IS / m.bf * ef + m.IS / m.br * er;

        ib: ib,

    function smallSignal(fam, q, params) {

      var ro2 = (1 / mm.lambda + q.vce) / Math.max(q.ic, 1e-15);

        gm: gm2,
        rpi: Infinity,
